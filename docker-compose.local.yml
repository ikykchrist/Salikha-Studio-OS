services:
  db:
    image: postgres:17-alpine
    container_name: salikha-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salikha
      POSTGRES_USER: salikha
      POSTGRES_PASSWORD: salikha_local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - salikha_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salikha -d salikha"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  salikha_postgres_data:
