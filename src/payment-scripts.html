<!-- payment-scripts.html
     Payments + Receivables controller (Sprint 3). -->

<script>
(function () {
  'use strict';

  var state = {
    payPage: 1,
    recPage: 1,
    activeTab: 'payments'
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(v) {
    return BKG_UI.esc(v);
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data);
          }
        } else {
          APP.toast(toastMessageFromResponse(response, 'payments'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        APP.toast(toastMessageFromResponse(err, 'payments', true), 'error');
      });
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function loadPayments() {
    callServer('getPayments', {
      search: el('payments-search').value.trim(),
      paymentMethod: el('payments-method-filter').value,
      status: el('payments-status-filter').value,
      page: state.payPage
    }, renderPayments);
  }

  function renderPayments(data) {
    var tbody = el('payments-table-body');
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">' +
        '<p class="empty-title">No payments yet</p>' +
        '<p class="empty-hint">Record a payment from a booking to start the payment history.</p></div></td></tr>';
      el('payments-pagination').innerHTML = '';
      return;
    }
    var clientNames = {};
    for (var i = 0; i < window.BOOKINGS && window.BOOKINGS.getClients ? 0 : 0; i++) { /* noop */ }
    var html = '';
    for (var p = 0; p < data.items.length; p++) {
      html += paymentRow(data.items[p]);
    }
    tbody.innerHTML = html;
    renderPagination('payments-pagination', data, function (page) {
      state.payPage = page;
      loadPayments();
    });
  }

  function paymentRow(p) {
    return '<tr>' +
      '<td><div class="cell-main">' + esc(p.paymentCode) + '</div><div class="cell-sub">' + esc(p.referenceNumber || '') + '</div></td>' +
      '<td>' + esc(p.paymentDate || '') + '</td>' +
      '<td>' + esc(p.clientId) + '</td>' +
      '<td>' + esc(BKG_UI.titleCase(p.paymentMethod)) + '</td>' +
      '<td class="num">' + BKG_UI.money(p.amount) + '</td>' +
      '<td>' + BKG_UI.statusBadge(p.status) + '</td>' +
      '<td><div class="row-actions">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-payment-view="' + esc(p.paymentId) + '">View</button>' +
      (p.status === 'POSTED'
        ? '<button class="btn btn-ghost btn-sm text-danger" type="button" data-payment-void="' + esc(p.paymentId) + '">Void</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-payment-refund="' + esc(p.paymentId) + '">Refund</button>'
        : '') +
      '</div></td></tr>';
  }

  function loadReceivables() {
    callServer('getReceivables', {
      mode: el('receivables-mode-filter').value,
      page: state.recPage
    }, renderReceivables);
  }

  function renderReceivables(data) {
    var tbody = el('receivables-table-body');
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">' +
        '<p class="empty-title">No matching receivables</p>' +
        '<p class="empty-hint">Adjust the filter to see more bookings.</p></div></td></tr>';
      el('receivables-pagination').innerHTML = '';
      return;
    }
    tbody.innerHTML = data.items.map(BKG_UI.receivableRowTpl).join('');
    renderPagination('receivables-pagination', data, function (page) {
      state.recPage = page;
      loadReceivables();
    });
  }

  function renderPagination(containerId, data, onPage) {
    var container = el(containerId);
    if (!container) {
      return;
    }
    var totalPages = Math.max(Math.ceil(data.total / data.pageSize), 1);
    if (totalPages <= 1) {
      container.innerHTML = '<span class="pagination-info">' + data.total + ' record(s)</span>';
      return;
    }
    container.innerHTML = '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page - 1) + '"' + (data.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<span class="pagination-info">Page ' + data.page + ' of ' + totalPages + '</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page + 1) + '"' + (data.page >= totalPages ? ' disabled' : '') + '>Next</button>';
    var buttons = container.querySelectorAll('[data-page]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        var page = Number(this.getAttribute('data-page'));
        if (page >= 1 && page <= totalPages) {
          onPage(page);
        }
      });
    }
  }

  function showTab(tab) {
    state.activeTab = tab;
    el('pay-payments-section').hidden = tab !== 'payments';
    el('pay-receivables-section').hidden = tab !== 'receivables';
    var tabs = document.querySelectorAll('#view-payments [data-pay-tab]');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-pay-tab') === tab);
    }
    if (tab === 'payments') {
      loadPayments();
    } else {
      loadReceivables();
    }
  }

  function onPaymentsClick(event) {
    var target = event.target;
    var tab = target.closest('[data-pay-tab]');
    if (tab) {
      showTab(tab.getAttribute('data-pay-tab'));
      return;
    }
    var action = target.closest('[data-pay-action="record"]');
    if (action) {
      openPickBooking();
      return;
    }
    var view = target.closest('[data-payment-view]');
    if (view) {
      showPaymentDetail(view.getAttribute('data-payment-view'));
      return;
    }
    var v = target.closest('[data-payment-void]');
    if (v) {
      openVoidPayment(v.getAttribute('data-payment-void'));
      return;
    }
    var r = target.closest('[data-payment-refund]');
    if (r) {
      openRefund(r.getAttribute('data-payment-refund'));
      return;
    }
    var pay = target.closest('[data-receivable-pay]');
    if (pay) {
      window.BOOKINGS.openRecordPayment(pay.getAttribute('data-receivable-pay'));
      return;
    }
    var bookingView = target.closest('[data-booking-view]');
    if (bookingView) {
      window.BOOKINGS.openBookingDetail(bookingView.getAttribute('data-booking-view'));
    }
  }

  function openPickBooking() {
    callServer('getBookings', { pageSize: 100 }, function (data) {
      var html = '<form id="pick-booking-form" class="finance-form" novalidate>' +
        '<div class="field"><label class="field-label">Booking</label><select class="field-select" id="pb-booking">' +
        '<option value="">Select a booking</option>' +
        data.items.map(function (b) {
          return '<option value="' + esc(b.bookingId) + '">' + esc(b.bookingTitle || b.bookingCode) + ' - ' + esc(b.eventDate || 'no date') + ' (' + BKG_UI.money(b.balanceDueCached) + ' due)</option>';
        }).join('') + '</select></div>' +
        '<div class="field-error" id="pb-error" hidden></div></form>';
      var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="finance-modal-confirm">Continue</button>';
      APP.openModal(UI.modal('Record payment', html, footer));
      el('finance-modal-confirm').addEventListener('click', function () {
        var bookingId = el('pb-booking').value;
        if (!bookingId) {
          el('pb-error').textContent = 'Select a booking.';
          el('pb-error').hidden = false;
          return;
        }
        APP.closeModal();
        window.BOOKINGS.openRecordPayment(bookingId);
      });
    });
  }

  function showPaymentDetail(paymentId) {
    callServer('getPayment', paymentId, function (payment) {
      var body = '<div class="profile-grid">' +
        '<div class="profile-item"><span class="profile-label">Payment</span><span class="profile-value">' + esc(payment.paymentCode) + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Date</span><span class="profile-value">' + esc(payment.paymentDate || '') + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Method</span><span class="profile-value">' + esc(BKG_UI.titleCase(payment.paymentMethod)) + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Type</span><span class="profile-value">' + esc(BKG_UI.titleCase(payment.paymentType)) + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Amount</span><span class="profile-value">' + BKG_UI.money(payment.amount) + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Status</span><span class="profile-value">' + esc(payment.status) + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Reference</span><span class="profile-value">' + esc(payment.referenceNumber || '-') + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Payer</span><span class="profile-value">' + esc(payment.payerName || '-') + '</span></div>' +
        '<div class="profile-item"><span class="profile-label">Cash transaction</span><span class="profile-value">' + esc(payment.cashTransactionId || '-') + '</span></div>' +
        (payment.status === 'VOIDED' ? '<div class="profile-item"><span class="profile-label">Void reason</span><span class="profile-value">' + esc(payment.voidReason || '-') + '</span></div>' : '') +
        '</div>';
      var footer = '<button class="btn btn-secondary" type="button" id="finance-modal-confirm">Close</button>';
      APP.openModal(UI.modal('Payment details', body, footer));
      el('finance-modal-confirm').addEventListener('click', APP.closeModal);
    });
  }

  function openVoidPayment(paymentId) {
    var body = '<form id="void-payment-form" class="finance-form" novalidate>' +
      '<p>Void this payment? Its linked cash transaction will also be voided and the booking balance recalculated.</p>' +
      '<div class="field"><label class="field-label">Void reason</label><input class="field-input" type="text" id="vp-reason" maxlength="300" required></div>' +
      '<div class="field-error" id="vp-error" hidden></div></form>';
    var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-danger" type="button" id="finance-modal-confirm">Confirm void</button>';
    APP.openModal(UI.modal('Void payment', body, footer));
    el('finance-modal-confirm').addEventListener('click', function (e) {
      var reason = el('vp-reason').value.trim();
      if (!reason) {
        el('vp-error').textContent = 'A void reason is required.';
        el('vp-error').hidden = false;
        return;
      }
      e.target.disabled = true;
      callServer('voidBookingPayment', { paymentId: paymentId, voidReason: reason }, function () {
        APP.toast('Payment voided. Cash effect reversed.', 'success');
        APP.closeModal();
        loadPayments();
      });
    });
  }

  function openRefund(paymentId) {
    callServer('getRefundEligibility', { paymentId: paymentId }, function (eligibility) {
      if (eligibility.refundableAmount <= 0) {
        APP.toast('No refundable amount remains for this payment.', 'info');
        return;
      }
      callServer('getPayment', paymentId, function (payment) {
        callServer('getCashAccounts', undefined, function (accounts) {
          var body = BKG_UI.refundFormTpl(payment, eligibility, accounts);
          var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
            '<button class="btn btn-primary" type="button" id="finance-modal-confirm">Record refund</button>';
          APP.openModal(UI.modal('Record refund', body, footer));
          el('finance-modal-confirm').addEventListener('click', function (e) {
            var amount = Number(el('rf-amount').value);
            var reason = el('rf-reason').value.trim();
            if (!amount || amount <= 0) {
              el('rf-error').textContent = 'Refund amount must be greater than zero.';
              el('rf-error').hidden = false;
              return;
            }
            if (!reason) {
              el('rf-error').textContent = 'A refund reason is required.';
              el('rf-error').hidden = false;
              return;
            }
            e.target.disabled = true;
            callServer('recordRefund', {
              paymentId: payment.paymentId,
              amount: amount,
              refundDate: el('rf-date').value,
              cashAccountId: el('rf-account').value,
              reason: reason,
              idempotencyKey: 'RFN-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
            }, function () {
              APP.toast('Refund recorded and posted to the cash ledger.', 'success');
              APP.closeModal();
              loadPayments();
            });
          });
        });
      });
    });
  }

  var activated = false;

  function activate() {
    if (!activated) {
      activated = true;
      el('view-payments').addEventListener('click', onPaymentsClick);
      ['payments-search', 'payments-method-filter', 'payments-status-filter'].forEach(function (id) {
        var node = el(id);
        if (node) {
          node.addEventListener('input', function () {
            state.payPage = 1;
            loadPayments();
          });
        }
      });
      el('receivables-mode-filter').addEventListener('change', function () {
        state.recPage = 1;
        loadReceivables();
      });
      var methodFilter = el('payments-method-filter');
      for (var m = 0; m < BKG_UI.PAYMENT_METHODS.length; m++) {
        methodFilter.appendChild(new Option(BKG_UI.titleCase(BKG_UI.PAYMENT_METHODS[m]), BKG_UI.PAYMENT_METHODS[m]));
      }
      var statusFilter = el('payments-status-filter');
      ['POSTED', 'VOIDED', 'REFUNDED', 'PARTIALLY_REFUNDED'].forEach(function (s) {
        statusFilter.appendChild(new Option(BKG_UI.titleCase(s), s));
      });
    }
    showTab(state.activeTab);
  }

  window.PAYMENTS = {
    activate: activate
  };
})();
</script>
