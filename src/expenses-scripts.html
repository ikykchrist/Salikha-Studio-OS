<!-- expenses-scripts.html
     Expenses page controller (Sprint 4). Renders approval-workflow
     KPIs and the expense register; drives create/edit/submit/approve/
     reject/pay/void via modals. Only PAID expenses mint cash - the UI
     never computes a ledger balance itself. -->

<script>
(function () {
  'use strict';

  var state = {
    initialized: false,
    expenses: [],
    categories: [],
    accounts: [],
    bookings: [],
    summary: null,
    filters: { status: '', costType: '', search: '', fromDate: '', toDate: '' },
    page: 1,
    pageSize: 25,
    total: 0
  };

  function el(id) {
    return document.getElementById(id);
  }

  function section() {
    return el('view-expenses');
  }

  function today() {
    var d = new Date();
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + month + '-' + day;
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data, response);
          }
        } else {
          handleFailure(response);
        }
      })
      .withFailureHandler(handleFailure);
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function handleFailure(response) {
    var message = toastMessageFromResponse(response, 'expenses');
    APP.toast(message, 'error');
    var status = el('expenses-status');
    if (status) {
      status.innerHTML = FIN_UI.initStateBanner({ message: message, tone: 'alert-danger' });
      status.hidden = false;
    }
  }

  function setStatus(message, tone) {
    var status = el('expenses-status');
    if (!status) {
      return;
    }
    if (message) {
      status.innerHTML = FIN_UI.initStateBanner({ message: message, tone: tone || 'alert-info' });
      status.hidden = false;
    } else {
      status.hidden = true;
      status.innerHTML = '';
    }
  }

  function formError(id, message) {
    var node = el(id);
    if (node) {
      node.textContent = message;
      node.hidden = false;
    }
  }

  /* ---------- Presentation helpers ---------- */

  function esc(value) {
    return UI.escapeHtml(value);
  }

  function statusLabel(status) {
    switch (status) {
      case 'DRAFT': return 'Draft';
      case 'SUBMITTED': return 'For approval';
      case 'APPROVED': return 'Approved';
      case 'REJECTED': return 'Rejected';
      case 'PAID': return 'Paid';
      default: return String(status || '-');
    }
  }

  function statusBadge(expense) {
    if (expense.voidedAt) {
      return UI.badge('Voided', 'danger');
    }
    var tone = 'neutral';
    var status = String(expense.approvalStatus || '');
    if (status === 'SUBMITTED') {
      tone = 'info';
    } else if (status === 'APPROVED') {
      tone = 'warning';
    } else if (status === 'REJECTED') {
      tone = 'danger';
    } else if (status === 'PAID') {
      tone = 'success';
    }
    return UI.badge(statusLabel(status), tone);
  }

  function costTypeLabel(type) {
    switch (String(type || '')) {
      case 'DIRECT': return 'Direct';
      case 'OPERATING': return 'Operating';
      case 'CAPITAL': return 'Capital';
      case 'OTHER': return 'Other';
      default: return 'Other';
    }
  }

  function bookingCode(bookingId) {
    if (!bookingId) {
      return '';
    }
    for (var i = 0; i < state.bookings.length; i++) {
      if (String(state.bookings[i].bookingId) === String(bookingId)) {
        return state.bookings[i].bookingCode;
      }
    }
    return bookingId;
  }

  function categoryName(categoryId) {
    if (!categoryId) {
      return '';
    }
    for (var i = 0; i < state.categories.length; i++) {
      if (String(state.categories[i].categoryId) === String(categoryId)) {
        return state.categories[i].categoryName;
      }
    }
    return categoryId;
  }

  /* ---------- Summary cards ---------- */

  function renderSummary(summary) {
    var counts = summary.counts || {};
    var totals = summary.totals || {};
    el('kpi-exp-drafts').textContent = String(counts.DRAFT || 0);
    el('kpi-exp-drafts-meta').textContent = 'Net total ' + FIN_UI.money(totals.DRAFT || 0);
    el('kpi-exp-approval').textContent = String(counts.SUBMITTED || 0);
    el('kpi-exp-approved').textContent = FIN_UI.money(totals.APPROVED || 0);
    el('kpi-exp-approved-meta').textContent = counts.APPROVED + ' expense(s) net of tax, ready to pay.';
    el('kpi-exp-paid').textContent = FIN_UI.money(totals.PAID || 0);
    el('kpi-exp-direct').textContent = FIN_UI.money(summary.directTotal || 0);
    el('kpi-exp-direct-meta').textContent = summary.directCount + ' expense(s) tagged to bookings.';
  }

  /* ---------- Register table ---------- */

  function renderExpenses() {
    var tableBody = el('expenses-body');
    var items = state.expenses || [];
    if (!items.length) {
      tableBody.innerHTML = '<tr><td colspan="7"><div class="empty-state">' +
        '<p class="empty-title">No expenses found</p>' +
        '<p class="empty-hint">Adjust the filters or record a new expense.</p></div></td></tr>';
      el('expenses-count').textContent = '0 expenses';
      renderPagination();
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var e = items[i];
      var actions = '<button class="btn btn-ghost btn-sm" type="button" data-expense-view="' + esc(e.expenseId) + '">View</button>';
      if (e.approvalStatus === 'DRAFT' && !e.voidedAt) {
        actions += ' <button class="btn btn-ghost btn-sm" type="button" data-expense-edit="' + esc(e.expenseId) + '">Edit</button>' +
          ' <button class="btn btn-secondary btn-sm" type="button" data-expense-submit="' + esc(e.expenseId) + '">Submit</button>';
      } else if (e.approvalStatus === 'SUBMITTED' && !e.voidedAt) {
        actions += ' <button class="btn btn-primary btn-sm" type="button" data-expense-approve="' + esc(e.expenseId) + '">Approve</button>' +
          ' <button class="btn btn-ghost btn-sm text-danger" type="button" data-expense-reject="' + esc(e.expenseId) + '">Reject</button>';
      } else if (e.approvalStatus === 'APPROVED' && !e.voidedAt) {
        actions += ' <button class="btn btn-primary btn-sm" type="button" data-expense-pay="' + esc(e.expenseId) + '">Pay</button>';
      } else if (e.approvalStatus === 'PAID' && !e.voidedAt) {
        actions += ' <button class="btn btn-ghost btn-sm text-danger" type="button" data-expense-void="' + esc(e.expenseId) + '">Void</button>';
      } else if (e.approvalStatus === 'REJECTED' && !e.voidedAt) {
        actions += ' <button class="btn btn-ghost btn-sm" type="button" data-expense-reopen="' + esc(e.expenseId) + '">Reopen</button>';
      }
      html += '<tr' + (e.voidedAt ? ' class="row-voided"' : '') + '>' +
        '<td>' + esc(e.expenseDate) + '</td>' +
        '<td>' + esc(e.description) +
        (e.supplierName ? '<div class="account-meta">' + esc(e.supplierName) + '</div>' : '') + '</td>' +
        '<td>' + esc(costTypeLabel(e.costType)) + (e.categoryId ? '<div class="account-meta">' + esc(categoryName(e.categoryId)) + '</div>' : '') + '</td>' +
        '<td>' + esc(bookingCode(e.bookingId) || '-') + '</td>' +
        '<td class="num">' + FIN_UI.money(e.netAmount) + '</td>' +
        '<td>' + statusBadge(e) + '</td>' +
        '<td class="row-actions">' + actions + '</td>' +
        '</tr>';
    }
    tableBody.innerHTML = html;
    el('expenses-count').textContent = state.total + ' expense(s)';
    renderPagination();
  }

  function renderPagination() {
    var pages = Math.max(Math.ceil(state.total / state.pageSize), 1);
    var html = '<span class="pagination-info">Page ' + state.page + ' of ' + pages + ' (' + state.total + ' total)</span>' +
      '<div class="btn-group">' +
      '<button class="btn btn-secondary btn-sm" type="button" data-expense-action="page-prev"' +
      (state.page <= 1 ? ' disabled' : '') + '>Previous</button>' +
      '<button class="btn btn-secondary btn-sm" type="button" data-expense-action="page-next"' +
      (state.page >= pages ? ' disabled' : '') + '>Next</button>' +
      '</div>';
    el('expenses-pagination').innerHTML = html;
  }

  /* ---------- Loading ---------- */

  function loadSummary() {
    callServer('getExpenseSummary', undefined, function (summary) {
      state.summary = summary;
      renderSummary(summary);
    });
  }

  function loadExpenses() {
    callServer('getExpenses', {
      status: state.filters.status || undefined,
      costType: state.filters.costType || undefined,
      search: state.filters.search || undefined,
      fromDate: state.filters.fromDate || undefined,
      toDate: state.filters.toDate || undefined,
      page: state.page,
      pageSize: state.pageSize
    }, function (data) {
      state.expenses = data.items;
      state.total = data.total;
      state.page = data.page;
      renderExpenses();
    });
  }

  function loadOptions() {
    callServer('getFinancialCategories', undefined, function (categories) {
      state.categories = categories;
    });
    callServer('getCashAccounts', undefined, function (accounts) {
      state.accounts = accounts;
    });
  }

  function refresh() {
    setStatus(null);
    loadSummary();
    loadExpenses();
  }

  /* ---------- Modals ---------- */

  function openModal(title, bodyHtml, footerHtml) {
    APP.openModal(UI.modal(title, bodyHtml, footerHtml));
  }

  function openConfirm(title, bodyHtml, confirmLabel, danger, onConfirm) {
    var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="' + (danger ? 'btn btn-danger' : 'btn btn-primary') + '" type="button" id="expense-modal-confirm">' + esc(confirmLabel) + '</button>';
    openModal(title, bodyHtml, footer);
    var confirmBtn = el('expense-modal-confirm');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function () {
        if (onConfirm) {
          onConfirm(confirmBtn);
        }
      });
    }
  }

  /* ---------- Create / edit ---------- */

  function categoryOptionsFor(costType, selectedId) {
    var groups = [];
    for (var i = 0; i < state.categories.length; i++) {
      var c = state.categories[i];
      if (c.isActive === false) {
        continue;
      }
      var type = String(c.categoryType || '');
      var include = type === 'OPERATING_EXPENSE' || type === 'DIRECT_COST' || type === 'CAPITAL_EXPENSE';
      if (costType === 'OTHER') {
        include = true;
      }
      if (!include) {
        continue;
      }
      var selected = selectedId && String(selectedId) === String(c.categoryId) ? ' selected' : '';
      groups.push('<option value="' + esc(c.categoryId) + '"' + selected + '>' + esc(c.categoryName) + '</option>');
    }
    groups.unshift('<option value="">No category</option>');
    return groups.join('');
  }

  function bookingOptions(selectedId) {
    var options = '<option value="">&mdash; (not linked)</option>';
    for (var i = 0; i < state.bookings.length; i++) {
      var b = state.bookings[i];
      var selected = selectedId && String(selectedId) === String(b.bookingId) ? ' selected' : '';
      options += '<option value="' + esc(b.bookingId) + '"' + selected + '>' +
        esc(b.bookingCode) + ' - ' + esc(b.bookingTitle) +
        (b.eventDate ? ' (' + esc(b.eventDate) + ')' : '') + '</option>';
    }
    return options;
  }

  function readBookingOptions() {
    if (state.bookings.length) {
      return;
    }
    callServer('getBookings', { excludeCancelled: true, pageSize: 100, page: 1 }, function (data) {
      state.bookings = data.items;
      var bookingSelect = el('ef-booking');
      if (bookingSelect && !bookingSelect.value) {
        bookingSelect.innerHTML = bookingOptions('');
      }
    });
  }

  function openExpenseForm(expense) {
    readBookingOptions();
    var values = expense || {};
    var costType = expense ? String(expense.costType || 'OPERATING') : 'OPERATING';
    var net = expense ? (Number(expense.grossAmount || 0) - Number(expense.taxAmount || 0)) : 0;
    var bookingDisabledHtml = costType === 'DIRECT' ? '' : ' disabled';

    var body =
      '<form id="expense-form" class="finance-form" novalidate>' +
      '<div class="field"><label class="field-label">Description *</label>' +
      '<textarea class="field-textarea" id="ef-description" maxlength="300" required>' + esc(values.description || '') + '</textarea></div>' +
      '<div class="field"><label class="field-label">Expense date</label>' +
      '<input class="field-input" type="date" id="ef-date" value="' + esc(values.expenseDate || today()) + '"></div>' +
      '<div class="field"><label class="field-label">Cost type *</label>' +
      '<select class="field-select" id="ef-costtype">' +
      '<option value="DIRECT"' + (costType === 'DIRECT' ? ' selected' : '') + '>Direct (booking cost)</option>' +
      '<option value="OPERATING"' + (costType === 'OPERATING' ? ' selected' : '') + '>Operating</option>' +
      '<option value="CAPITAL"' + (costType === 'CAPITAL' ? ' selected' : '') + '>Capital</option>' +
      '<option value="OTHER"' + (costType === 'OTHER' ? ' selected' : '') + '>Other</option>' +
      '</select></div>' +
      '<div class="field"><label class="field-label">Booking (required for Direct)</label>' +
      '<select class="field-select" id="ef-booking"' + bookingDisabledHtml + '>' + bookingOptions(values.bookingId) + '</select></div>' +
      '<div class="field"><label class="field-label">Category</label>' +
      '<select class="field-select" id="ef-category">' + categoryOptionsFor(costType, values.categoryId) + '</select></div>' +
      '<div class="detail-grid">' +
      '<div class="field"><label class="field-label">Gross amount *</label>' +
      '<input class="field-input num-input" type="number" min="0" step="0.01" id="ef-gross" value="' + esc(values.grossAmount || '') + '" placeholder="0.00"></div>' +
      '<div class="field"><label class="field-label">Tax amount</label>' +
      '<input class="field-input num-input" type="number" min="0" step="0.01" id="ef-tax" value="' + esc(values.taxAmount || '') + '" placeholder="0.00"></div>' +
      '</div>' +
      '<div class="recon-readonly" id="ef-net">Net amount (gross - tax): ' + FIN_UI.money(net) + '</div>' +
      '<div class="field"><label class="field-label">Supplier (optional)</label>' +
      '<input class="field-input" type="text" id="ef-supplier" maxlength="120" value="' + esc(values.supplierName || '') + '"></div>' +
      '<div class="field-error" id="ef-error" hidden></div>' +
      '</form>';

    openModal(expense ? 'Edit expense' : 'New expense', body,
      '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" id="expense-modal-save">' + (expense ? 'Save draft' : 'Create draft') + '</button>');

    wireExpenseForm();
    var saveBtn = el('expense-modal-save');
    if (saveBtn) {
      saveBtn.addEventListener('click', function () {
        submitExpenseForm(expense ? expense.expenseId : '', saveBtn);
      });
    }
  }

  function wireExpenseForm() {
    var type = el('ef-costtype');
    var category = el('ef-category');
    var booking = el('ef-booking');
    if (!type || !category || !booking) {
      return;
    }
    type.addEventListener('change', function () {
      category.innerHTML = categoryOptionsFor(type.value);
      var isDirect = type.value === 'DIRECT';
      booking.value = '';
      booking.disabled = !isDirect;
      if (!isDirect) {
        booking.innerHTML = bookingOptions('');
      }
    });
    var gross = el('ef-gross');
    var tax = el('ef-tax');
    if (gross && tax) {
      gross.addEventListener('input', updateNetPreview);
      tax.addEventListener('input', updateNetPreview);
    }
    updateNetPreview();
  }

  function updateNetPreview() {
    var gross = el('ef-gross');
    var tax = el('ef-tax');
    var net = el('ef-net');
    if (!gross || !tax || !net) {
      return;
    }
    var value = Number(gross.value || 0) - Number(tax.value || 0);
    net.textContent = 'Net amount (gross - tax): ' + FIN_UI.money(Math.max(value, 0));
  }

  function submitExpenseForm(expenseId, saveBtn) {
    var description = el('ef-description').value.trim();
    if (!description) {
      formError('ef-error', 'A description is required.');
      return;
    }
    var gross = Number(el('ef-gross').value);
    if (isNaN(gross) || gross < 0) {
      formError('ef-error', 'Gross amount must be zero or more.');
      return;
    }
    var costType = el('ef-costtype').value;
    var bookingId = el('ef-booking').value;
    if (costType === 'DIRECT' && !bookingId) {
      formError('ef-error', 'A direct cost must be tagged to a booking.');
      return;
    }
    saveBtn.disabled = true;
    var payload = {
      description: description,
      expenseDate: el('ef-date').value || today(),
      costType: costType,
      bookingId: bookingId || undefined,
      categoryId: el('ef-category').value || undefined,
      grossAmount: gross,
      taxAmount: Number(el('ef-tax').value || 0),
      supplierName: el('ef-supplier').value.trim()
    };
    var fn = expenseId ? 'updateExpense' : 'createExpense';
    if (expenseId) {
      payload.expenseId = expenseId;
    } else {
      payload.idempotencyKey = 'EXP-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    }
    callServer(fn, payload, function () {
      APP.toast(expenseId ? 'Expense updated.' : 'Expense created as a draft. No cash moved.', 'success');
      APP.closeModal();
      refresh();
    });
  }

  /* ---------- Status transitions ---------- */

  function openRejectModal(expenseId) {
    var body = '<p class="section-hint">Rejected expenses return to Draft for rework.</p>' +
      '<div class="field"><label class="field-label">Rejection reason *</label>' +
      '<textarea class="field-textarea" id="er-reason" maxlength="300" required></textarea></div>' +
      '<div class="field-error" id="er-error" hidden></div>';
    openConfirm('Reject expense', body, 'Reject expense', true, function (confirmBtn) {
      var reason = el('er-reason').value.trim();
      if (!reason) {
        formError('er-error', 'A rejection reason is required.');
        return;
      }
      confirmBtn.disabled = true;
      callServer('rejectExpense', { expenseId: expenseId, reason: reason }, function () {
        APP.toast('Expense rejected and moved back to drafts.', 'success');
        APP.closeModal();
        refresh();
      });
    });
  }

  function openPayModal(expenseId, record) {
    var accounts = state.accounts.filter(function (a) {
      return a.isActive !== false;
    });
    var body =
      '<p class="section-hint">Paying this expense mints one VERIFIED EXPENSE cash outflow of ' + FIN_UI.money(record.netAmount) + ' on the chosen account.</p>' +
      '<div class="field"><label class="field-label">Paid from *</label>' +
      '<select class="field-select" id="ep-account">' + FIN_UI.accountOptions(accounts) + '</select></div>' +
      '<div class="field"><label class="field-label">Payment method *</label>' +
      '<select class="field-select" id="ep-method">' +
      '<option value="CASH">Cash</option>' +
      '<option value="BANK_TRANSFER">Bank transfer</option>' +
      '<option value="E_WALLET">E-wallet</option>' +
      '<option value="CHEQUE">Cheque</option>' +
      '</select></div>' +
      '<div class="field"><label class="field-label">Paid date</label>' +
      '<input class="field-input" type="date" id="ep-date" value="' + esc(record.expenseDate || today()) + '"></div>' +
      '<div class="alert alert-info mt-2">Separation of duties: the approver cannot be the payer.</div>' +
      '<div class="field-error" id="ep-error" hidden></div>';
    openConfirm('Pay expense', body, 'Confirm payment', true, function (confirmBtn) {
      confirmBtn.disabled = true;
      callServer('payExpense', {
        expenseId: expenseId,
        cashAccountId: el('ep-account').value,
        paymentMethod: el('ep-method').value,
        paidDate: el('ep-date').value || today()
      }, function () {
        APP.toast('Expense paid. Cash outflow posted to the ledger.', 'success');
        APP.closeModal();
        refresh();
      });
    });
  }

  function openVoidModal(expenseId, record) {
    var body =
      '<p class="section-hint">Void expense ' + esc(record.expenseCode) + ' (' + FIN_UI.money(record.netAmount) + ')? ' +
      (record.approvalStatus === 'PAID'
        ? 'The linked cash transaction is voided with it and the ledger balance is recalculated. The record stays visible forever.'
        : 'The record stays visible forever and never enters the ledger.') + '</p>' +
      '<div class="field"><label class="field-label">Void reason *</label>' +
      '<textarea class="field-textarea" id="ev-reason" maxlength="300" required></textarea></div>' +
      '<div class="field-error" id="ev-error" hidden></div>';
    openConfirm('Void expense', body, 'Confirm void', true, function (confirmBtn) {
      var reason = el('ev-reason').value.trim();
      if (!reason) {
        formError('ev-error', 'A void reason is required.');
        return;
      }
      confirmBtn.disabled = true;
      callServer('voidExpense', { expenseId: expenseId, voidReason: reason }, function () {
        APP.toast('Expense voided. History preserved.', 'success');
        APP.closeModal();
        refresh();
      });
    });
  }

  /* ---------- Detail view ---------- */

  function openDetailModal(expenseId) {
    callServer('getExpense', expenseId, function (e) {
      function row(label, value) {
        return '<tr><th>' + esc(label) + '</th><td>' + value + '</td></tr>';
      }
      var html = '<table class="data-table detail-table">' +
        row('Expense', esc(e.expenseCode)) +
        row('Date', esc(e.expenseDate)) +
        row('Description', esc(e.description)) +
        row('Cost type', esc(costTypeLabel(e.costType))) +
        row('Category', esc(e.categoryName || categoryName(e.categoryId) || '-')) +
        row('Booking', esc(bookingCode(e.bookingId) || '-')) +
        row('Supplier', esc(e.supplierName || '-')) +
        row('Gross amount', FIN_UI.money(e.grossAmount)) +
        row('Tax amount', FIN_UI.money(e.taxAmount)) +
        row('Net amount', FIN_UI.money(e.netAmount)) +
        row('Status', statusBadge(e)) +
        row('Cash transaction', e.cashTransactionId ? esc(e.cashTransactionId) + (e.cashTransaction && e.cashTransaction.status === 'VOIDED' ? ' (voided)' : '') : '-') +
        row('Created by', esc(e.createdBy || '-')) +
        row('Created at', esc(e.createdAt || '-'));
      if (e.approvedAt) {
        html += row('Approved by', esc(e.approvedBy || '-')) +
          row('Approved at', esc(e.approvedAt));
      }
      if (e.paidAt) {
        html += row('Paid from', esc(accountName(e.paidFromAccountId))) +
          row('Payment method', esc(e.paymentMethod || '-')) +
          row('Paid at', esc(e.paidAt));
      }
      if (e.rejectedReason) {
        html += row('Rejection reason', esc(e.rejectedReason));
      }
      if (e.voidedAt) {
        html += row('Voided by', esc(e.voidedBy || '-')) +
          row('Voided at', esc(e.voidedAt)) +
          row('Void reason', esc(e.voidReason || '-'));
      }
      html += '</table>';

      var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Close</button>';
      if (e.cashTransactionId) {
        footer += '<button class="btn btn-secondary" type="button" id="expense-modal-tx">View cash transaction</button>';
      }
      if (e.approvalStatus === 'DRAFT' && !e.voidedAt) {
        footer += '<button class="btn btn-secondary" type="button" data-expense-edit="' + esc(e.expenseId) + '">Edit</button>' +
          '<button class="btn btn-primary" type="button" data-expense-submit="' + esc(e.expenseId) + '">Submit</button>';
      } else if (e.approvalStatus === 'SUBMITTED' && !e.voidedAt) {
        footer += '<button class="btn btn-primary" type="button" data-expense-approve="' + esc(e.expenseId) + '">Approve</button>' +
          '<button class="btn btn-danger" type="button" data-expense-reject="' + esc(e.expenseId) + '">Reject</button>';
      } else if (e.approvalStatus === 'APPROVED' && !e.voidedAt) {
        footer += '<button class="btn btn-primary" type="button" data-expense-pay="' + esc(e.expenseId) + '">Pay</button>';
      } else if (e.approvalStatus === 'PAID' && !e.voidedAt) {
        footer += '<button class="btn btn-danger" type="button" data-expense-void="' + esc(e.expenseId) + '">Void</button>';
      } else if (e.approvalStatus === 'REJECTED' && !e.voidedAt) {
        footer += '<button class="btn btn-secondary" type="button" data-expense-reopen="' + esc(e.expenseId) + '">Reopen</button>';
      }
      openModal('Expense details', html, footer);

      var txBtn = el('expense-modal-tx');
      if (txBtn) {
        txBtn.addEventListener('click', function () {
          var txId = e.cashTransactionId;
          callServer('getCashTransaction', txId, function (tx) {
            var accountMap = {};
            var categoryMap = {};
            for (var i = 0; i < state.accounts.length; i++) {
              accountMap[state.accounts[i].accountId] = state.accounts[i].accountName;
            }
            for (var c = 0; c < state.categories.length; c++) {
              categoryMap[state.categories[c].categoryId] = state.categories[c].categoryName;
            }
            openConfirm('Cash transaction', FIN_UI.detailViewTpl(tx, accountMap, categoryMap), 'Close', false, function (confirmBtn) {
              APP.closeModal();
            });
          });
        });
      }
    });
  }

  function accountName(accountId) {
    for (var i = 0; i < state.accounts.length; i++) {
      if (String(state.accounts[i].accountId) === String(accountId)) {
        return state.accounts[i].accountName;
      }
    }
    return String(accountId || '-');
  }

  /* ---------- Events ---------- */

  function handleAction(btn) {
    var action = btn.getAttribute('data-expense-action');
    if (action === 'new') {
      openExpenseForm(null);
    } else if (action === 'clear-filters') {
      state.filters = { status: '', costType: '', search: '', fromDate: '', toDate: '' };
      state.page = 1;
      el('exp-filter-status').value = '';
      el('exp-filter-type').value = '';
      el('exp-filter-search').value = '';
      el('exp-filter-from').value = '';
      el('exp-filter-to').value = '';
      refresh();
    } else if (action === 'page-prev') {
      if (state.page > 1) {
        state.page--;
        loadExpenses();
      }
    } else if (action === 'page-next') {
      state.page++;
      loadExpenses();
    }
  }

  function dispatchExpenseButton(btn) {
    if (btn.hasAttribute('data-expense-view')) {
      openDetailModal(btn.getAttribute('data-expense-view'));
      return;
    }
    if (btn.hasAttribute('data-expense-edit')) {
      callServer('getExpense', btn.getAttribute('data-expense-edit'), function (e) {
        openExpenseForm(e);
      });
      return;
    }
    if (btn.hasAttribute('data-expense-submit')) {
      openConfirm('Submit expense', '<p class="section-hint">Submitting sends this expense for approval. No cash moves.</p>', 'Submit for approval', false, function (confirmBtn) {
        confirmBtn.disabled = true;
        transitionServer('submitExpense', { expenseId: btn.getAttribute('data-expense-submit') }, 'Expense submitted for approval.');
      });
      return;
    }
    if (btn.hasAttribute('data-expense-approve')) {
      openConfirm('Approve expense', '<p class="section-hint">Approval does not move cash; a finance role must then pay it.</p>', 'Approve', false, function (confirmBtn) {
        confirmBtn.disabled = true;
        transitionServer('approveExpense', { expenseId: btn.getAttribute('data-expense-approve') }, 'Expense approved.');
      });
      return;
    }
    if (btn.hasAttribute('data-expense-reject')) {
      openRejectModal(btn.getAttribute('data-expense-reject'));
      return;
    }
    if (btn.hasAttribute('data-expense-pay')) {
      callServer('getExpense', btn.getAttribute('data-expense-pay'), function (e) {
        openPayModal(e.expenseId, e);
      });
      return;
    }
    if (btn.hasAttribute('data-expense-reopen')) {
      openConfirm('Reopen expense', '<p class="section-hint">Moves the rejected expense back to Draft for rework.</p>', 'Reopen', false, function (confirmBtn) {
        confirmBtn.disabled = true;
        transitionServer('reopenExpense', { expenseId: btn.getAttribute('data-expense-reopen') }, 'Expense reopened for rework.');
      });
      return;
    }
    if (btn.hasAttribute('data-expense-void')) {
      callServer('getExpense', btn.getAttribute('data-expense-void'), function (e) {
        openVoidModal(e.expenseId, e);
      });
    }
  }

  function onSectionClick(event) {
    var target = event.target;
    var actionBtn = target.closest('[data-expense-action]');
    if (actionBtn) {
      handleAction(actionBtn);
      return;
    }
    var rowBtn = target.closest(
      '[data-expense-view],[data-expense-edit],[data-expense-submit],' +
      '[data-expense-approve],[data-expense-reject],[data-expense-pay],' +
      '[data-expense-reopen],[data-expense-void]');
    if (rowBtn) {
      dispatchExpenseButton(rowBtn);
    }
  }

  function transitionServer(fnName, payload, successMsg) {
    callServer(fnName, payload, function () {
      APP.toast(successMsg, 'success');
      APP.closeModal();
      refresh();
    });
  }

  function onFilterChange() {
    state.page = 1;
    debouncedLoad();
  }

  var debounceTimer = null;
  function debouncedLoad() {
    if (debounceTimer) {
      clearTimeout(debounceTimer);
    }
    debounceTimer = setTimeout(function () {
      loadExpenses();
    }, 250);
  }

  /* ---------- Lifecycle ---------- */

  var activated = false;

  function activate() {
    if (!activated) {
      activated = true;
      section().addEventListener('click', onSectionClick);
      var region = el('modal-region');
      region.addEventListener('click', function (event) {
        var btn = event.target.closest(
          '[data-expense-view],[data-expense-edit],[data-expense-submit],' +
          '[data-expense-approve],[data-expense-reject],[data-expense-pay],' +
          '[data-expense-reopen],[data-expense-void]');
        if (btn) {
          event.stopImmediatePropagation();
          dispatchExpenseButton(btn);
        }
      });
      el('exp-filter-status').addEventListener('change', function () {
        state.filters.status = this.value;
        onFilterChange();
      });
      el('exp-filter-type').addEventListener('change', function () {
        state.filters.costType = this.value;
        onFilterChange();
      });
      el('exp-filter-search').addEventListener('input', function () {
        state.filters.search = this.value.trim();
        onFilterChange();
      });
      el('exp-filter-from').addEventListener('change', function () {
        state.filters.fromDate = this.value;
        onFilterChange();
      });
      el('exp-filter-to').addEventListener('change', function () {
        state.filters.toDate = this.value;
        onFilterChange();
      });
      loadOptions();
      if (el('expenses-body').childElementCount === 0) {
        el('expenses-body').innerHTML = '<tr><td colspan="7"><div class="empty-state"><p class="empty-title">Loading expenses&hellip;</p></div></td></tr>';
      }
      refresh();
    } else {
      refresh();
    }
  }

  window.EXPENSES = {
    activate: activate,
    refresh: refresh
  };
})();
</script>
