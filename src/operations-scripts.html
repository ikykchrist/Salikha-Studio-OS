<!-- operations-scripts.html
     Production + Deployments controller (Sprint 6, WF-4/WF-5).
     Production: per-booking task checklist and the ready-to-deploy gate.
     Deployments: lifecycle (PLANNED -> LOADING -> IN_PROGRESS ->
     RETURNED -> RECONCILED), material loading, checklist, incidents,
     and return reconciliation. Only reconciliation moves inventory and
     updates booking material cost; every other state is operational
     planning. The frontend never computes money or stock itself. -->

<script>
(function () {
  'use strict';

  var state = {
    refsLoaded: false,
    clients: [],
    bookings: [],
    equipment: [],
    production: {
      bookings: [],
      tasks: [],
      page: 1,
      pageSize: 25,
      total: 0,
      search: '',
      selected: null,
      ready: false
    },
    deployments: {
      all: [],
      filtered: [],
      page: 1,
      pageSize: 25,
      status: '',
      search: '',
      workspaceId: null
    }
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(value) {
    return UI.escapeHtml(value);
  }

  function bool(value) {
    return value === true || String(value) === 'TRUE' || String(value) === 'true';
  }

  function money(value) {
    return '\u20B1' + Number(value || 0).toFixed(2);
  }

  function hydrateIcons(root) {
    var nodes = (root || document).querySelectorAll('[data-icon]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].innerHTML = UI.icon(nodes[i].getAttribute('data-icon'));
    }
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data, response);
          }
        } else {
          handleFailure(response);
        }
      })
      .withFailureHandler(handleFailure);
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function handleFailure(response) {
    var message = toastMessageFromResponse(response, 'operations');
    APP.toast(message, 'error');
    setStatus('prod-status', message, 'error');
    setStatus('deploy-status', message, 'error');
  }

  function setStatus(containerId, message, tone) {
    var node = el(containerId);
    if (!node) {
      return;
    }
    if (message) {
      node.innerHTML = UI.alert(message, tone || 'info');
      node.hidden = false;
    } else {
      node.hidden = true;
      node.innerHTML = '';
    }
  }

  function statusBadge(status, toneMap) {
    var map = toneMap || {};
    return UI.badge(String(status || '-'), map[String(status)] || 'neutral');
  }

  var PROD_TONES = { INQUIRY: 'neutral', TENTATIVE: 'info', CONFIRMED: 'info', PREPARING: 'warning', READY: 'success', IN_PROGRESS: 'info', COMPLETED: 'success', CANCELLED: 'danger', ARCHIVED: 'neutral' };
  var DEPLOY_TONES = { PLANNED: 'neutral', LOADING: 'info', IN_PROGRESS: 'warning', RETURNED: 'info', RECONCILED: 'success', CLOSED: 'success' };
  var TASK_TONES = { OPEN: 'warning', DONE: 'success', CANCELLED: 'neutral' };
  var SEVERITY_TONES = { LOW: 'info', MEDIUM: 'warning', HIGH: 'danger', CRITICAL: 'danger' };

  /* ================================================================
     Reference maps (clients, bookings, equipment) - loaded once
     ================================================================ */

  function pageLoop(fnName, pageSize, limit, onDone) {
    var collected = [];
    var page = 1;
    function next() {
      callServer(fnName, { page: page, pageSize: pageSize }, function (data) {
        var items = data.items || data || [];
        for (var i = 0; i < items.length; i++) {
          collected.push(items[i]);
        }
        if (items.length >= pageSize && collected.length < limit) {
          page++;
          next();
          return;
        }
        onDone(collected);
      });
    }
    next();
  }

  function ensureRefs(done) {
    if (state.refsLoaded) {
      if (done) {
        done();
      }
      return;
    }
    var pending = 3;
    function countDown() {
      pending--;
      if (pending === 0) {
        state.refsLoaded = true;
        if (done) {
          done();
        }
      }
    }
    pageLoop('getClients', 100, 500, function (items) {
      state.clients = items;
      countDown();
    });
    pageLoop('getBookings', 100, 1000, function (items) {
      state.bookings = items;
      countDown();
    });
    pageLoop('getEquipmentList', 100, 500, function (items) {
      state.equipment = items;
      countDown();
    });
  }

  function clientName(clientId) {
    if (!clientId) {
      return '';
    }
    for (var i = 0; i < state.clients.length; i++) {
      if (String(state.clients[i].clientId) === String(clientId)) {
        return state.clients[i].fullName || state.clients[i].businessOrOrganization || clientId;
      }
    }
    return clientId;
  }

  function bookingRef(bookingId) {
    if (!bookingId) {
      return '-';
    }
    for (var i = 0; i < state.bookings.length; i++) {
      if (String(state.bookings[i].bookingId) === String(bookingId)) {
        var b = state.bookings[i];
        return (b.bookingCode || b.bookingId) + (b.bookingTitle ? ' - ' + b.bookingTitle : '');
      }
    }
    return bookingId;
  }

  function equipmentName(equipmentId) {
    if (!equipmentId) {
      return '-';
    }
    for (var i = 0; i < state.equipment.length; i++) {
      if (String(state.equipment[i].equipmentId) === String(equipmentId)) {
        return state.equipment[i].name || equipmentId;
      }
    }
    return equipmentId;
  }

  /* ================================================================
     PRODUCTION
     ================================================================ */

  function loadProductionBookings() {
    callServer('getBookings', {
      search: state.production.search || undefined,
      excludeCancelled: true,
      page: state.production.page,
      pageSize: state.production.pageSize
    }, function (data) {
      state.production.bookings = data.items || [];
      state.production.total = data.total || 0;
      state.production.page = data.page || 1;
      renderProductionList();
    });
  }

  function renderProductionList() {
    var body = el('prod-body');
    var items = state.production.bookings || [];
    el('prod-count').textContent = state.production.total + ' booking(s)';

    if (!items.length) {
      body.innerHTML = '<tr><td colspan="6">' + UI.emptyState('production', 'No bookings found',
        'Confirm a booking to begin production preparation.', '') + '</td></tr>';
      hydrateIcons(body);
      renderProductionPagination();
      return;
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      var deployed = b.productionStatus === 'READY_TO_DEPLOY' || b.deploymentStatus;
      html += '<tr>' +
        '<td>' + esc(b.bookingCode || b.bookingId) + '<div class="account-meta">' + esc(b.bookingTitle || '') + '</div></td>' +
        '<td>' + esc(clientName(b.clientId)) + '</td>' +
        '<td>' + esc(b.eventDate || '-') + '</td>' +
        '<td>' + (deployed
          ? UI.badge('Deployment created', 'success')
          : UI.badge('Not planned', 'neutral')) + '</td>' +
        '<td>' + statusBadge(b.bookingStatus, PROD_TONES) + '</td>' +
        '<td><button class="btn btn-secondary btn-sm" type="button" data-prod-open="' + esc(b.bookingId) + '">Production</button></td>' +
        '</tr>';
    }
    body.innerHTML = html;
    renderProductionPagination();
  }

  function renderProductionPagination() {
    var node = el('prod-pagination');
    var totalPages = Math.max(1, Math.ceil(state.production.total / state.production.pageSize));
    node.innerHTML = '<span class="pagination-meta">Page ' + state.production.page + ' of ' + totalPages +
      ' (' + state.production.total + ' total)</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-prod-page="prev"' + (state.production.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-prod-page="next"' + (state.production.page >= totalPages ? ' disabled' : '') + '>Next</button>';
  }

  function openProduction(bookingId) {
    var booking = null;
    for (var i = 0; i < state.production.bookings.length; i++) {
      if (String(state.production.bookings[i].bookingId) === String(bookingId)) {
        booking = state.production.bookings[i];
        break;
      }
    }
    state.production.selected = booking || { bookingId: bookingId };
    el('prod-register').hidden = true;
    el('prod-task-area').hidden = false;
    setStatus('prod-status', null);
    el('prod-task-title').textContent = 'Production tasks';
    el('prod-task-hint').textContent = (booking ? (booking.bookingCode + ' - ' + (booking.bookingTitle || '')) : bookingId) + ' - ' + esc(clientName(booking ? booking.clientId : ''));
    el('prod-task-actions').innerHTML = '<button class="btn btn-ghost btn-sm" type="button" data-prod-back="1">Back to register</button>';
    el('prod-tasks-list').innerHTML = '<p class="section-hint">Loading tasks&hellip;</p>';
    loadTasks(bookingId);
  }

  function closeProduction() {
    el('prod-task-area').hidden = true;
    el('prod-register').hidden = false;
    state.production.selected = null;
    loadProductionBookings();
  }

  function loadTasks(bookingId) {
    callServer('getTasks', { bookingId: bookingId, pageSize: 200 }, function (data) {
      state.production.tasks = data.items || [];
      renderTasks();
    });
  }

  function renderTasks() {
    var list = el('prod-tasks-list');
    var tasks = state.production.tasks || [];
    var required = 0;
    var requiredDone = 0;
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      if (bool(t.isRequired)) {
        required++;
        if (String(t.status) === 'DONE') {
          requiredDone++;
        }
      }
    }
    var ready = required > 0 && requiredDone === required;
    state.production.ready = ready;
    var readiness = el('prod-readiness');
    readiness.textContent = ready ? 'READY' : (requiredDone + '/' + required + ' required done');
    readiness.className = 'badge ' + (ready ? 'badge-success' : 'badge-warning');

    var actionsHtml =
      '<button class="btn btn-ghost btn-sm" type="button" data-prod-back="1">Back to register</button>' +
      '<button class="btn btn-secondary btn-sm" type="button" data-prod-plan="' + esc(state.production.selected.bookingId) + '">Plan tasks</button>' +
      (ready
        ? '<button class="btn btn-primary btn-sm" type="button" data-prod-ready="' + esc(state.production.selected.bookingId) + '">Mark ready to deploy</button>'
        : '');
    el('prod-task-actions').innerHTML = actionsHtml;

    if (!tasks.length) {
      list.innerHTML = UI.emptyState('production', 'No tasks planned',
        'Plan tasks from the booking services, then complete the required ones.', '');
      hydrateIcons(list);
      return;
    }

    var html = '<div class="table-wrap"><table class="data-table"><thead><tr>' +
      '<th>Required</th><th>Task</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    for (var j = 0; j < tasks.length; j++) {
      var task = tasks[j];
      var isRequired = bool(task.isRequired);
      var rowActions = '';
      if (String(task.status) === 'OPEN') {
        rowActions = '<button class="btn btn-ghost btn-sm" type="button" data-task-done="' + esc(task.taskId) + '">Mark done</button>' +
          '<button class="btn btn-ghost btn-sm text-danger" type="button" data-task-cancel="' + esc(task.taskId) + '">Cancel</button>';
      } else if (String(task.status) === 'DONE') {
        rowActions = '<button class="btn btn-ghost btn-sm" type="button" data-task-reopen="' + esc(task.taskId) + '">Reopen</button>';
      }
      html += '<tr>' +
        '<td>' + (isRequired ? UI.badge('Required', 'warning') : UI.badge('Optional', 'neutral')) + '</td>' +
        '<td>' + esc(task.title) + '</td>' +
        '<td>' + esc(task.taskType || '-') + '</td>' +
        '<td>' + statusBadge(task.status, TASK_TONES) + '</td>' +
        '<td>' + rowActions + '</td></tr>';
    }
    html += '</tbody></table></div>';
    list.innerHTML = html;
  }

  function planProduction(bookingId) {
    callServer('planProduction', bookingId, function () {
      APP.toast('Production tasks planned.', 'success');
      loadTasks(bookingId);
    });
  }

  function markReady(bookingId) {
    callServer('markReadyToDeploy', bookingId, function () {
      APP.toast('Booking production-ready. Deployment created.', 'success');
      loadTasks(bookingId);
    });
  }

  function completeTask(taskId) {
    callServer('completeTask', { taskId: taskId }, function () {
      loadTasks(state.production.selected.bookingId);
    });
  }

  function reopenTask(taskId) {
    callServer('reopenTask', { taskId: taskId }, function () {
      loadTasks(state.production.selected.bookingId);
    });
  }

  function cancelTask(taskId) {
    var reason = window.prompt('Reason for cancelling this task?');
    if (reason === null) {
      return;
    }
    callServer('cancelTask', { taskId: taskId, reason: reason }, function () {
      loadTasks(state.production.selected.bookingId);
    });
  }

  /* ================================================================
     DEPLOYMENTS
     ================================================================ */

  function loadDeploymentsData() {
    callServer('getDeployments', { page: 1, pageSize: 100 }, function (data) {
      state.deployments.all = data.items || [];
      applyDeploymentFilters();
    });
  }

  function applyDeploymentFilters() {
    var all = state.deployments.all || [];
    var status = state.deployments.status;
    var search = String(state.deployments.search || '').toLowerCase();
    var filtered = [];
    for (var i = 0; i < all.length; i++) {
      var d = all[i];
      if (status && String(d.status) !== String(status)) {
        continue;
      }
      if (search) {
        var ref = String(bookingRef(d.bookingId) || '').toLowerCase();
        if (ref.indexOf(search) === -1 && String(d.deploymentId).toLowerCase().indexOf(search) === -1) {
          continue;
        }
      }
      filtered.push(d);
    }
    state.deployments.filtered = filtered;
    state.deployments.total = filtered.length;
    var totalPages = Math.max(1, Math.ceil(filtered.length / state.deployments.pageSize));
    if (state.deployments.page > totalPages) {
      state.deployments.page = totalPages;
    }
    renderDeploymentsList();
  }

  function renderDeploymentsList() {
    var body = el('deploy-body');
    var start = (state.deployments.page - 1) * state.deployments.pageSize;
    var items = state.deployments.filtered.slice(start, start + state.deployments.pageSize);
    el('deploy-count').textContent = state.deployments.total + ' deployment(s)';

    if (!items.length) {
      body.innerHTML = '<tr><td colspan="6">' + UI.emptyState('deployments', 'No deployments found',
        'Deployments are created automatically when a booking becomes production-ready.', '') + '</td></tr>';
      hydrateIcons(body);
      renderDeploymentPagination();
      return;
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var d = items[i];
      html += '<tr>' +
        '<td>' + esc(d.deploymentId) + '</td>' +
        '<td>' + esc(bookingRef(d.bookingId)) + '</td>' +
        '<td>' + esc(d.scheduledDate || '-') + '</td>' +
        '<td>' + statusBadge(d.status, DEPLOY_TONES) + '</td>' +
        '<td class="num">' + money(d.actualMaterialCost) + '</td>' +
        '<td><button class="btn btn-secondary btn-sm" type="button" data-deploy-open="' + esc(d.deploymentId) + '">Open</button></td>' +
        '</tr>';
    }
    body.innerHTML = html;
    renderDeploymentPagination();
  }

  function renderDeploymentPagination() {
    var node = el('deploy-pagination');
    var totalPages = Math.max(1, Math.ceil(state.deployments.total / state.deployments.pageSize));
    node.innerHTML = '<span class="pagination-meta">Page ' + state.deployments.page + ' of ' + totalPages +
      ' (' + state.deployments.total + ' total)</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-deploy-page="prev"' + (state.deployments.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-deploy-page="next"' + (state.deployments.page >= totalPages ? ' disabled' : '') + '>Next</button>';
  }

  function openDeploymentWorkspace(deploymentId) {
    state.deployments.workspaceId = deploymentId;
    el('deploy-register').hidden = true;
    setStatus('deploy-status', null);
    var container = el('deploy-workspace');
    container.innerHTML = '<div class="card mt-4"><button class="btn btn-ghost btn-sm" type="button" data-deploy-back="1">Back to register</button>' +
      '<p class="section-hint mt-2">Loading deployment&hellip;</p></div>';
    container.hidden = false;
    callServer('getDeployment', deploymentId, function (d) {
      renderDeploymentWorkspace(d);
    });
  }

  function closeDeploymentWorkspace() {
    el('deploy-workspace').hidden = true;
    el('deploy-register').hidden = false;
    state.deployments.workspaceId = null;
    loadDeploymentsData();
  }

  function refreshDeployment() {
    if (state.deployments.workspaceId) {
      openDeploymentWorkspace(state.deployments.workspaceId);
    }
  }

  function renderDeploymentWorkspace(d) {
    var container = el('deploy-workspace');
    var head =
      '<div class="card mt-4"><div class="card-head">' +
      '<h3 class="card-title">' + esc(d.deploymentId) + '</h3>' +
      statusBadge(d.status, DEPLOY_TONES) + '</div>' +
      '<p class="section-hint">Booking ' + esc(bookingRef(d.bookingId)) +
      ' - scheduled ' + esc(d.scheduledDate || '-') + '. Reconciliation posts inventory and the booking material cost.</p>' +
      '<div class="detail-badges mt-2">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-deploy-back="1">Back to register</button>' +
      renderDeploymentActions(d) +
      '</div></div>';

    container.innerHTML = head + renderMaterials(d) + renderEquipment(d) + renderChecklist(d) + renderIncidents(d);
    container.hidden = false;
  }

  function renderDeploymentActions(d) {
    var status = String(d.status || '');
    var html = '';
    if (status === 'PLANNED') {
      html += '<button class="btn btn-primary btn-sm" type="button" data-deploy-start="' + esc(d.deploymentId) + '">Start loading</button>';
    } else if (status === 'LOADING') {
      html += '<button class="btn btn-primary btn-sm" type="button" data-deploy-depart="' + esc(d.deploymentId) + '">Depart to event</button>';
    } else if (status === 'IN_PROGRESS') {
      html += '<button class="btn btn-primary btn-sm" type="button" data-deploy-return="' + esc(d.deploymentId) + '">Mark returned</button>';
    } else if (status === 'RETURNED') {
      html += '<button class="btn btn-danger btn-sm" type="button" data-deploy-reconcile="' + esc(d.deploymentId) + '">Reconcile</button>';
    } else if (status === 'RECONCILED') {
      html += '<span class="badge badge-neutral">Immutable - corrections use inventory adjustments</span>';
    }
    return html;
  }

  function renderMaterials(d) {
    var items = d.items || [];
    var editable = d.status === 'PLANNED' || d.status === 'LOADING';
    var html = '<div class="card mt-4"><div class="card-head"><h3 class="card-title">Materials</h3>' +
      '<span class="badge badge-neutral">' + items.length + ' item(s)</span></div>';
    if (editable) {
      html += '<div class="filter-row"><button class="btn btn-secondary btn-sm" type="button" data-deploy-additem="' + esc(d.deploymentId) + '">Add material</button></div>';
    }
    if (!items.length) {
      html += '<p class="section-hint">No materials loaded yet. Add inventory items to the loading deck.</p>';
    } else {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Item</th><th>Projected</th><th>Loaded</th><th>Returned</th><th>Consumed</th><th class="num">Unit cost</th><th class="num">Cost</th>' +
        (editable ? '<th>Actions</th>' : '') +
        '</tr></thead><tbody>';
      for (var i = 0; i < items.length; i++) {
        var m = items[i];
        html += '<tr>' +
          '<td>' + esc(m.itemName || m.itemId) + '</td>' +
          '<td>' + esc(m.projectedQty) + '</td>' +
          '<td>' + esc(m.loadedQty) + '</td>' +
          '<td>' + esc(m.returnedQty) + '</td>' +
          '<td>' + esc(m.consumedQty) + '</td>' +
          '<td class="num">' + money(m.unitCost) + '</td>' +
          '<td class="num">' + money(m.cost) + '</td>' +
          (editable
            ? '<td><button class="btn btn-ghost btn-sm" type="button" data-deploy-item="' + esc(m.deploymentItemId) + '">Edit</button></td>'
            : '') +
          '</tr>';
      }
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderEquipment(d) {
    var equipment = d.equipment || [];
    var editable = d.status === 'PLANNED' || d.status === 'LOADING';
    var html = '<div class="card mt-4"><div class="card-head"><h3 class="card-title">Equipment</h3>' +
      '<span class="badge badge-neutral">' + equipment.length + ' unit(s)</span></div>';
    if (editable) {
      html += '<button class="btn btn-secondary btn-sm" type="button" data-deploy-addequip="' + esc(d.deploymentId) + '">Add equipment</button>';
    }
    if (!equipment.length) {
      html += '<p class="section-hint">No equipment assigned to this deployment.</p>';
    } else {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Equipment</th><th>Condition out</th><th>Condition in</th><th>Notes</th></tr></thead><tbody>';
      for (var i = 0; i < equipment.length; i++) {
        var eq = equipment[i];
        html += '<tr>' +
          '<td>' + esc(equipmentName(eq.equipmentId)) + '</td>' +
          '<td>' + esc(eq.conditionOut || '-') + '</td>' +
          '<td>' + esc(eq.conditionIn || '-') + '</td>' +
          '<td>' + esc(eq.notes || '-') + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderChecklist(d) {
    var check = d.checklist || [];
    var html = '<div class="card mt-4"><div class="card-head"><h3 class="card-title">Checklist</h3>' +
      '<span class="badge badge-neutral">' + check.length + ' item(s)</span></div>' +
      '<button class="btn btn-secondary btn-sm" type="button" data-deploy-addcheck="' + esc(d.deploymentId) + '">Add checklist item</button>';
    if (!check.length) {
      html += '<p class="section-hint">No checklist items. Required items must be done to reconcile.</p>';
    } else {
      html += '<div class="checklist">';
      for (var i = 0; i < check.length; i++) {
        var c = check[i];
        var done = bool(c.isDone);
        html += '<label class="checklist-row">' +
          '<input type="checkbox" data-check-toggle="' + esc(c.checklistItemId) + '"' + (done ? ' checked' : '') + '>' +
          ' <span class="checklist-label">' + (bool(c.isRequired) ? UI.badge('Required', 'warning') + ' ' : '') + esc(c.itemName) + '</span>' +
          '</label>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderIncidents(d) {
    var incidents = d.incidents || [];
    var html = '<div class="card mt-4"><div class="card-head"><h3 class="card-title">Incidents</h3>' +
      '<span class="badge badge-neutral">' + incidents.length + ' incident(s)</span></div>' +
      '<button class="btn btn-secondary btn-sm" type="button" data-deploy-loginc="' + esc(d.deploymentId) + '">Log incident</button>';
    if (!incidents.length) {
      html += '<p class="section-hint">No incidents logged for this deployment.</p>';
    } else {
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Severity</th><th>Title</th><th>Description</th><th>Action taken</th><th>Resolved</th></tr></thead><tbody>';
      for (var i = 0; i < incidents.length; i++) {
        var inc = incidents[i];
        html += '<tr>' +
          '<td>' + statusBadge(inc.severity, SEVERITY_TONES) + '</td>' +
          '<td>' + esc(inc.title) + '</td>' +
          '<td>' + esc(inc.description || '-') + '</td>' +
          '<td>' + esc(inc.actionTaken || '-') + '</td>' +
          '<td>' + (bool(inc.resolved)
            ? UI.badge('Resolved', 'success')
            : '<button class="btn btn-ghost btn-sm" type="button" data-deploy-resolve="' + esc(inc.incidentId) + '">Resolve</button>') + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  /* ================================================================
     Deployment lifecycle actions
     ================================================================ */

  function startLoading(deploymentId) {
    callServer('startDeploymentLoading', { deploymentId: deploymentId }, function () {
      APP.toast('Loading started. Loaded quantities editable.', 'success');
      refreshDeployment();
    });
  }

  function departDeployment(deploymentId) {
    callServer('departDeployment', { deploymentId: deploymentId }, function () {
      APP.toast('Deployment departed. Loaded quantities locked.', 'success');
      refreshDeployment();
    });
  }

  function markReturned(deploymentId) {
    callServer('getDeployment', deploymentId, function (d) {
      var items = d.items || [];
      if (!items.length) {
        APP.openModal(UI.modal('Mark deployment returned',
          '<p class="section-hint">No materials were loaded on this deployment. Confirm the return to close the event loop.</p>' +
          '<div class="field-error" id="ops-return-error" hidden></div>',
          '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
          '<button class="btn btn-primary" type="button" id="ops-return-save">Mark returned</button>'));
        el('ops-return-save').addEventListener('click', function () {
          postReturned(deploymentId, []);
        });
        return;
      }
      var rows = '';
      for (var i = 0; i < items.length; i++) {
        var m = items[i];
        rows += '<tr>' +
          '<td>' + esc(m.itemName || m.itemId) + '</td>' +
          '<td class="num">' + esc(m.loadedQty) + '</td>' +
          '<td><input class="field-input num-input" type="number" min="0" max="' + esc(m.loadedQty) +
          '" step="any" data-return-item="' + esc(m.deploymentItemId) + '" data-return-max="' + esc(m.loadedQty) + '" value="' + esc(m.loadedQty || 0) + '"></td>' +
          '</tr>';
      }
      var body =
        '<p class="section-hint">Enter how many of each loaded item came back. Consumed = loaded - returned.</p>' +
        '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Item</th><th class="num">Loaded</th><th class="num">Returned</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>' +
        '<div class="field-error" id="ops-return-error" hidden></div>';
      APP.openModal(UI.modal('Mark deployment returned', body,
        '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="ops-return-save">Mark returned</button>'));
      el('ops-return-save').addEventListener('click', function () {
        var inputs = document.querySelectorAll('[data-return-item]');
        var quantities = [];
        var invalid = false;
        for (var j = 0; j < inputs.length; j++) {
          var inp = inputs[j];
          var qty = Number(inp.value);
          var max = Number(inp.getAttribute('data-return-max') || 0);
          if (qty < 0 || qty > max) {
            invalid = true;
            break;
          }
          quantities.push({ deploymentItemId: inp.getAttribute('data-return-item'), returnedQty: qty });
        }
        if (invalid) {
          el('ops-return-error').textContent = 'Returned quantity must be between 0 and the loaded quantity.';
          el('ops-return-error').hidden = false;
          return;
        }
        postReturned(deploymentId, quantities);
      });
    });
  }

  function postReturned(deploymentId, quantities) {
    callServer('markDeploymentReturned', {
      deploymentId: deploymentId,
      returnedQuantities: quantities
    }, function () {
      APP.closeModal();
      APP.toast('Deployment returned. Returned quantities captured.', 'success');
      refreshDeployment();
    });
  }

  function reconcileDeployment(deploymentId) {
    openConfirm('Reconcile deployment', 'Posts inventory usage and updates the booking material cost. This is permanent.',
      'Reconcile', true, function (btn) {
        btn.disabled = true;
        callServer('reconcileDeployment', { deploymentId: deploymentId }, function () {
          APP.toast('Deployment reconciled. Inventory adjusted.', 'success');
          APP.closeModal();
          refreshDeployment();
        });
      });
  }

  /* ================================================================
     Modals
     ================================================================ */

  function openModal(title, bodyHtml, footerHtml) {
    APP.openModal(UI.modal(title, bodyHtml, footerHtml));
  }

  function openConfirm(title, bodyHtml, confirmLabel, danger, onConfirm) {
    var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="' + (danger ? 'btn btn-danger' : 'btn btn-primary') + '" type="button" id="ops-modal-confirm">' + esc(confirmLabel) + '</button>';
    openModal(title, bodyHtml, footer);
    var confirmBtn = el('ops-modal-confirm');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function () {
        if (onConfirm) {
          onConfirm(confirmBtn);
        }
      });
    }
  }

  function openAddMaterial(deploymentId) {
    callServer('getInventoryItems', { pageSize: 100 }, function (data) {
      var items = data.items || [];
      if (!items.length) {
        APP.toast('No inventory items available. Add stock items in Inventory first.', 'error');
        return;
      }
      var options = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i].item || items[i];
        options += '<option value="' + esc(item.itemId) + '">' + esc(item.name) + ' (' + esc(item.sku) + ')</option>';
      }
      var body =
        '<form id="ops-material-form" class="finance-form" novalidate>' +
        '<div class="field"><label class="field-label">Inventory item *</label>' +
        '<select class="field-select" id="ops-mat-item">' + options + '</select></div>' +
        '<div class="detail-grid">' +
        '<div class="field"><label class="field-label">Projected quantity</label>' +
        '<input class="field-input num-input" type="number" min="0" step="any" id="ops-mat-projected" value="0"></div>' +
        '<div class="field"><label class="field-label">Loaded quantity</label>' +
        '<input class="field-input num-input" type="number" min="0" step="any" id="ops-mat-loaded" value="0"></div>' +
        '</div>' +
        '<div class="field-error" id="ops-mat-error" hidden></div>' +
        '</form>';
      openModal('Add material', body,
        '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="ops-mat-save">Add</button>');
      el('ops-mat-save').addEventListener('click', function () {
        var projected = Number(el('ops-mat-projected').value);
        var loaded = Number(el('ops-mat-loaded').value);
        if (!el('ops-mat-item').value || projected < 0 || loaded < 0) {
          el('ops-mat-error').textContent = 'Pick an item; quantities cannot be negative.';
          el('ops-mat-error').hidden = false;
          return;
        }
        callServer('addDeploymentItem', {
          deploymentId: deploymentId,
          itemId: el('ops-mat-item').value,
          projectedQty: projected,
          loadedQty: loaded
        }, function () {
          APP.closeModal();
          refreshDeployment();
        });
      });
    });
  }

  function openEditMaterial(deploymentId, deploymentItemId) {
    callServer('getDeployment', deploymentId, function (d) {
      var item = null;
      for (var i = 0; i < (d.items || []).length; i++) {
        if (String(d.items[i].deploymentItemId) === String(deploymentItemId)) {
          item = d.items[i];
          break;
        }
      }
      if (!item) {
        return;
      }
      var body =
        '<form id="ops-material-form" class="finance-form" novalidate>' +
        '<div class="field"><label class="field-label">Inventory item</label>' +
        '<input class="field-input" type="text" value="' + esc(item.itemName || item.itemId) + '" disabled></div>' +
        '<div class="detail-grid">' +
        '<div class="field"><label class="field-label">Projected quantity</label>' +
        '<input class="field-input num-input" type="number" min="0" step="any" id="ops-mat-projected" value="' + esc(item.projectedQty) + '"></div>' +
        '<div class="field"><label class="field-label">Loaded quantity</label>' +
        '<input class="field-input num-input" type="number" min="0" step="any" id="ops-mat-loaded" value="' + esc(item.loadedQty) + '"></div>' +
        '</div>' +
        '<div class="field-error" id="ops-mat-error" hidden></div>' +
        '</form>';
      openModal('Edit material', body,
        '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="ops-mat-save">Save</button>');
      el('ops-mat-save').addEventListener('click', function () {
        var projected = Number(el('ops-mat-projected').value);
        var loaded = Number(el('ops-mat-loaded').value);
        if (projected < 0 || loaded < 0) {
          el('ops-mat-error').textContent = 'Quantities cannot be negative.';
          el('ops-mat-error').hidden = false;
          return;
        }
        callServer('updateDeploymentItem', {
          deploymentId: deploymentId,
          deploymentItemId: deploymentItemId,
          projectedQty: projected,
          loadedQty: loaded
        }, function () {
          APP.closeModal();
          refreshDeployment();
        });
      });
    });
  }

  function openAddEquipment(deploymentId) {
    callServer('getEquipmentList', { pageSize: 100 }, function (data) {
      var equipment = data.items || [];
      if (!equipment.length) {
        APP.toast('No equipment registered yet.', 'error');
        return;
      }
      var options = '';
      for (var i = 0; i < equipment.length; i++) {
        options += '<option value="' + esc(equipment[i].equipmentId) + '">' + esc(equipment[i].name) + '</option>';
      }
      var body =
        '<form id="ops-equip-form" class="finance-form" novalidate>' +
        '<div class="field"><label class="field-label">Equipment *</label>' +
        '<select class="field-select" id="ops-equip-item">' + options + '</select></div>' +
        '<div class="field"><label class="field-label">Condition out</label>' +
        '<select class="field-select" id="ops-equip-cond"><option>GOOD</option><option>FAIR</option><option>DAMAGED</option></select></div>' +
        '<div class="field"><label class="field-label">Notes</label>' +
        '<input class="field-input" type="text" id="ops-equip-notes" maxlength="200"></div>' +
        '<div class="field-error" id="ops-equip-error" hidden></div>' +
        '</form>';
      openModal('Assign equipment', body,
        '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="ops-equip-save">Add</button>');
      el('ops-equip-save').addEventListener('click', function () {
        if (!el('ops-equip-item').value) {
          el('ops-equip-error').textContent = 'Pick an equipment unit.';
          el('ops-equip-error').hidden = false;
          return;
        }
        callServer('addDeploymentEquipment', {
          deploymentId: deploymentId,
          equipmentId: el('ops-equip-item').value,
          conditionOut: el('ops-equip-cond').value,
          notes: el('ops-equip-notes').value
        }, function () {
          APP.closeModal();
          refreshDeployment();
        });
      });
    });
  }

  function openAddChecklist(deploymentId) {
    var body =
      '<form id="ops-check-form" class="finance-form" novalidate>' +
      '<div class="field"><label class="field-label">Item name *</label>' +
      '<input class="field-input" type="text" id="ops-check-name" maxlength="200"></div>' +
      '<div class="field"><label class="form-check"><input type="checkbox" id="ops-check-req" checked> Required to reconcile</label></div>' +
      '<div class="field-error" id="ops-check-error" hidden></div>' +
      '</form>';
    openModal('Add checklist item', body,
      '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" id="ops-check-save">Add</button>');
    el('ops-check-save').addEventListener('click', function () {
      var name = el('ops-check-name').value;
      if (!String(name || '').trim()) {
        el('ops-check-error').textContent = 'Item name is required.';
        el('ops-check-error').hidden = false;
        return;
      }
      callServer('addDeploymentChecklistItem', {
        deploymentId: deploymentId,
        itemName: name,
        isRequired: !!el('ops-check-req').checked
      }, function () {
        APP.closeModal();
        refreshDeployment();
      });
    });
  }

  function setChecklistDone(checklistItemId, done) {
    callServer('setDeploymentChecklistItemDone', { checklistItemId: checklistItemId, done: done }, function () {
      refreshDeployment();
    });
  }

  function openLogIncident(deploymentId) {
    var body =
      '<form id="ops-inc-form" class="finance-form" novalidate>' +
      '<div class="field"><label class="field-label">Severity *</label>' +
      '<select class="field-select" id="ops-inc-severity"><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div>' +
      '<div class="field"><label class="field-label">Title *</label>' +
      '<input class="field-input" type="text" id="ops-inc-title" maxlength="200"></div>' +
      '<div class="field"><label class="field-label">Description</label>' +
      '<textarea class="field-textarea" id="ops-inc-desc" maxlength="500"></textarea></div>' +
      '<div class="field"><label class="field-label">Action taken</label>' +
      '<textarea class="field-textarea" id="ops-inc-action" maxlength="500"></textarea></div>' +
      '<div class="field-error" id="ops-inc-error" hidden></div>' +
      '</form>';
    openModal('Log incident', body,
      '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" id="ops-inc-save">Log</button>');
    el('ops-inc-save').addEventListener('click', function () {
      var title = el('ops-inc-title').value;
      if (!String(title || '').trim()) {
        el('ops-inc-error').textContent = 'A title is required.';
        el('ops-inc-error').hidden = false;
        return;
      }
      callServer('logDeploymentIncident', {
        deploymentId: deploymentId,
        severity: el('ops-inc-severity').value,
        title: title,
        description: el('ops-inc-desc').value,
        actionTaken: el('ops-inc-action').value
      }, function () {
        APP.closeModal();
        refreshDeployment();
      });
    });
  }

  function resolveIncident(incidentId) {
    callServer('resolveDeploymentIncident', { incidentId: incidentId }, function () {
      APP.toast('Incident resolved.', 'success');
      refreshDeployment();
    });
  }

  /* ================================================================
     Event dispatch
     ================================================================ */

  function onProductionClick(event) {
    var target = event.target;
    var id;
    if ((id = target.getAttribute('data-prod-open'))) {
      openProduction(id);
    } else if ((id = target.getAttribute('data-prod-plan'))) {
      planProduction(id);
    } else if ((id = target.getAttribute('data-prod-ready'))) {
      markReady(id);
    } else if ((id = target.getAttribute('data-prod-back'))) {
      closeProduction();
    } else if ((id = target.getAttribute('data-prod-page'))) {
      if (id === 'prev' && state.production.page > 1) {
        state.production.page--;
      } else if (id === 'next') {
        state.production.page++;
      }
      loadProductionBookings();
    } else if ((id = target.getAttribute('data-prod-action'))) {
      if (id === 'refresh') {
        loadProductionBookings();
      }
    } else if ((id = target.getAttribute('data-task-done'))) {
      completeTask(id);
    } else if ((id = target.getAttribute('data-task-reopen'))) {
      reopenTask(id);
    } else if ((id = target.getAttribute('data-task-cancel'))) {
      cancelTask(id);
    }
  }

  function onProductionChange(event) {
    var target = event.target;
    if (target.id === 'prod-filter-search') {
      state.production.search = target.value;
      state.production.page = 1;
      loadProductionBookings();
    }
  }

  function onDeployClick(event) {
    var target = event.target;
    var id;
    if ((id = target.getAttribute('data-deploy-open'))) {
      openDeploymentWorkspace(id);
    } else if ((id = target.getAttribute('data-deploy-back'))) {
      closeDeploymentWorkspace();
    } else if ((id = target.getAttribute('data-deploy-start'))) {
      startLoading(id);
    } else if ((id = target.getAttribute('data-deploy-depart'))) {
      departDeployment(id);
    } else if ((id = target.getAttribute('data-deploy-return'))) {
      markReturned(id);
    } else if ((id = target.getAttribute('data-deploy-reconcile'))) {
      reconcileDeployment(id);
    } else if ((id = target.getAttribute('data-deploy-additem'))) {
      openAddMaterial(id);
    } else if ((id = target.getAttribute('data-deploy-item'))) {
      openEditMaterial(state.deployments.workspaceId, id);
    } else if ((id = target.getAttribute('data-deploy-addequip'))) {
      openAddEquipment(id);
    } else if ((id = target.getAttribute('data-deploy-addcheck'))) {
      openAddChecklist(id);
    } else if ((id = target.getAttribute('data-deploy-loginc'))) {
      openLogIncident(id);
    } else if ((id = target.getAttribute('data-deploy-resolve'))) {
      resolveIncident(id);
    } else if ((id = target.getAttribute('data-deploy-page'))) {
      if (id === 'prev' && state.deployments.page > 1) {
        state.deployments.page--;
      } else if (id === 'next') {
        state.deployments.page++;
      }
      renderDeploymentsList();
    } else if ((id = target.getAttribute('data-deploy-action'))) {
      if (id === 'refresh') {
        loadDeploymentsData();
      }
    }
  }

  function onDeployChange(event) {
    var target = event.target;
    if (target.id === 'deploy-filter-status') {
      state.deployments.status = target.value;
      state.deployments.page = 1;
      applyDeploymentFilters();
    } else if (target.id === 'deploy-filter-search') {
      state.deployments.search = target.value;
      state.deployments.page = 1;
      applyDeploymentFilters();
    } else if (target.hasAttribute('data-check-toggle')) {
      setChecklistDone(target.getAttribute('data-check-toggle'), target.checked);
    }
  }

  /* ================================================================
     Activation + binding
     ================================================================ */

  function bind() {
    var prod = el('view-production');
    if (prod && !prod.dataset.opsBound) {
      prod.dataset.opsBound = '1';
      prod.addEventListener('click', onProductionClick);
      prod.addEventListener('change', onProductionChange);
    }
    var dep = el('view-deployments');
    if (dep && !dep.dataset.opsBound) {
      dep.dataset.opsBound = '1';
      dep.addEventListener('click', onDeployClick);
      dep.addEventListener('change', onDeployChange);
    }
  }

  window.OPERATIONS = {
    activateProduction: function () {
      ensureRefs(function () {
        loadProductionBookings();
      });
    },
    activateDeployments: function () {
      ensureRefs(function () {
        loadDeploymentsData();
      });
    }
  };

  bind();
})();
</script>
