<!-- calendar-page.html
     Internal booking calendar (Sprint 3): month view + upcoming list.
     No Google Calendar access. -->

<section id="view-calendar" class="view" hidden aria-label="Calendar">
  <div class="section-head">
    <div>
      <h2 class="section-title">Calendar</h2>
      <p class="section-hint">Booking events only - no Google Calendar access yet.</p>
    </div>
    <div class="section-actions">
      <label class="check-label"><input type="checkbox" id="cal-show-cancelled"> Show cancelled</label>
    </div>
  </div>
  <div class="cal-nav">
    <button class="btn btn-secondary btn-sm" type="button" id="cal-prev">Prev</button>
    <h3 class="cal-month" id="cal-month-label"></h3>
    <button class="btn btn-secondary btn-sm" type="button" id="cal-next">Next</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="card mt-4">
    <div class="card-head"><h3 class="card-title">Upcoming events</h3></div>
    <div id="cal-upcoming"></div>
  </div>
</section>
