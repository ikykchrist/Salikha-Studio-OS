<!-- dashboard-scripts.html
     R1 owner dashboard rendering (Sprint 7): money pulse, booking pulse,
     alerts, and lightweight bar-chart rendering from server data. -->

<script>
(function () {
  'use strict';

  function el(id) {
    return document.getElementById(id);
  }

  function setStatus(id, value) {
    var node = el(id);
    if (node) {
      node.textContent = String(value);
    }
  }

  function fmtMoney(n) {
    return '\u20B1' + Number(n || 0).toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function emptyChart(title, hint) {
    return '<div class="chart-placeholder">' +
      '<span class="empty-icon" data-icon="reports" aria-hidden="true"></span>' +
      '<p class="empty-title">' + UI.escapeHtml(title) + '</p>' +
      '<p class="empty-hint">' + UI.escapeHtml(hint) + '</p></div>';
  }

  /* Cash trend: 30 daily bars --------------------------------------------------- */

  function renderCash(points) {
    var max = 0;
    var min = 0;
    for (var i = 0; i < points.length; i++) {
      max = Math.max(max, points[i].balance);
      min = Math.min(min, points[i].balance);
    }
    var range = max - min || 1;
    var html = '<div class="bar-chart" role="img" aria-label="Cash balance over the last 30 days">';
    for (var d = 0; d < points.length; d++) {
      var value = points[d].balance;
      var normalized = ((value - min) / range) * 100;
      var height = normalized < 2 ? 2 : normalized;
      html += '<div class="bar-column" title="' + UI.escapeHtml(points[d].date + ': ' + fmtMoney(value)) + '">' +
        '<div class="bar' + (value < 0 ? ' bar-negative' : '') + '" style="height:' + height.toFixed(2) + '%"></div>' +
        '</div>';
    }
    html += '</div>';
    html += '<div class="chart-axis"><span>' + UI.escapeHtml(points[0].date.slice(5)) +
      '</span><span>Today</span></div>';
    return html;
  }

  /* Revenue vs direct costs: 3 grouped bar pairs --------------------------------- */

  function renderRevenueChart(rows) {
    var max = 0;
    for (var i = 0; i < rows.length; i++) {
      max = Math.max(max, rows[i].revenue, rows[i].directCosts);
    }
    var scale = max || 1;
    var html = '<div class="bar-groups" role="img" aria-label="Monthly revenue vs direct costs">';
    for (var m = 0; m < rows.length; m++) {
      var revH = Math.max(2, (rows[m].revenue / scale) * 100);
      var costH = Math.max(2, (rows[m].directCosts / scale) * 100);
      html += '<div class="bar-group">' +
        '<div class="bar-group-bars">' +
        '<div class="bar bar-primary" title="Revenue: ' + fmtMoney(rows[m].revenue) + '" style="height:' + revH.toFixed(2) + '%"></div>' +
        '<div class="bar bar-muted" title="Direct costs: ' + fmtMoney(rows[m].directCosts) + '" style="height:' + costH.toFixed(2) + '%"></div>' +
        '</div><div class="bar-group-label">' + UI.escapeHtml(rows[m].label) + '</div></div>';
    }
    html += '</div>';
    html += '<div class="chart-legend"><span><i class="legend-swatch swatch-primary"></i>Revenue</span>' +
      '<span><i class="legend-swatch swatch-muted"></i>Direct costs</span></div>';
    return html;
  }

  /* Top packages: ranked list with share bars ------------------------------------- */

  function renderTopPackages(rows) {
    var html = '<ul class="rank-list">';
    for (var i = 0; i < rows.length; i++) {
      var share = Math.min(100, Number(rows[i].sharePct) || 0);
      html += '<li class="rank-item">' +
        '<div class="rank-head"><span class="rank-name">' +
        UI.escapeHtml(rows[i].packageName || rows[i].package_name || 'Package') +
        '</span><span class="rank-value">' + fmtMoney(rows[i].revenue) + '</span></div>' +
        '<div class="rank-bar"><div class="rank-bar-fill" style="width:' + share.toFixed(2) + '%"></div></div>' +
        '<div class="rank-meta">' + share.toFixed(1) + '% of period revenue</div></li>';
    }
    html += '</ul>';
    return html;
  }

  /* Regions ------------------------------------------------------------------------ */

  function renderCharts(charts) {
    if (!charts) {
      return;
    }
    var cashRegion = el('chart-cash');
    if (cashRegion) {
      var cash = charts.cashTrend30 || [];
      cashRegion.innerHTML = cash.length
        ? renderCash(cash)
        : emptyChart('No cash trend yet', 'Cash ledger movements will appear here.');
    }
    var revenueRegion = el('chart-revenue');
    if (revenueRegion) {
      var rev = charts.revenueVsCosts3m || [];
      revenueRegion.innerHTML = rev.length
        ? renderRevenueChart(rev)
        : emptyChart('No revenue data yet', 'Confirmed bookings will appear here.');
    }
    var topRegion = el('chart-packages');
    if (topRegion) {
      var top = charts.topPackages5 || [];
      topRegion.innerHTML = top.length
        ? renderTopPackages(top)
        : emptyChart('No package revenue yet', 'Package sales will appear here.');
    }
  }

  function renderAlerts(alerts) {
    if (!alerts) {
      return;
    }
    setStatus('dash-alert-overdue', alerts.overdueReceivables === undefined ? 0 : alerts.overdueReceivables);
    setStatus('dash-alert-lowstock', alerts.lowStockItems === undefined ? 0 : alerts.lowStockItems);
    setStatus('dash-alert-deploy', alerts.unreconciledDeployments === undefined ? 0 : alerts.unreconciledDeployments);
  }

  /* Customer pulse via the legacy home summary (complements getDashboardData) -------- */

  function loadCustomerPulse() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      return;
    }
    google.script.run
      .withSuccessHandler(function (response) {
        if (!response || !response.success) {
          return;
        }
        var data = response.data;
        if (!data) {
          return;
        }
        var map = {
          'home-active-clients': data.activeClients,
          'home-open-leads': data.openLeads,
          'home-followups-due': data.followUpsDue,
          'home-active-packages': data.activePackages
        };
        for (var id in map) {
          if (Object.prototype.hasOwnProperty.call(map, id)) {
            setStatus(id, map[id] === undefined ? '-' : map[id]);
          }
        }
      })
      .withFailureHandler(function () { /* best effort */ })
      .getHomeDashboardSummary();
  }

  /* Entry point ---------------------------------------------------------------------- */

  function loadDashboard() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      return;
    }
    google.script.run
      .withSuccessHandler(function (response) {
        if (!response || !response.success) {
          var errorRegion = el('dash-error');
          if (errorRegion) {
            errorRegion.hidden = false;
            errorRegion.innerHTML = UI.alert(
              response && response.message ? UI.escapeHtml(response.message) : 'Could not load dashboard data.',
              'error'
            );
          }
          return;
        }
        var data = response.data;
        if (!data) {
          return;
        }
        var errorRegion = el('dash-error');
        if (errorRegion) {
          errorRegion.hidden = true;
        }
        var money = data.money || {};
        setStatus('dash-money-cash', fmtMoney(money.moneyCash));
        setStatus('dash-cash-in', fmtMoney(money.cashInToday));
        setStatus('dash-cash-out', fmtMoney(money.cashOutToday));
        setStatus('dash-net-today', fmtMoney(money.netToday));
        setStatus('dash-active-accounts', money.activeAccounts || 0);

        var booking = data.booking || {};
        setStatus('home-upcoming-events', booking.upcomingEvents === undefined ? '-' : booking.upcomingEvents);
        setStatus('home-confirmed-bookings', booking.confirmedBookings === undefined ? '-' : booking.confirmedBookings);
        setStatus('home-outstanding-receivables',
          booking.outstandingReceivables === undefined ? '-' : fmtMoney(booking.outstandingReceivables));
        setStatus('home-payments-month',
          booking.paymentsThisMonth === undefined ? '-' : fmtMoney(booking.paymentsThisMonth));
        var attention = (booking.unpaidConfirmed || 0) + (booking.overpayments || 0) + (booking.refundReviews || 0);
        setStatus('home-attention-items', attention);

        renderAlerts(data.alerts);
        renderCharts(data.charts);
        setStatus('dash-generated', String(data.generatedAt || '').replace('T', ' ').slice(0, 16));
      })
      .withFailureHandler(function () {
        var errorRegion = el('dash-error');
        if (errorRegion) {
          errorRegion.hidden = false;
          errorRegion.innerHTML = UI.alert('Could not reach the server. Please try again.', 'error');
        }
      })
      .getDashboardData();
    loadCustomerPulse();
  }

  window.loadDashboard = loadDashboard;
})();
</script>
