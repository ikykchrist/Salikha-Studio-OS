<!-- booking-scripts.html
     Bookings + Calendar page controller (Sprint 3): lists, booking
     form with live pricing and conflict warnings, detail workspace,
     payment/refund modals, and the internal month calendar. -->

<script>
(function () {
  'use strict';

  var state = {
    page: 1,
    clients: [],
    packages: [],
    addOns: [],
    accounts: [],
    currentBookingId: null,
    currentTab: 'overview'
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(v) {
    return BKG_UI.esc(v);
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data);
          }
        } else {
          handleFailure(response);
        }
      })
      .withFailureHandler(handleFailure);
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function handleFailure(response) {
    APP.toast(toastMessageFromResponse(response, 'bookings'), 'error');
  }

  function formError(id, message) {
    var node = el(id);
    if (node) {
      node.textContent = message;
      node.hidden = false;
    }
  }

  function openModal(title, bodyHtml, confirmLabel, onConfirm) {
    var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" id="finance-modal-confirm">' + esc(confirmLabel) + '</button>';
    APP.openModal(UI.modal(title, bodyHtml, footer));
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn && onConfirm) {
      confirmBtn.addEventListener('click', function () {
        onConfirm(confirmBtn);
      });
    }
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  /* ================= List ================= */

  function filters() {
    return {
      search: el('bookings-search').value.trim(),
      bookingStatus: el('bookings-status-filter').value,
      paymentStatus: el('bookings-payment-filter').value,
      serviceType: el('bookings-type-filter').value,
      page: state.page
    };
  }

  function loadBookings() {
    callServer('getBookings', filters(), function (data) {
      renderBookings(data);
      loadSummary();
    });
  }

  function renderBookings(data) {
    var tbody = el('bookings-table-body');
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="11"><div class="empty-state">' +
        '<p class="empty-title">No bookings yet</p>' +
        '<p class="empty-hint">Create a booking to start the contracts list.</p></div></td></tr>';
      el('bookings-pagination').innerHTML = '';
      return;
    }
    var clientNames = {};
    for (var i = 0; i < state.clients.length; i++) {
      clientNames[state.clients[i].clientId] = state.clients[i].fullName || state.clients[i].businessOrOrganization || state.clients[i].clientId;
    }
    var html = '';
    for (var b = 0; b < data.items.length; b++) {
      html += BKG_UI.bookingRow(data.items[b], clientNames[data.items[b].clientId]);
    }
    tbody.innerHTML = html;
    renderPagination('bookings-pagination', data, function (page) {
      state.page = page;
      loadBookings();
    });
  }

  function loadSummary() {
    callServer('getBookingSummary', undefined, function (s) {
      el('kpi-upcoming-events').textContent = String(s.upcomingEvents);
      el('kpi-confirmed-bookings').textContent = String(s.confirmedBookings);
      el('kpi-outstanding-receivables').textContent = BKG_UI.money(s.outstandingReceivables);
      el('kpi-payments-month').textContent = BKG_UI.money(s.paymentsThisMonth);
    });
  }

  function renderPagination(containerId, data, onPage) {
    var container = el(containerId);
    if (!container) {
      return;
    }
    var totalPages = Math.max(Math.ceil(data.total / data.pageSize), 1);
    if (totalPages <= 1) {
      container.innerHTML = '<span class="pagination-info">' + data.total + ' booking(s)</span>';
      return;
    }
    container.innerHTML = '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page - 1) + '"' + (data.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<span class="pagination-info">Page ' + data.page + ' of ' + totalPages + '</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page + 1) + '"' + (data.page >= totalPages ? ' disabled' : '') + '>Next</button>';
    var buttons = container.querySelectorAll('[data-page]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        var page = Number(this.getAttribute('data-page'));
        if (page >= 1 && page <= totalPages) {
          onPage(page);
        }
      });
    }
  }

  /* ================= Booking form ================= */

  function openBookingForm(booking) {
    var body = BKG_UI.bookingFormTpl({
      booking: booking,
      clients: state.clients,
      packages: state.packages,
      addOns: state.addOns
    });
    openModal(booking ? 'Edit booking' : 'Create booking', body, booking ? 'Save changes' : 'Create booking', function (confirmBtn) {
      submitBookingForm(booking, confirmBtn);
    });
    wireForm(booking);
  }

  function wireForm(booking) {
    var addCustom = el('bf-add-custom');
    if (addCustom) {
      addCustom.addEventListener('click', function () {
        el('bf-custom-rows').insertAdjacentHTML('beforeend', BKG_UI.customChargeRowTpl(el('bf-custom-rows').children.length));
      });
    }
    var customRows = el('bf-custom-rows');
    customRows.addEventListener('click', function (event) {
      if (event.target.closest('[data-cf-remove]')) {
        event.target.closest('.custom-row').remove();
        refreshPricing();
      }
    });
    customRows.addEventListener('input', refreshPricing);
    ['bf-package', 'bf-discounttype', 'bf-discountvalue', 'bf-transport', 'bf-commission', 'bf-manualcost', 'bf-costsource'].forEach(function (id) {
      var node = el(id);
      if (node) {
        node.addEventListener('change', refreshPricing);
        node.addEventListener('input', refreshPricing);
      }
    });
    var addOns = el('bf-addons');
    if (addOns) {
      addOns.addEventListener('change', refreshPricing);
    }
    ['bf-eventdate', 'bf-start', 'bf-end', 'bf-setup', 'bf-servicetype'].forEach(function (id) {
      var node = el(id);
      if (node) {
        node.addEventListener('change', refreshConflicts);
      }
    });
    refreshPricing();
    refreshConflicts();
  }

  function readCustomCharges() {
    var rows = el('bf-custom-rows').querySelectorAll('.custom-row');
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var name = rows[i].querySelector('[data-cf="name"]').value.trim();
      if (!name) {
        continue;
      }
      out.push({
        name: name,
        quantity: Number(rows[i].querySelector('[data-cf="qty"]').value || 1),
        unitPrice: Number(rows[i].querySelector('[data-cf="price"]').value || 0),
        estimatedCost: Number(rows[i].querySelector('[data-cf="cost"]').value || 0)
      });
    }
    return out;
  }

  function pricingPayload() {
    return {
      packageId: el('bf-package').value,
      addOnIds: Array.prototype.map.call(el('bf-addons').querySelectorAll('[data-addon-check]:checked'), function (c) { return c.value; }),
      customCharges: readCustomCharges(),
      transportationCharge: Number(el('bf-transport').value || 0),
      discountType: el('bf-discounttype').value,
      discountValue: Number(el('bf-discountvalue').value || 0),
      plannedPartnerCommission: Number(el('bf-commission').value || 0),
      estimatedDirectCostSource: el('bf-costsource').value,
      manualEstimatedDirectCost: Number(el('bf-manualcost').value || 0)
    };
  }

  function refreshPricing() {
    callServer('calculateBookingPricing', pricingPayload(), function (p) {
      el('bf-preview').innerHTML = BKG_UI.pricingPreviewTpl(p);
      if (p.estimatedGrossProfit < 0 && !el('bf-preview').getAttribute('data-warned')) {
        el('bf-preview').setAttribute('data-warned', '1');
      }
    });
  }

  function refreshConflicts() {
    var date = el('bf-eventdate').value;
    if (!date) {
      el('bf-conflicts').innerHTML = '';
      el('bf-override-field').hidden = true;
      return;
    }
    callServer('checkBookingConflicts', {
      eventDate: date,
      eventStartTime: el('bf-start').value,
      eventEndTime: el('bf-end').value,
      setupTime: Number(el('bf-setup').value || 0),
      serviceType: el('bf-servicetype').value
    }, function (conflicts) {
      if (conflicts.length) {
        el('bf-conflicts').innerHTML = BKG_UI.conflictListTpl(conflicts);
        el('bf-override-field').hidden = false;
      } else {
        el('bf-conflicts').innerHTML = '';
        el('bf-override-field').hidden = true;
      }
    });
  }

  function submitBookingForm(booking, confirmBtn) {
    var title = el('bf-title').value.trim();
    if (!title) {
      formError('bf-error', 'Booking title is required.');
      return;
    }
    if (!el('bf-client').value) {
      formError('bf-error', 'Select a client.');
      return;
    }
    confirmBtn.disabled = true;
    var payload = {
      clientId: el('bf-client').value,
      bookingTitle: title,
      serviceType: el('bf-servicetype').value,
      eventType: el('bf-eventtype').value,
      eventDate: el('bf-eventdate').value,
      eventStartTime: el('bf-start').value,
      eventEndTime: el('bf-end').value,
      setupTime: Number(el('bf-setup').value || 0),
      venueName: el('bf-venue').value.trim(),
      venueAddress: el('bf-venueaddr').value.trim(),
      cityMunicipality: el('bf-city').value.trim(),
      province: el('bf-province').value.trim(),
      packageId: el('bf-package').value,
      addOnIds: Array.prototype.map.call(el('bf-addons').querySelectorAll('[data-addon-check]:checked'), function (c) { return c.value; }),
      customCharges: readCustomCharges(),
      transportationCharge: Number(el('bf-transport').value || 0),
      discountType: el('bf-discounttype').value,
      discountValue: Number(el('bf-discountvalue').value || 0),
      plannedPartnerCommission: Number(el('bf-commission').value || 0),
      estimatedDirectCostSource: el('bf-costsource').value,
      manualEstimatedDirectCost: Number(el('bf-manualcost').value || 0),
      specialInstructions: el('bf-instructions').value.trim(),
      internalNotes: el('bf-notes').value.trim(),
      initialStatus: el('bf-status').value,
      overrideReason: el('bf-override-field').hidden ? '' : el('bf-override').value.trim(),
      idempotencyKey: booking ? undefined : 'BKG-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
    };
    var serverFn = booking ? 'updateBooking' : 'createBooking';
    if (booking) {
      payload.bookingId = booking.bookingId;
      payload.reprice = true;
    }
    callServer(serverFn, payload, function () {
      APP.toast(booking ? 'Booking updated.' : 'Booking created. No cash movement occurred.', 'success');
      APP.closeModal();
      loadBookings();
    });
  }

  /* ================= Detail workspace ================= */

  function openBookingDetail(bookingId) {
    state.currentBookingId = bookingId;
    callServer('getBooking', bookingId, function (booking) {
      callServer('getBookingTimeline', bookingId, function (timeline) {
        renderDetail(booking, timeline);
      });
    });
  }

  function clientName(clientId) {
    for (var i = 0; i < state.clients.length; i++) {
      if (state.clients[i].clientId === clientId) {
        return state.clients[i].fullName || state.clients[i].businessOrOrganization || clientId;
      }
    }
    return clientId;
  }

  function renderDetail(booking, timeline) {
    var ws = el('booking-detail-workspace');
    ws.hidden = false;
    el('bd-title').textContent = booking.bookingTitle || 'Booking';
    el('bd-subtitle').textContent = booking.bookingCode + ' - ' + clientName(booking.clientId) + ' - ' + (booking.eventDate || 'no event date');
    el('bd-badges').innerHTML = BKG_UI.statusBadge(booking.bookingStatus) + ' ' + BKG_UI.statusBadge(booking.paymentStatus);
    showTab('overview', booking, timeline);
    var tabs = ws.querySelectorAll('[data-bd-tab]');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () {
        showTab(this.getAttribute('data-bd-tab'), booking, timeline);
      });
    }
    ws.scrollIntoView();
    var closeBtn = el('bd-close');
    closeBtn.onclick = function () {
      ws.hidden = true;
      loadBookings();
    };
  }

  function showTab(tab, booking, timeline) {
    state.currentTab = tab;
    var tabs = document.querySelectorAll('#booking-detail-workspace [data-bd-tab]');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-bd-tab') === tab);
    }
    var body = el('bd-body');
    if (tab === 'overview') {
      body.innerHTML = overviewHtml(booking);
    } else if (tab === 'payments') {
      callServer('getBookingPayments', booking.bookingId, function (payments) {
        body.innerHTML = paymentsHtml(payments, booking);
      });
    } else if (tab === 'pricing') {
      body.innerHTML = pricingHtml(booking);
    } else if (tab === 'profitability') {
      body.innerHTML = '<p class="note-meta">Loading profitability&hellip;</p>';
      callServer('getBookingProfitability', booking.bookingId, function (profit) {
        body.innerHTML = profitabilityHtml(profit);
      });
    } else if (tab === 'schedule') {
      callServer('getBookingTimeline', booking.bookingId, function (ignored) {
        callServer('getBooking', booking.bookingId, function (fresh) {
          body.innerHTML = scheduleHtml(fresh, booking);
        });
      });
    } else if (tab === 'timeline') {
      body.innerHTML = timelineHtml(timeline);
    } else if (tab === 'activity') {
      body.innerHTML = activityHtml(timeline);
    }
  }

  function overviewHtml(b) {
    return '<div class="profile-grid">' +
      profileItem('Client', clientName(b.clientId)) +
      profileItem('Service', BKG_UI.titleCase(b.serviceType)) +
      profileItem('Event type', BKG_UI.titleCase(b.eventType || '-')) +
      profileItem('Event date', b.eventDate || '-') +
      profileItem('Time', (b.eventStartTime || '-') + ' to ' + (b.eventEndTime || '-')) +
      profileItem('Venue', b.venueName || '-') +
      profileItem('Venue address', b.venueAddress || '-') +
      profileItem('Package', b.packageNameSnapshot || 'Custom booking') +
      profileItem('Booking total', BKG_UI.money(b.grossBookingAmount)) +
      profileItem('Paid', BKG_UI.money(b.amountPaidCached)) +
      profileItem('Balance', BKG_UI.money(b.balanceDueCached)) +
      profileItem('Estimated cost', BKG_UI.money(b.estimatedDirectCost)) +
      profileItem('Estimated profit', BKG_UI.money(b.estimatedGrossProfit)) +
      profileItem('Estimated margin', Number(b.estimatedProfitMargin || 0).toFixed(2) + '%') +
      profileItem('Partner', b.partnerId || '-') +
      profileItem('Assigned owner', b.assignedOwner || '-') +
      profileItem('Source', BKG_UI.titleCase(b.sourceChannel || 'OTHER')) +
      profileItem('Special instructions', b.specialInstructions || '-') +
      '</div>' +
      '<div class="section-actions mt-3">' +
      '<button class="btn btn-primary" type="button" data-bd-pay="' + esc(b.bookingId) + '">Record Payment</button>' +
      '<button class="btn btn-secondary" type="button" data-bd-edit="' + esc(b.bookingId) + '">Edit</button>' +
      '<button class="btn btn-secondary" type="button" data-bd-reschedule="' + esc(b.bookingId) + '">Reschedule</button>' +
      (b.bookingStatus !== 'CANCELLED' ? '<button class="btn btn-danger" type="button" data-bd-cancel="' + esc(b.bookingId) + '">Cancel</button>' : '') +
      '</div>';
  }

  function profileItem(label, value) {
    return '<div class="profile-item"><span class="profile-label">' + esc(label) + '</span><span class="profile-value">' + esc(value) + '</span></div>';
  }

  function paymentsHtml(payments, booking) {
    var rows = payments.length
      ? '<table class="data-table"><thead><tr><th>Payment</th><th>Date</th><th>Method</th><th>Type</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead><tbody>' +
        payments.map(BKG_UI.paymentRowTpl).join('') + '</tbody></table>'
      : '<p class="note-meta">No payments recorded.</p>';
    return '<div class="profile-grid">' +
      profileItem('Booking total', BKG_UI.money(booking.grossBookingAmount)) +
      profileItem('Paid', BKG_UI.money(booking.amountPaidCached)) +
      profileItem('Balance', BKG_UI.money(booking.balanceDueCached)) +
      profileItem('Payment status', booking.paymentStatus) +
      '</div>' +
      '<div class="section-actions"><button class="btn btn-primary" type="button" data-bd-pay="' + esc(booking.bookingId) + '">Record Payment</button></div>' +
      '<div class="table-wrap mt-3">' + rows + '</div>';
  }

  function pricingHtml(b) {
    var lines = (b.items || []).map(function (item) {
      return '<tr><td>' + esc(item.itemName) + '</td><td>' + esc(BKG_UI.titleCase(item.sourceType)) + '</td>' +
        '<td class="num">' + esc(item.quantity) + '</td><td class="num">' + BKG_UI.money(item.unitPrice) + '</td>' +
        '<td class="num">' + BKG_UI.money(item.lineTotal) + '</td></tr>';
    }).join('');
    return '<div class="profile-grid">' +
      profileItem('Subtotal', BKG_UI.money(b.subtotal)) +
      profileItem('Add-ons', BKG_UI.money(b.addOnTotal)) +
      profileItem('Custom charges', BKG_UI.money(b.customChargeTotal)) +
      profileItem('Transportation', BKG_UI.money(b.transportationCharge)) +
      profileItem('Discount (' + BKG_UI.titleCase(b.discountType) + ')', BKG_UI.money(b.discountAmount)) +
      profileItem('Gross booking amount', BKG_UI.money(b.grossBookingAmount)) +
      profileItem('Planned commission (internal)', BKG_UI.money(b.plannedPartnerCommission)) +
      profileItem('Net contract (internal)', BKG_UI.money(b.netContractAmount)) +
      profileItem('Estimated direct cost', BKG_UI.money(b.estimatedDirectCost)) +
      profileItem('Estimated gross profit', BKG_UI.money(b.estimatedGrossProfit)) +
      profileItem('Estimated margin', Number(b.estimatedProfitMargin || 0).toFixed(2) + '%') +
      '</div>' +
      '<h4 class="form-section-title">Line items</h4>' +
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>Item</th><th>Source</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line total</th></tr></thead><tbody>' + lines + '</tbody></table></div>';
  }

  function profitabilityHtml(p) {
    if (!p) {
      return '<div class="empty-state"><p class="empty-title">No profitability snapshot</p>' +
        '<p class="empty-hint">Recalculate this booking to persist its BookingCosts record.</p></div>';
    }
    var blocks = '<div class="profile-grid">' +
      profileItem('Revenue total', BKG_UI.money(p.revenueTotal)) +
      profileItem('Direct - material', BKG_UI.money(p.costMaterial)) +
      profileItem('Direct - transport', BKG_UI.money(p.costTransport)) +
      profileItem('Direct - meals', BKG_UI.money(p.costMeals)) +
      profileItem('Direct - crew', BKG_UI.money(p.costCrew)) +
      profileItem('Direct - commission', BKG_UI.money(p.costCommission)) +
      profileItem('Direct - other', BKG_UI.money(p.costOtherDirect)) +
      profileItem('Total direct cost', BKG_UI.money(p.directCostTotal)) +
      profileItem('Gross profit', BKG_UI.money(p.grossProfit)) +
      profileItem('Allocated operating cost', BKG_UI.money(p.allocOpsCost)) +
      profileItem('Net profit', BKG_UI.money(p.netProfit)) +
      profileItem('Profit margin', Number(p.profitMarginPct || 0).toFixed(2) + '%') +
      profileItem('Recalculated at', p.recalculatedAt || 'Not yet persisted') +
      '</div>';
    var note = 'Allocation policy: PAID operating expenses in the event month x booking revenue / month revenue. ' +
      'Direct costs come from paid DIRECT expenses this sprint (material/crew/commission arrive with later workflows).';
    return blocks +
      '<div class="section-actions mt-3"><button class="btn btn-secondary" type="button" data-bd-recalc-profit="' + esc(p.bookingId) + '">Recalculate</button></div>' +
      '<p class="note-meta mt-3">' + esc(note) + '</p>';
  }

  function scheduleHtml(b, original) {
    return '<div class="profile-grid">' +
      profileItem('Current event date', b.eventDate || '-') +
      profileItem('Current time', (b.eventStartTime || '-') + ' to ' + (b.eventEndTime || '-')) +
      profileItem('Setup time', b.setupTime ? b.setupTime + ' minutes' : '-') +
      '</div>' +
      '<div class="section-actions"><button class="btn btn-secondary" type="button" data-bd-reschedule="' + esc(b.bookingId) + '">Reschedule</button></div>' +
      '<p class="note-meta mt-3">Rescheduling preserves the previous schedule in history and re-runs conflict detection.</p>';
  }

  function timelineHtml(timeline) {
    if (!timeline.length) {
      return '<div class="empty-state"><p class="empty-title">No activity yet</p></div>';
    }
    return timeline.map(BKG_UI.timelineItemTpl).join('');
  }

  function activityHtml(timeline) {
    return timelineHtml(timeline);
  }

  /* ================= Actions ================= */

  function openRecordPayment(bookingId) {
    callServer('getBooking', bookingId, function (booking) {
      callServer('getCashAccounts', undefined, function (accounts) {
        var body = BKG_UI.paymentFormTpl(booking, accounts, {
          clientName: clientName(booking.clientId),
          today: today()
        });
        openModal('Record payment', body, 'Record and post payment', function (confirmBtn) {
          submitPayment(booking, accounts, confirmBtn);
        });
        var amount = el('pf-amount');
        if (amount) {
          amount.addEventListener('input', function () {
            var balance = Number(booking.balanceDueCached || 0);
            if (Number(amount.value || 0) - balance > 0.005) {
              formError('pf-error', 'Overpayment: exceeds the balance of ' + BKG_UI.money(balance) + '. Confirm to continue.');
            } else {
              el('pf-error').hidden = true;
            }
          });
        }
      });
    });
  }

  function submitPayment(booking, accounts, confirmBtn) {
    var amount = Number(el('pf-amount').value);
    if (!amount || amount <= 0) {
      formError('pf-error', 'Amount must be greater than zero.');
      return;
    }
    var balance = Number(booking.balanceDueCached || 0);
    var overpayment = amount - balance > 0.005;
    if (overpayment && !window.confirm('This is an overpayment of ' + BKG_UI.money(amount - balance) + '. Post it anyway?')) {
      return;
    }
    confirmBtn.disabled = true;
    callServer('recordBookingPayment', {
      bookingId: booking.bookingId,
      paymentType: el('pf-type').value,
      paymentDate: el('pf-date').value,
      paymentMethod: el('pf-method').value,
      cashAccountId: el('pf-account').value,
      amount: amount,
      referenceNumber: el('pf-reference').value.trim(),
      payerName: el('pf-payer').value.trim(),
      notes: el('pf-notes').value.trim(),
      overrideConfirmation: overpayment,
      idempotencyKey: 'PAY-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
    }, function (data) {
      APP.closeModal();
      APP.toast('Payment posted to the cash ledger.', 'success');
      openBookingDetail(booking.bookingId);
      loadBookings();
    });
  }

  function openVoidPayment(paymentId) {
    var body = '<form id="void-payment-form" class="finance-form" novalidate>' +
      '<p>Void this payment? Its linked cash transaction will also be voided and the booking balance recalculated.</p>' +
      '<div class="field"><label class="field-label">Void reason</label><input class="field-input" type="text" id="vp-reason" maxlength="300" required></div>' +
      '<div class="field-error" id="vp-error" hidden></div></form>';
    openModal('Void payment', body, 'Confirm void', function (confirmBtn) {
      var reason = el('vp-reason').value.trim();
      if (!reason) {
        formError('vp-error', 'A void reason is required.');
        return;
      }
      confirmBtn.disabled = true;
      callServer('voidBookingPayment', { paymentId: paymentId, voidReason: reason }, function () {
        APP.toast('Payment voided. Cash effect reversed.', 'success');
        APP.closeModal();
        if (state.currentBookingId) {
          openBookingDetail(state.currentBookingId);
        }
        loadBookings();
      });
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-danger';
    }
  }

  function openRefund(paymentId) {
    callServer('getRefundEligibility', { paymentId: paymentId }, function (eligibility) {
      if (eligibility.refundableAmount <= 0) {
        APP.toast('No refundable amount remains for this payment.', 'info');
        return;
      }
      callServer('getPayment', paymentId, function (payment) {
        callServer('getCashAccounts', undefined, function (accounts) {
          var body = BKG_UI.refundFormTpl(payment, eligibility, accounts);
          openModal('Record refund', body, 'Record refund', function (confirmBtn) {
            submitRefund(payment, confirmBtn);
          });
        });
      });
    });
  }

  function submitRefund(payment, confirmBtn) {
    var amount = Number(el('rf-amount').value);
    if (!amount || amount <= 0) {
      formError('rf-error', 'Refund amount must be greater than zero.');
      return;
    }
    var reason = el('rf-reason').value.trim();
    if (!reason) {
      formError('rf-error', 'A refund reason is required.');
      return;
    }
    confirmBtn.disabled = true;
    callServer('recordRefund', {
      paymentId: payment.paymentId,
      amount: amount,
      refundDate: el('rf-date').value,
      cashAccountId: el('rf-account').value,
      reason: reason,
      idempotencyKey: 'RFN-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
    }, function () {
      APP.toast('Refund recorded and posted to the cash ledger.', 'success');
      APP.closeModal();
      if (state.currentBookingId) {
        openBookingDetail(state.currentBookingId);
      }
    });
  }

  function openCancelBooking(bookingId) {
    var body = '<form id="cancel-form" class="finance-form" novalidate>' +
      '<p>Cancelling preserves payments and history. A refund review is required if the booking has been paid.</p>' +
      '<div class="field"><label class="field-label">Cancellation reason</label><input class="field-input" type="text" id="cb-reason" maxlength="300" required></div>' +
      '<div class="field-error" id="cb-error" hidden></div></form>';
    openModal('Cancel booking', body, 'Confirm cancellation', function (confirmBtn) {
      var reason = el('cb-reason').value.trim();
      if (!reason) {
        formError('cb-error', 'A cancellation reason is required.');
        return;
      }
      confirmBtn.disabled = true;
      callServer('cancelBooking', { bookingId: bookingId, reason: reason }, function () {
        APP.toast('Booking cancelled. Payments preserved.', 'success');
        APP.closeModal();
        openBookingDetail(bookingId);
      });
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-danger';
    }
  }

  function openBookingMenu(bookingId, anchor) {
    var menu = document.createElement('div');
    menu.className = 'context-menu';
    var rect = anchor.getBoundingClientRect();
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
    var items = [
      { label: 'View', action: function () { openBookingDetail(bookingId); } },
      { label: 'Record payment', action: function () { openRecordPayment(bookingId); } },
      { label: 'Reschedule', action: function () { openBookingDetail(bookingId); } },
      { label: 'Archive', danger: true, action: function () { confirmArchiveBooking(bookingId); } }
    ];
    for (var i = 0; i < items.length; i++) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'context-item' + (items[i].danger ? ' text-danger' : '');
      item.textContent = items[i].label;
      item.addEventListener('click', function (action) {
        menu.remove();
        action();
      }.bind(null, items[i].action));
      menu.appendChild(item);
    }
    document.body.appendChild(menu);
    setTimeout(function () {
      document.addEventListener('click', function () { menu.remove(); }, { once: true });
    }, 0);
  }

  function confirmArchiveBooking(bookingId) {
    var body = '<p>Archive this booking? It remains retrievable and can be reactivated.</p>';
    openModal('Archive booking', body, 'Archive', function (confirmBtn) {
      confirmBtn.disabled = true;
      callServer('archiveBooking', { bookingId: bookingId, reason: 'Archived by owner' }, function () {
        APP.toast('Booking archived.', 'success');
        APP.closeModal();
        loadBookings();
      });
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-danger';
    }
  }

  /* ================= Events ================= */

  function onBookingsClick(event) {
    var target = event.target;
    var action = target.closest('[data-booking-action="create"]');
    if (action) {
      openBookingForm();
      return;
    }
    var view = target.closest('[data-booking-view]');
    if (view) {
      openBookingDetail(view.getAttribute('data-booking-view'));
      return;
    }
    var menu = target.closest('[data-booking-menu]');
    if (menu) {
      openBookingMenu(menu.getAttribute('data-booking-menu'), menu);
      return;
    }
    var pay = target.closest('[data-bd-pay]');
    if (pay) {
      openRecordPayment(pay.getAttribute('data-bd-pay'));
      return;
    }
    var edit = target.closest('[data-bd-edit]');
    if (edit) {
      callServer('getBooking', edit.getAttribute('data-bd-edit'), function (booking) {
        openBookingForm(booking);
      });
      return;
    }
    var cancel = target.closest('[data-bd-cancel]');
    if (cancel) {
      openCancelBooking(cancel.getAttribute('data-bd-cancel'));
      return;
    }
    var reschedule = target.closest('[data-bd-reschedule]');
    if (reschedule) {
      openRescheduleModal(reschedule.getAttribute('data-bd-reschedule'));
      return;
    }
    var recalc = target.closest('[data-bd-recalc-profit]');
    if (recalc) {
      var bookingId = recalc.getAttribute('data-bd-recalc-profit');
      recalc.disabled = true;
      callServer('recalculateBookingProfitability', { bookingId: bookingId }, function () {
        APP.toast('Booking profitability recalculated.', 'success');
        callServer('getBookingProfitability', bookingId, function (profit) {
          el('bd-body').innerHTML = profitabilityHtml(profit);
        });
      });
      return;
    }
    var pv = target.closest('[data-payment-view]');
    if (pv) {
      callServer('getPayment', pv.getAttribute('data-payment-view'), function (payment) {
        showPaymentDetail(payment);
      });
      return;
    }
    var pvoid = target.closest('[data-payment-void]');
    if (pvoid) {
      openVoidPayment(pvoid.getAttribute('data-payment-void'));
      return;
    }
    var prefund = target.closest('[data-payment-refund]');
    if (prefund) {
      openRefund(prefund.getAttribute('data-payment-refund'));
      return;
    }
    var receivable = target.closest('[data-receivable-pay]');
    if (receivable) {
      openRecordPayment(receivable.getAttribute('data-receivable-pay'));
    }
  }

  function openRescheduleModal(bookingId) {
    callServer('getBooking', bookingId, function (booking) {
      var body = '<form id="reschedule-form" class="finance-form" novalidate>' +
        '<div class="form-row">' +
        '<div class="field"><label class="field-label">New event date</label><input class="field-input" type="date" id="rs-date" value="' + esc(booking.eventDate || '') + '"></div>' +
        '<div class="field"><label class="field-label">New start time</label><input class="field-input" type="time" id="rs-start" value="' + esc(booking.eventStartTime || '') + '"></div>' +
        '</div>' +
        '<div class="form-row">' +
        '<div class="field"><label class="field-label">New end time</label><input class="field-input" type="time" id="rs-end" value="' + esc(booking.eventEndTime || '') + '"></div>' +
        '<div class="field"><label class="field-label">Setup time (min)</label><input class="field-input num-input" type="number" min="0" step="15" id="rs-setup" value="' + esc(booking.setupTime || '') + '"></div>' +
        '</div>' +
        '<div class="field"><label class="field-label">Reason</label><input class="field-input" type="text" id="rs-reason" maxlength="300"></div>' +
        '<div class="field"><label class="field-label">Conflict override reason</label><input class="field-input" type="text" id="rs-override" maxlength="300"></div>' +
        '<div class="field-error" id="rs-error" hidden></div></form>';
      openModal('Reschedule booking', body, 'Save new schedule', function (confirmBtn) {
        var date = el('rs-date').value;
        if (!date) {
          formError('rs-error', 'A new event date is required.');
          return;
        }
        confirmBtn.disabled = true;
        callServer('rescheduleBooking', {
          bookingId: bookingId,
          eventDate: date,
          eventStartTime: el('rs-start').value,
          eventEndTime: el('rs-end').value,
          setupTime: Number(el('rs-setup').value || 0),
          reason: el('rs-reason').value.trim(),
          overrideReason: el('rs-override').value.trim()
        }, function () {
          APP.toast('Booking rescheduled. Previous schedule preserved.', 'success');
          APP.closeModal();
          loadBookings();
        });
      });
    });
  }

  function showPaymentDetail(payment) {
    var body = '<div class="profile-grid">' +
      profileItem('Payment', payment.paymentCode) +
      profileItem('Date', payment.paymentDate || '') +
      profileItem('Method', BKG_UI.titleCase(payment.paymentMethod)) +
      profileItem('Type', BKG_UI.titleCase(payment.paymentType)) +
      profileItem('Amount', BKG_UI.money(payment.amount)) +
      profileItem('Status', payment.status) +
      profileItem('Reference', payment.referenceNumber || '-') +
      profileItem('Payer', payment.payerName || '-') +
      profileItem('Cash transaction', payment.cashTransactionId || '-') +
      (payment.status === 'VOIDED' ? profileItem('Void reason', payment.voidReason || '-') : '') +
      '</div>';
    openModal('Payment details', body, 'Close', function (btn) {
      APP.closeModal();
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-secondary';
      confirmBtn.textContent = 'Close';
    }
  }

  /* ================= Calendar ================= */

  var calState = { year: null, month: null };

  function activateCalendar() {
    if (!calendarActivated) {
      calendarActivated = true;
      el('view-calendar').addEventListener('click', function (event) {
        var view = event.target.closest('[data-booking-view]');
        if (view) {
          openBookingDetail(view.getAttribute('data-booking-view'));
        }
      });
      el('cal-prev').addEventListener('click', function () {
        calState.month--;
        if (calState.month < 0) {
          calState.month = 11;
          calState.year--;
        }
        renderCalendar();
      });
      el('cal-next').addEventListener('click', function () {
        calState.month++;
        if (calState.month > 11) {
          calState.month = 0;
          calState.year++;
        }
        renderCalendar();
      });
      el('cal-show-cancelled').addEventListener('change', renderCalendar);
    }
    var now = new Date();
    calState.year = now.getFullYear();
    calState.month = now.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    var year = calState.year;
    var month = calState.month;
    el('cal-month-label').textContent = new Date(year, month, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    var from = new Date(year, month, 1).toISOString().slice(0, 10);
    var to = new Date(year, month + 1, 0).toISOString().slice(0, 10);
    callServer('getBookings', {
      fromDate: from,
      toDate: to,
      excludeCancelled: !el('cal-show-cancelled').checked,
      pageSize: 100
    }, function (data) {
      var byDay = {};
      for (var i = 0; i < data.items.length; i++) {
        var day = data.items[i].eventDate;
        if (!day) {
          continue;
        }
        if (!byDay[day]) {
          byDay[day] = [];
        }
        byDay[day].push(data.items[i]);
      }
      var firstDay = new Date(year, month, 1).getDay();
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      var html = '';
      for (var w = 0; w < 7; w++) {
        html += '<div class="cal-dow">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][w] + '</div>';
      }
      for (var pad = 0; pad < firstDay; pad++) {
        html += '<div class="cal-cell cal-empty"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var events = byDay[dateStr] || [];
        html += '<div class="cal-cell"><div class="cal-day">' + d + '</div>' +
          events.map(BKG_UI.calendarEventTpl).join('') + '</div>';
      }
      el('cal-grid').innerHTML = html;
      renderUpcoming();
    });
  }

  function renderUpcoming() {
    callServer('getBookings', { fromDate: today(), pageSize: 10 }, function (data) {
      var container = el('cal-upcoming');
      if (!data.items.length) {
        container.innerHTML = '<p class="note-meta">No upcoming events.</p>';
        return;
      }
      container.innerHTML = data.items.map(function (b) {
        return '<div class="timeline-item"><span class="badge ' + (b.bookingStatus === 'CONFIRMED' ? 'badge-success' : 'badge-info') + '">' + esc(b.bookingStatus) + '</span>' +
          '<div class="timeline-main"><div class="cell-main">' + esc(b.bookingTitle || b.bookingCode) + '</div>' +
          '<div class="cell-sub">' + esc(b.eventDate || '') + ' - ' + esc(b.venueName || 'no venue') + '</div></div>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-booking-view="' + esc(b.bookingId) + '">View</button></div>';
      }).join('');
    });
  }

  /* ================= Lifecycle ================= */

  var activated = false;
  var calendarActivated = false;

  function populateFilters() {    var statusFilter = el('bookings-status-filter');
    if (statusFilter && statusFilter.options.length === 1) {
      for (var i = 0; i < BKG_UI.BOOKING_STATUSES.length; i++) {
        statusFilter.appendChild(new Option(BKG_UI.titleCase(BKG_UI.BOOKING_STATUSES[i]), BKG_UI.BOOKING_STATUSES[i]));
      }
    }
    var paymentFilter = el('bookings-payment-filter');
    if (paymentFilter && paymentFilter.options.length === 1) {
      for (var p = 0; p < BKG_UI.PAYMENT_STATUSES.length; p++) {
        paymentFilter.appendChild(new Option(BKG_UI.titleCase(BKG_UI.PAYMENT_STATUSES[p]), BKG_UI.PAYMENT_STATUSES[p]));
      }
    }
    var typeFilter = el('bookings-type-filter');
    if (typeFilter && typeFilter.options.length === 1) {
      for (var t = 0; t < BKG_UI.SERVICE_TYPES.length; t++) {
        typeFilter.appendChild(new Option(BKG_UI.titleCase(BKG_UI.SERVICE_TYPES[t]), BKG_UI.SERVICE_TYPES[t]));
      }
    }
  }

  function loadLookups() {
    callServer('getClients', { includeArchived: true, pageSize: 200 }, function (data) {
      state.clients = data.items;
    });
    callServer('getPackages', { activeOnly: false, pageSize: 100 }, function (data) {
      state.packages = data.items;
    });
    callServer('getPackageAddOns', { activeOnly: false, pageSize: 100 }, function (data) {
      state.addOns = data.items;
    });
    callServer('getCashAccounts', undefined, function (accounts) {
      state.accounts = accounts;
    });
  }

  function activate() {
    if (!activated) {
      activated = true;
      el('view-bookings').addEventListener('click', onBookingsClick);
      var ws = el('booking-detail-workspace');
      if (ws) {
        ws.addEventListener('click', onBookingsClick);
      }
      populateFilters();
      loadLookups();
      ['bookings-search', 'bookings-status-filter', 'bookings-payment-filter', 'bookings-type-filter'].forEach(function (id) {
        var node = el(id);
        if (node) {
          node.addEventListener('input', function () {
            state.page = 1;
            loadBookings();
          });
        }
      });
    }
    state.page = 1;
    loadBookings();
  }

  window.BOOKINGS = {
    activate: activate,
    activateCalendar: activateCalendar,
    openBookingDetail: openBookingDetail,
    openRecordPayment: openRecordPayment
  };
})();
</script>
