<!-- styles.html
     All application CSS. Sections: variables, reset, typography, layout,
     sidebar, header, components, dashboard, forms, tables, utilities,
     responsive, accessibility. -->

<style>
/* ============ Variables ============ */
:root {
  --color-primary: #B4232C;
  --color-primary-hover: #9B1C24;
  --color-primary-soft: #FBEAEB;
  --color-page-bg: #F7F8FA;
  --color-surface: #FFFFFF;
  --color-border: #E5E7EB;
  --color-text: #1F2937;
  --color-text-secondary: #6B7280;
  --color-text-muted: #9CA3AF;
  --color-success: #15803D;
  --color-success-soft: #E9F7EF;
  --color-warning: #D97706;
  --color-warning-soft: #FDF3E3;
  --color-info: #2563EB;
  --color-info-soft: #EAF1FE;
  --color-danger: #DC2626;
  --color-danger-soft: #FDEBEC;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-8: 48px;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.10);
  --shadow-lg: 0 8px 24px rgba(16, 24, 40, 0.14);

  --sidebar-width: 240px;
  --topbar-height: 60px;
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --text-display: 22px;
  --text-heading: 18px;
  --text-body: 14px;
  --text-small: 13px;
  --text-caption: 12px;

  --transition-fast: 150ms ease;
}

/* ============ Reset ============ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-stack);
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--color-text);
  background: var(--color-page-bg);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p {
  margin: 0;
}

a {
  color: var(--color-info);
  text-decoration: none;
}

button {
  font-family: inherit;
}

input {
  font-family: inherit;
}

/* ============ Typography ============ */
.page-title {
  font-size: var(--text-display);
  font-weight: 600;
  line-height: 1.3;
  color: var(--color-text);
}

.page-description {
  font-size: var(--text-body);
  color: var(--color-text-secondary);
  margin-top: 2px;
}

.section-title {
  font-size: var(--text-heading);
  font-weight: 600;
  color: var(--color-text);
}

.section-hint {
  font-size: var(--text-small);
  color: var(--color-text-secondary);
  margin-top: 4px;
}

.card-title {
  font-size: var(--text-body);
  font-weight: 600;
  color: var(--color-text);
}

/* ============ Layout ============ */
.app {
  display: flex;
  min-height: 100vh;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

#main-content {
  flex: 1;
  padding: var(--space-5);
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  outline: none;
}

.view {
  display: block;
}

.view[hidden] {
  display: none;
}

/* ============ Sidebar ============ */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  border-bottom: 1px solid var(--color-border);
}

.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--color-primary);
  color: #FFFFFF;
  font-weight: 700;
  font-size: var(--text-small);
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.02em;
}

.brand-name {
  font-weight: 600;
  font-size: var(--text-body);
  color: var(--color-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-3) var(--space-2);
}

.nav-group {
  margin-bottom: var(--space-4);
}

.nav-group-label {
  font-size: var(--text-caption);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
  padding: 0 var(--space-3);
  margin-bottom: var(--space-1);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--color-text-secondary);
  font-size: var(--text-body);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.nav-item:hover {
  background: var(--color-page-bg);
  color: var(--color-text);
}

.nav-item.active {
  background: var(--color-surface);
  color: var(--color-primary);
  font-weight: 600;
  border-left-color: var(--color-primary);
}

.nav-item:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.nav-icon {
  display: inline-flex;
  color: currentColor;
}

.sidebar-footer {
  border-top: 1px solid var(--color-border);
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.conn-status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-small);
  color: var(--color-text-secondary);
}

.conn-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.conn-dot-checking { background: var(--color-warning); }
.conn-dot-ok { background: var(--color-success); }
.conn-dot-bad { background: var(--color-danger); }

.app-version {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

/* ============ Header ============ */
.topbar {
  height: var(--topbar-height);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: 0 var(--space-5);
  position: sticky;
  top: 0;
  z-index: 30;
}

.topbar-titles {
  flex: 1;
  min-width: 0;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box .search-icon {
  position: absolute;
  left: var(--space-3);
  color: var(--color-text-muted);
  display: inline-flex;
  pointer-events: none;
}

.search-box input {
  padding-left: 34px;
  width: 220px;
}

.menu-btn {
  display: none;
}

.profile-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 700;
  font-size: var(--text-small);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-btn:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

.conn-banner {
  padding: var(--space-3) var(--space-5);
}

.conn-banner[hidden] {
  display: none;
}

/* ============ Components: buttons ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: 36px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: var(--text-body);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
}

.btn:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  color: #FFFFFF;
}

.btn-primary:hover:not(:disabled) {
  background: var(--color-primary-hover);
}

.btn-secondary {
  background: var(--color-surface);
  color: var(--color-text);
  border-color: var(--color-border);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--color-page-bg);
}

.btn-ghost {
  background: transparent;
  color: var(--color-text-secondary);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--color-page-bg);
  color: var(--color-text);
}

.btn-danger {
  background: var(--color-danger);
  color: #FFFFFF;
}

.btn-danger:hover:not(:disabled) {
  background: #B91C1C;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.icon-btn:hover:not(:disabled) {
  background: var(--color-page-bg);
  color: var(--color-text);
}

.icon-btn:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

.icon-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.icon {
  display: block;
}

/* ============ Components: badges ============ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: var(--text-caption);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-info { background: var(--color-info-soft); color: var(--color-info); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); }
.badge-neutral { background: var(--color-page-bg); color: var(--color-text-secondary); }
.badge-sample { background: var(--color-page-bg); color: var(--color-text-muted); }

/* ============ Components: cards ============ */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

/* ============ Components: alerts ============ */
.alert {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid;
  font-size: var(--text-body);
  margin-bottom: var(--space-4);
}

.alert-icon {
  display: inline-flex;
  flex-shrink: 0;
  margin-top: 2px;
}

.alert-info { background: var(--color-info-soft); border-color: #CBDEFB; color: #1E4BB8; }
.alert-success { background: var(--color-success-soft); border-color: #BBE5CC; color: #11632E; }
.alert-warning { background: var(--color-warning-soft); border-color: #FADCA6; color: #92400E; }
.alert-danger { background: var(--color-danger-soft); border-color: #F6C1C3; color: #B91C1C; }

/* ============ Components: toasts ============ */
.toast-region {
  position: fixed;
  top: var(--space-4);
  right: var(--space-4);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  max-width: 360px;
}

.toast {
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  font-size: var(--text-small);
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-info);
  animation: toast-in var(--transition-fast);
}

.toast-success { border-left-color: var(--color-success); }
.toast-error { border-left-color: var(--color-danger); }
.toast-info { border-left-color: var(--color-info); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ Components: modal ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 55, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  z-index: 90;
}

.modal {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-border);
}

.modal-title {
  font-size: var(--text-heading);
  font-weight: 600;
  color: var(--color-text);
}

.modal-body {
  padding: var(--space-5);
  overflow-y: auto;
}

.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--color-border);
}

/* ============ Components: empty state ============ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-8) var(--space-5);
  gap: var(--space-2);
  color: var(--color-text-secondary);
}

.empty-icon {
  color: var(--color-text-muted);
  display: inline-flex;
  margin-bottom: var(--space-2);
}

.empty-title {
  font-weight: 600;
  font-size: var(--text-body);
  color: var(--color-text);
}

.empty-hint {
  font-size: var(--text-small);
  color: var(--color-text-muted);
  max-width: 320px;
}

.empty-cta {
  margin-top: var(--space-3);
}

/* ============ Components: skeleton (foundation) ============ */
.skeleton {
  background: linear-gradient(90deg, #F1F2F4 25%, #E7E9EC 50%, #F1F2F4 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.4s ease infinite;
  border-radius: var(--radius-sm);
}

@keyframes skeleton-shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

/* ============ Dashboard ============ */
.section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.kpi-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.kpi-label {
  font-size: var(--text-small);
  font-weight: 600;
  color: var(--color-text-secondary);
}

.kpi-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--color-text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.kpi-meta {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-4);
}

.chart-placeholder {
  min-height: 180px;
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-page-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  text-align: center;
  padding: var(--space-5);
}

/* ============ Placeholder pages ============ */
.page-placeholder {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.page-placeholder-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}

.page-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: var(--color-primary-soft);
  color: var(--color-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.placeholder-box {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  align-items: flex-start;
}

.placeholder-text {
  font-size: var(--text-body);
  color: var(--color-text-secondary);
}

.feature-list {
  margin: var(--space-2) 0 0 0;
  padding-left: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  color: var(--color-text-secondary);
  font-size: var(--text-small);
}

/* ============ Forms ============ */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-bottom: var(--space-4);
}

.field-label {
  font-size: var(--text-small);
  font-weight: 600;
  color: var(--color-text-secondary);
}

.field-label .req {
  color: var(--color-danger);
}

.field-input,
.field-select,
.field-textarea {
  height: 36px;
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--text-body);
  color: var(--color-text);
  background: var(--color-surface);
  transition: border-color var(--transition-fast);
}

.field-textarea {
  height: auto;
  min-height: 84px;
  padding: var(--space-2) var(--space-3);
  resize: vertical;
}

.field-input:focus,
.field-select:focus,
.field-textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px rgba(180, 35, 44, 0.18);
}

.field-input:disabled,
.field-select:disabled {
  background: var(--color-page-bg);
  color: var(--color-text-muted);
  cursor: not-allowed;
}

.field-error {
  font-size: var(--text-caption);
  color: var(--color-danger);
}

/* ============ Tables ============ */
.table-wrap {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow-x: auto;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-body);
}

.data-table th {
  text-align: left;
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-caption);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-secondary);
  background: var(--color-page-bg);
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

.data-table td {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  color: var(--color-text);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tbody tr:hover {
  background: var(--color-page-bg);
}

.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ============ Utilities ============ */
.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mt-4 { margin-top: var(--space-4); }
.mt-5 { margin-top: var(--space-5); }
.mb-4 { margin-bottom: var(--space-4); }
.text-muted { color: var(--color-text-muted); }
.text-secondary { color: var(--color-text-secondary); }
.text-danger { color: var(--color-danger); }
.text-success { color: var(--color-success); }

/* ============ Finance (Sprint 1) ============ */
.section-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.btn-group {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.btn-sm {
  height: 28px;
  padding: 0 var(--space-2);
  font-size: var(--text-caption);
}

.finance-status {
  margin-bottom: var(--space-4);
}

.finance-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: var(--space-4);
  align-items: start;
}

.breakdown-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-3);
}

.breakdown-item {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-3);
  background: var(--color-page-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.breakdown-label {
  font-size: var(--text-caption);
  color: var(--color-text-secondary);
}

.breakdown-value {
  font-size: var(--text-body);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.account-list {
  display: flex;
  flex-direction: column;
}

.account-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--color-border);
}

.account-row:last-child {
  border-bottom: none;
}

.account-row > div:first-child {
  flex: 1;
  min-width: 0;
}

.account-name {
  font-weight: 600;
  font-size: var(--text-body);
  color: var(--color-text);
}

.account-meta {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

.account-balance {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.account-status {
  flex-shrink: 0;
}

.account-empty {
  padding: var(--space-4);
  color: var(--color-text-muted);
  font-size: var(--text-small);
  text-align: center;
}

.field-hint {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

.num-input {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.finance-form {
  display: flex;
  flex-direction: column;
}

.recon-readonly {
  padding: var(--space-2) var(--space-3);
  background: var(--color-page-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--text-small);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-bottom: var(--space-3);
}

.row-voided td {
  color: var(--color-text-muted);
  text-decoration: line-through;
}

.detail-table th {
  width: 40%;
  font-weight: 600;
  background: none;
  text-transform: none;
  letter-spacing: normal;
  color: var(--color-text-secondary);
}

/* ============ Expenses (Sprint 4) ============ */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-2);
}

.detail-note {
  margin-top: var(--space-3);
  font-size: var(--text-small);
  color: var(--color-text-secondary);
}

@media (max-width: 1023px) {
  .finance-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .section-actions {
    width: 100%;
  }

  .section-actions .btn {
    flex: 1 1 auto;
  }

  .btn-group {
    width: 100%;
  }
}

/* ============ Settings / integrations (Pre-Sprint 2) ============ */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-4);
}

.settings-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.settings-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.settings-badge {
  flex-shrink: 0;
}

.settings-detail {
  font-size: var(--text-small);
  color: var(--color-text-secondary);
  line-height: 1.6;
}

.settings-note {
  background: var(--color-page-bg);
}

.settings-note code,
.settings-steps code,
.settings-modal-heading code {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: var(--text-caption);
  color: var(--color-text);
}

.settings-modal-heading {
  margin: var(--space-4) 0 var(--space-2);
  font-size: var(--text-body);
  font-weight: 600;
  color: var(--color-text);
}

.settings-steps {
  margin: 0 0 var(--space-3) 0;
  padding-left: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: var(--text-small);
  color: var(--color-text-secondary);
}

/* ============ Customers & packages (Sprint 2) ============ */
.filter-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.filter-select {
  width: auto;
  min-width: 150px;
}

.pagination-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
  padding-top: var(--space-3);
}

.pagination-info {
  font-size: var(--text-caption);
  color: var(--color-text-secondary);
}

.cell-main {
  font-weight: 600;
  color: var(--color-text);
}

.cell-sub {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

.row-actions {
  display: flex;
  gap: var(--space-1);
  white-space: nowrap;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 var(--space-4);
}

.form-section-title {
  margin: var(--space-4) 0 var(--space-2);
  font-size: var(--text-body);
  font-weight: 600;
  color: var(--color-text);
  border-bottom: 1px solid var(--color-border);
  padding-bottom: var(--space-2);
}

.form-checks {
  display: flex;
  gap: var(--space-5);
  margin-bottom: var(--space-3);
}

.check-label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-small);
  color: var(--color-text-secondary);
}

.profile-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.profile-title {
  font-size: var(--text-heading);
  font-weight: 700;
  color: var(--color-text);
}

.profile-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2) var(--space-5);
  margin-bottom: var(--space-4);
}

.profile-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.profile-label {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

.profile-value {
  font-size: var(--text-small);
  color: var(--color-text);
  word-break: break-word;
}

.profile-section {
  margin-top: var(--space-4);
}

.profile-section h4 {
  font-size: var(--text-body);
  font-weight: 600;
  color: var(--color-text);
  margin: 0 0 var(--space-2);
}

.note-item,
.interaction-item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  margin-bottom: var(--space-2);
}

.note-item.note-warning {
  border-left: 3px solid var(--color-danger);
  background: var(--color-danger-soft);
}

.note-item.note-pinned {
  border-left: 3px solid var(--color-info);
}

.note-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}

.note-meta {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
}

.note-text {
  font-size: var(--text-small);
  color: var(--color-text);
  margin: 0;
  white-space: pre-wrap;
}

.dup-list {
  margin: var(--space-2) 0 0 0;
  padding-left: var(--space-5);
  font-size: var(--text-small);
}

.context-menu {
  position: fixed;
  z-index: 120;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: var(--space-1);
  display: flex;
  flex-direction: column;
  min-width: 160px;
}

.context-item {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font-size: var(--text-small);
  color: var(--color-text);
  cursor: pointer;
}

.context-item:hover {
  background: var(--color-page-bg);
}

.context-item:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.profit-preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}

.item-editor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  max-height: 55vh;
  overflow-y: auto;
}

.item-editor-head,
.item-row {
  display: grid;
  grid-template-columns: 2fr 1.2fr 0.6fr 0.8fr 1fr 1fr 0.5fr;
  gap: var(--space-2);
  align-items: center;
}

.item-editor-head {
  font-size: var(--text-caption);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0 var(--space-1);
}

.item-row .field-input,
.item-row .field-select {
  height: 32px;
  font-size: var(--text-caption);
}

.item-row-total {
  font-size: var(--text-small);
  font-weight: 600;
}

.item-editor-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

.item-total {
  font-size: var(--text-small);
  color: var(--color-text-secondary);
}

@media (max-width: 640px) {
  .form-row {
    grid-template-columns: 1fr;
  }

  .profile-grid {
    grid-template-columns: 1fr;
  }

  .item-editor {
    overflow-x: auto;
  }

  .item-editor-head,
  .item-row {
    min-width: 640px;
  }
}

/* ============ Bookings & payments (Sprint 3) ============ */
.tabs {
  display: flex;
  gap: var(--space-1);
  border-bottom: 1px solid var(--color-border);
  margin-bottom: var(--space-4);
  overflow-x: auto;
}

.tab {
  border: none;
  background: transparent;
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-small);
  font-weight: 600;
  color: var(--color-text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.tab:hover {
  color: var(--color-text);
}

.tab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

.tab:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.tab-disabled {
  color: var(--color-text-muted);
  cursor: not-allowed;
}

.detail-workspace {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-5);
  box-shadow: var(--shadow-md);
}

.detail-workspace[hidden] {
  display: none;
}

.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-3);
}

.detail-title {
  font-size: var(--text-display);
  font-weight: 700;
  color: var(--color-text);
}

.detail-badges {
  display: flex;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.addon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-page-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  margin-bottom: var(--space-3);
}

.custom-row {
  display: grid;
  grid-template-columns: 2fr 0.6fr 1fr 1fr 0.5fr;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

.timeline-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--color-border);
}

.timeline-item:last-child {
  border-bottom: none;
}

.timeline-main {
  flex: 1;
  min-width: 0;
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}

.cal-month {
  font-size: var(--text-heading);
  font-weight: 600;
  color: var(--color-text);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-1);
}

.cal-dow {
  font-size: var(--text-caption);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-secondary);
  text-align: center;
  padding: var(--space-2) 0;
}

.cal-cell {
  min-height: 84px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  background: var(--color-surface);
}

.cal-empty {
  background: var(--color-page-bg);
}

.cal-day {
  font-size: var(--text-caption);
  font-weight: 600;
  color: var(--color-text-secondary);
}

.cal-event {
  display: block;
  width: 100%;
  text-align: left;
  font-size: var(--text-caption);
  padding: 2px 4px;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--color-text);
  background: var(--color-info-soft);
}

.cal-event:hover {
  filter: brightness(0.96);
}

.cal-confirmed { background: var(--color-success-soft); }
.cal-tentative { background: var(--color-warning-soft); }
.cal-inquiry { background: var(--color-info-soft); }
.cal-completed { background: var(--color-success-soft); opacity: 0.7; }
.cal-cancelled { background: var(--color-danger-soft); text-decoration: line-through; }

@media (max-width: 640px) {
  .cal-cell {
    min-height: 56px;
  }

  .cal-event {
    font-size: 10px;
    padding: 1px 2px;
  }

  .detail-workspace {
    padding: var(--space-4);
  }

  .custom-row {
    grid-template-columns: 1fr 1fr;
  }
}

/* ============ Scrim & drawer ============ */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 55, 0.4);
  z-index: 35;
}

.scrim[hidden] {
  display: none;
}

/* ============ Responsive ============ */
@media (max-width: 1023px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    transform: translateX(-100%);
    transition: transform 200ms ease;
    box-shadow: var(--shadow-lg);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .menu-btn {
    display: inline-flex;
  }

  .search-box {
    display: none;
  }
}

@media (max-width: 640px) {
  #main-content {
    padding: var(--space-4);
  }

  .topbar {
    padding: 0 var(--space-4);
  }

  .profile-btn {
    width: 32px;
    height: 32px;
  }

  .kpi-value {
    font-size: 22px;
  }

  .modal {
    max-width: none;
    max-height: 90vh;
    border-radius: var(--radius-lg);
  }

  .modal-overlay {
    padding: var(--space-2);
  }

  .toast-region {
    left: var(--space-4);
    right: var(--space-4);
    max-width: none;
  }
}

/* ============ Accessibility ============ */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--color-primary);
  color: #FFFFFF;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  z-index: 200;
}

.skip-link:focus {
  left: var(--space-3);
  top: var(--space-3);
}

:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============ Sprint 7: Reports & Dashboard ============ */

.section-meta {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
  white-space: nowrap;
}

.reports-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: var(--space-5);
  align-items: start;
}

.reports-sidebar {
  position: sticky;
  top: 76px;
}

.reports-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.report-group-label {
  margin: var(--space-3) 0 var(--space-1);
  font-size: var(--text-caption);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
}

.report-group-label:first-child {
  margin-top: 0;
}

.report-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-text-secondary);
  font-size: var(--text-small);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
}

.report-item:hover {
  background: var(--color-page-bg);
  color: var(--color-text);
}

.report-item.active {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 600;
}

.filter-bar {
  display: flex;
  gap: var(--space-3);
  align-items: flex-end;
  flex-wrap: wrap;
  margin-top: var(--space-4);
}

.filter-field {
  min-width: 160px;
}

.filter-actions {
  margin-left: auto;
}

.report-meta {
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--color-border);
  margin-bottom: var(--space-3);
}

.report-meta-title {
  font-size: var(--text-heading);
  font-weight: 600;
  color: var(--color-text);
}

.report-meta-sub {
  margin-top: 2px;
  font-size: var(--text-caption);
  color: var(--color-text-secondary);
}

.report-totals {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-3);
}

.report-total-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--space-2) var(--space-3);
  background: var(--color-page-bg);
  border-radius: var(--radius-sm);
}

.report-total-label {
  font-size: var(--text-caption);
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.report-total-value {
  font-size: var(--text-body);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--color-text);
}

.report-table-wrap {
  max-height: 520px;
  overflow: auto;
}

.report-empty {
  padding: var(--space-6) 0;
  text-align: center;
}

.report-error {
  margin-top: var(--space-3);
}

/* Skeleton loading */

.skeleton-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-2) 0;
}

.skeleton-row {
  height: 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--color-page-bg) 25%, var(--color-border) 50%, var(--color-page-bg) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.4s ease infinite;
}

@keyframes skeleton-shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

/* Dashboard charts */

.chart-region {
  min-height: 180px;
}

.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 180px;
  padding: var(--space-2) 0 0;
}

.bar-column {
  flex: 1;
  display: flex;
  align-items: flex-end;
  height: 100%;
  min-width: 2px;
}

.bar {
  width: 100%;
  background: var(--color-primary);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
}

.bar-negative {
  background: var(--color-danger);
}

.chart-axis {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-caption);
  color: var(--color-text-muted);
  margin-top: var(--space-1);
}

.bar-groups {
  display: flex;
  gap: var(--space-6);
  align-items: flex-end;
  height: 180px;
  padding-top: var(--space-2);
}

.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  height: 100%;
}

.bar-group-bars {
  flex: 1;
  display: flex;
  gap: var(--space-2);
  align-items: flex-end;
  justify-content: center;
}

.bar-primary {
  background: var(--color-primary);
}

.bar-muted {
  background: var(--color-text-muted);
}

.bar-group-bars .bar {
  width: 34px;
  max-width: 40%;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}

.bar-group-label {
  text-align: center;
  font-size: var(--text-caption);
  color: var(--color-text-secondary);
}

.chart-legend {
  display: flex;
  gap: var(--space-4);
  margin-top: var(--space-3);
  font-size: var(--text-caption);
  color: var(--color-text-secondary);
}

.legend-swatch {
  display: inline-block;
