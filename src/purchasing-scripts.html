<!-- purchasing-scripts.html
     Purchasing client logic (Sprint 5/9 completion).
     One google.script.run for the page (getPurchasingPageData),
     one for detail (getPurchaseDetailView), one per mutation.
     Search uses a small debounce. Mobile cards drop the wide table. -->

<script>
(function () {
  'use strict';

  var UI = window.PURCHASING_UI;
  if (!UI) {
    return;
  }

  var state = {
    page: 1,
    pageSize: 25,
    search: '',
    status: '',
    supplierId: '',
    sort: 'newest',
    detailId: '',
    supplier: {
      page: 1,
      pageSize: 25,
      search: '',
      activeOnly: true
    }
  };

  function el(id) {
    return document.getElementById(id);
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data);
          }
        } else {
          APP.toast(toastMessageFromResponse(response, 'purchasing'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        APP.toast(toastMessageFromResponse(err, 'purchasing', true), 'error');
      });
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var args = arguments;
      var ctx = this;
      if (timer) {
        clearTimeout(timer);
      }
      timer = setTimeout(function () { fn.apply(ctx, args); }, wait || 250);
    };
  }

  function todayIso() {
    return new Date().toISOString().substring(0, 10);
  }

  function filters() {
    return {
      search: state.search,
      status: state.status,
      supplierId: state.supplierId,
      sort: state.sort,
      page: state.page,
      pageSize: state.pageSize
    };
  }

  function supplierFilters() {
    return {
      search: state.supplier.search,
      activeOnly: state.supplier.activeOnly,
      page: state.supplier.page,
      pageSize: state.supplier.pageSize
    };
  }

  function loadPage() {
    var tbody = el('purchase-tbody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-muted">Loading purchases...</td></tr>';
    }
    callServer('getPurchasingPageData', filters(), renderPage);
  }

  function loadSuppliers() {
    callServer('getSupplierPanel', supplierFilters(), renderSupplierPanel);
  }

  function renderPage(data) {
    var empty = el('purchase-empty');
    var list = el('purchase-tbody');
    var detailHost = el('purchase-detail-host');
    if (!list) return;
    list.innerHTML = '';
    var purchases = data.purchases || [];
    if (!purchases.length && state.page === 1) {
      if (empty) empty.hidden = false;
      list.innerHTML = '<tr><td colspan="8" class="text-muted">No purchases match these filters.</td></tr>';
    } else {
      if (empty) empty.hidden = true;
      for (var i = 0; i < purchases.length; i++) {
        list.insertAdjacentHTML('beforeend', UI.purchaseRow(purchases[i]));
      }
    }
    renderSummary(data.summary || {});
    renderSupplierOptions(data.lookups && data.lookups.suppliers);
    renderPagination('purchase-pagination', data, function (page) {
      state.page = page;
      loadPage();
    });
    if (detailHost && !state.detailId) {
      detailHost.innerHTML = '';
    }
  }

  function renderSummary(summary) {
    var counts = summary.statusCounts || {};
    var set = function (id, value) { var node = el(id); if (node) node.textContent = value; };
    set('purchase-kpi-draft', counts.DRAFT || 0);
    set('purchase-kpi-ordered', counts.ORDERED || 0);
    set('purchase-kpi-partial', counts.PARTIALLY_RECEIVED || 0);
    set('purchase-kpi-received', counts.RECEIVED || 0);
  }

  function renderSupplierOptions(suppliers) {
    var select = el('purchase-supplier-filter');
    if (!select) return;
    var current = select.value;
    select.innerHTML = '<option value="">All suppliers</option>';
    if (suppliers) {
      for (var i = 0; i < suppliers.length; i++) {
        var s = suppliers[i];
        var opt = document.createElement('option');
        opt.value = s.supplierId;
        opt.textContent = s.name + (s.isActive === false ? ' (inactive)' : '');
        select.appendChild(opt);
      }
    }
    if (current) {
      select.value = current;
    }
  }

  function renderSupplierPanel(data) {
    var tbody = el('purchase-supplier-tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    var items = data.items || [];
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-muted">No suppliers match.</td></tr>';
    } else {
      for (var i = 0; i < items.length; i++) {
        tbody.insertAdjacentHTML('beforeend', UI.supplierRow(items[i]));
      }
    }
    renderPagination('purchase-supplier-pagination', data, function (page) {
      state.supplier.page = page;
      loadSuppliers();
    });
  }

  function renderPagination(containerId, data, onPage) {
    var container = el(containerId);
    if (!container) return;
    var total = data.total || 0;
    var page = data.page || 1;
    var pageSize = data.pageSize || state.pageSize;
    var totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (totalPages <= 1) {
      container.innerHTML = '<span class="pagination-info">' + total + ' record(s)</span>';
      return;
    }
    var html = '<span class="pagination-info">Page ' + page + ' of ' + totalPages + ' (' + total + ' records)</span> ';
    html += '<button class="btn btn-ghost btn-sm" type="button" data-page-action="prev" data-target="' + containerId + '">&larr; Prev</button> ';
    html += '<button class="btn btn-ghost btn-sm" type="button" data-page-action="next" data-target="' + containerId + '">Next &rarr;</button>';
    container.innerHTML = html;
    var buttons = container.querySelectorAll('button[data-page-action]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function (e) {
        var target = e.currentTarget.getAttribute('data-target');
        var action = e.currentTarget.getAttribute('data-page-action');
        if (target === 'purchase-pagination') {
          if (action === 'prev' && state.page > 1) { state.page--; }
          else if (action === 'next' && page < totalPages) { state.page++; }
          loadPage();
        } else if (target === 'purchase-supplier-pagination') {
          if (action === 'prev' && state.supplier.page > 1) { state.supplier.page--; }
          else if (action === 'next' && page < totalPages) { state.supplier.page++; }
          loadSuppliers();
        }
      });
    }
  }

  function openDetail(purchaseId) {
    state.detailId = purchaseId;
    var host = el('purchase-detail-host');
    if (host) {
      host.innerHTML = '<div class="card"><div class="card-body text-muted">Loading purchase...</div></div>';
    }
    callServer('getPurchaseDetailView', purchaseId, function (detail) {
      if (!detail) {
        if (host) host.innerHTML = '';
        return;
      }
      if (host) host.innerHTML = UI.purchaseDetail(detail);
    });
  }

  function closeDetail() {
    state.detailId = '';
    var host = el('purchase-detail-host');
    if (host) host.innerHTML = '';
  }

  function reloadDetail() {
    if (state.detailId) {
      openDetail(state.detailId);
    }
  }

  function openPurchaseModal(editing) {
    callServer('getPurchasingPageData', { pageSize: 1 }, function (data) {
      var ctx = { lookups: data.lookups || {}, editing: editing, today: todayIso() };
      openFormModal(editing ? 'Edit Purchase ' + editing.purchaseId : 'Create Purchase',
        UI.purchaseForm(ctx),
        editing ? 'Save Changes' : 'Create as Draft',
        function (confirmBtn) { submitPurchase(editing, confirmBtn); });
      wirePurchaseForm();
    });
  }

  function openFormModal(title, body, confirmLabel, onConfirm) {
    var html = '<div class="modal-card">' +
      '<div class="modal-head"><h3 class="section-title">' + UI.esc(title) + '</h3><button class="btn btn-ghost" type="button" data-modal-close aria-label="Close">\u00D7</button></div>' +
      '<div class="modal-body">' + body + '</div>' +
      '<div class="modal-foot"><button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" data-modal-confirm>' + UI.esc(confirmLabel) + '</button></div>' +
    '</div>';
    APP.openModal(html);
    var closeButtons = document.querySelectorAll('[data-modal-close]');
    for (var i = 0; i < closeButtons.length; i++) {
      closeButtons[i].addEventListener('click', function () { APP.closeModal(); });
    }
    var confirmBtn = document.querySelector('[data-modal-confirm]');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function () { onConfirm(confirmBtn); });
    }
  }

  function wirePurchaseForm() {
    var addBtn = el('pf-add-line');
    if (addBtn) {
      addBtn.addEventListener('click', function () {
        var lines = el('pf-lines');
        var itemOptions = (lines.querySelector('select.pf-line-item') || {}).innerHTML || '';
        var count = lines.querySelectorAll('.purchase-line-row').length;
        var node = document.createElement('div');
        node.innerHTML = UI.lineRowTpl(count, null, itemOptions);
        lines.appendChild(node.firstChild);
        recalcPurchaseTotal();
      });
    }
    var container = el('pf-lines');
    if (container) {
      container.addEventListener('input', recalcPurchaseTotal);
      container.addEventListener('click', function (e) {
        if (e.target && e.target.classList.contains('pf-line-remove')) {
          var row = e.target.closest('.purchase-line-row');
          if (row) row.remove();
          recalcPurchaseTotal();
        }
      });
    }
    recalcPurchaseTotal();
  }

  function recalcPurchaseTotal() {
    var rows = document.querySelectorAll('#pf-lines .purchase-line-row');
    var shipping = Number((el('pf-shipping') && el('pf-shipping').value) || 0);
    var total = isFinite(shipping) ? shipping : 0;
    for (var i = 0; i < rows.length; i++) {
      var qty = Number((rows[i].querySelector('.pf-line-qty') || {}).value || 0);
      var cost = Number((rows[i].querySelector('.pf-line-cost') || {}).value || 0);
      var lineTotal = (isFinite(qty) ? qty : 0) * (isFinite(cost) ? cost : 0);
      var label = rows[i].querySelector('.purchase-line-total');
      if (label) label.textContent = UI.money(lineTotal);
      total += lineTotal;
    }
    var totalNode = el('pf-total');
    if (totalNode) totalNode.textContent = UI.money(total);
  }

  function readPurchaseLines() {
    var rows = document.querySelectorAll('#pf-lines .purchase-line-row');
    var lines = [];
    for (var i = 0; i < rows.length; i++) {
      var item = (rows[i].querySelector('.pf-line-item') || {}).value || '';
      var qty = Number((rows[i].querySelector('.pf-line-qty') || {}).value || 0);
      var cost = Number((rows[i].querySelector('.pf-line-cost') || {}).value || 0);
      if (item && qty > 0) {
        lines.push({ inventoryItemId: item, quantity: qty, unitCost: cost });
      }
    }
    return lines;
  }

  function submitPurchase(editing, confirmBtn) {
    var lines = readPurchaseLines();
    if (!lines.length) {
      APP.toast('Add at least one purchase line with a quantity.', 'error');
      return;
    }
    var payload = {
      supplierId: el('pf-supplier').value,
      purchaseDate: el('pf-date').value,
      expectedDate: el('pf-expected').value || '',
      shippingCost: Number(el('pf-shipping').value || 0),
      notes: el('pf-notes').value || '',
      lines: lines
    };
    if (!payload.supplierId) {
      APP.toast('Select a supplier.', 'error');
      return;
    }
    if (editing) {
      payload.purchaseId = editing.purchaseId;
    } else {
      payload.idempotencyKey = 'create-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
    }
    if (confirmBtn) confirmBtn.disabled = true;
    var fn = editing ? 'updatePurchase' : 'createPurchase';
    callServer(fn, payload, function (data) {
      APP.toast(editing ? 'Purchase updated.' : 'Purchase created as draft.', 'success');
      APP.closeModal();
      loadPage();
      if (!editing && data && data.purchaseId) {
        openDetail(data.purchaseId);
      }
    });
    if (confirmBtn) {
      setTimeout(function () { confirmBtn.disabled = false; }, 1500);
    }
  }

  function openSupplierModal(supplier) {
    openFormModal(supplier ? 'Edit Supplier' : 'Create Supplier',
      UI.supplierForm(supplier),
      supplier ? 'Save Changes' : 'Create Supplier',
      function (confirmBtn) { submitSupplier(supplier, confirmBtn); });
  }

  function submitSupplier(supplier, confirmBtn) {
    var payload = {
      name: el('sf-name').value.trim(),
      contactPerson: el('sf-contact').value.trim(),
      phone: el('sf-phone').value.trim(),
      email: el('sf-email').value.trim(),
      address: el('sf-address').value.trim(),
      paymentTermsDays: Number(el('sf-terms').value || 0),
      notes: el('sf-notes').value || ''
    };
    if (!payload.name) {
      APP.toast('Supplier name is required.', 'error');
      return;
    }
    if (supplier) {
      payload.supplierId = supplier.supplierId;
    }
    if (confirmBtn) confirmBtn.disabled = true;
    var fn = supplier ? 'updateSupplier' : 'createSupplier';
    callServer(fn, payload, function () {
      APP.toast(supplier ? 'Supplier updated.' : 'Supplier created.', 'success');
      APP.closeModal();
      loadSuppliers();
      loadPage();
    });
  }

  function openReceiveModal(purchaseId) {
    callServer('getPurchaseDetailView', purchaseId, function (detail) {
      if (!detail) return;
      openFormModal('Receive Items',
        UI.receiveForm(detail),
        'Record Receipt',
        function (confirmBtn) { submitReceive(purchaseId, confirmBtn); });
    });
  }

  function submitReceive(purchaseId, confirmBtn) {
    var inputs = document.querySelectorAll('.rf-qty');
    var lines = [];
    var anyQty = false;
    for (var i = 0; i < inputs.length; i++) {
      var qty = Number(inputs[i].value || 0);
      if (qty > 0) anyQty = true;
      lines.push({
        purchaseItemId: inputs[i].getAttribute('data-line-id'),
        quantity: qty
      });
    }
    if (!anyQty) {
      APP.toast('Enter at least one positive receive quantity.', 'error');
      return;
    }
    var payload = {
      purchaseId: purchaseId,
      receivedDate: el('rf-date').value || todayIso(),
      idempotencyKey: el('rf-key').value.trim(),
      lines: lines
    };
    if (!payload.idempotencyKey) {
      APP.toast('Idempotency key is required for receipts.', 'error');
      return;
    }
    if (confirmBtn) confirmBtn.disabled = true;
    callServer('receivePurchase', payload, function (data) {
      APP.toast('Receipt recorded. Stock updated.', 'success');
      APP.closeModal();
      loadPage();
      loadSuppliers();
      if (state.detailId === purchaseId) {
        openDetail(purchaseId);
      }
    });
  }

  function confirmAndRun(title, body, onConfirm) {
    var html = '<div class="modal-card">' +
      '<div class="modal-head"><h3 class="section-title">' + UI.esc(title) + '</h3><button class="btn btn-ghost" type="button" data-modal-close aria-label="Close">\u00D7</button></div>' +
      '<div class="modal-body"><p>' + UI.esc(body) + '</p></div>' +
      '<div class="modal-foot"><button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" data-modal-confirm>Confirm</button></div>' +
    '</div>';
    APP.openModal(html);
    var closeButtons = document.querySelectorAll('[data-modal-close]');
    for (var i = 0; i < closeButtons.length; i++) {
      closeButtons[i].addEventListener('click', function () { APP.closeModal(); });
    }
    var confirmBtn = document.querySelector('[data-modal-confirm]');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function () {
        APP.closeModal();
        onConfirm();
      });
    }
  }

  function placeOrder(purchaseId) {
    confirmAndRun('Place Order', 'Mark this purchase as ordered? Stock will not change until items are received.',
      function () {
        callServer('placePurchaseOrder', { purchaseId: purchaseId }, function () {
          APP.toast('Purchase placed.', 'success');
          loadPage();
          if (state.detailId === purchaseId) openDetail(purchaseId);
        });
      });
  }

  function cancelPurchase(purchaseId) {
    var reason = window.prompt('Reason for cancellation?');
    if (!reason) {
      APP.toast('A cancellation reason is required.', 'error');
      return;
    }
    callServer('cancelPurchase', { purchaseId: purchaseId, reason: reason }, function () {
      APP.toast('Purchase cancelled.', 'success');
      loadPage();
      if (state.detailId === purchaseId) openDetail(purchaseId);
    });
  }

  function wireEvents() {
    var search = el('purchase-search');
    if (search) {
      search.addEventListener('input', debounce(function () {
        state.search = search.value.trim();
        state.page = 1;
        loadPage();
      }, 250));
    }
    var statusFilter = el('purchase-status-filter');
    if (statusFilter) {
      statusFilter.addEventListener('change', function () {
        state.status = statusFilter.value;
        state.page = 1;
        loadPage();
      });
    }
    var supplierFilter = el('purchase-supplier-filter');
    if (supplierFilter) {
      supplierFilter.addEventListener('change', function () {
        state.supplierId = supplierFilter.value;
        state.page = 1;
        loadPage();
      });
    }
    var sort = el('purchase-sort');
    if (sort) {
      sort.addEventListener('change', function () {
        state.sort = sort.value;
        loadPage();
      });
    }
    var supplierSearch = el('purchase-supplier-search');
    if (supplierSearch) {
      supplierSearch.addEventListener('input', debounce(function () {
        state.supplier.search = supplierSearch.value.trim();
        state.supplier.page = 1;
        loadSuppliers();
      }, 250));
    }
    var supplierToggle = el('purchase-supplier-toggle');
    if (supplierToggle) {
      supplierToggle.addEventListener('click', function () {
        state.supplier.activeOnly = !state.supplier.activeOnly;
        var label = el('purchase-supplier-toggle-label');
        if (label) label.textContent = state.supplier.activeOnly ? 'Active only' : 'All suppliers';
        loadSuppliers();
      });
    }
    var refresh = el('purchase-refresh');
    if (refresh) refresh.addEventListener('click', function () { loadPage(); loadSuppliers(); if (state.detailId) openDetail(state.detailId); });
    var add = el('purchase-action-create');
    if (add) add.addEventListener('click', function () { openPurchaseModal(null); });
    var emptyAdd = el('purchase-empty-create');
    if (emptyAdd) emptyAdd.addEventListener('click', function () { openPurchaseModal(null); });
    var addSupplier = el('purchase-action-add-supplier');
    if (addSupplier) addSupplier.addEventListener('click', function () { openSupplierModal(null); });
    var list = el('purchase-tbody');
    if (list) {
      list.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-purchase-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-purchase-action');
        var id = btn.getAttribute('data-purchase-id');
        if (action === 'view') openDetail(id);
        else if (action === 'place') placeOrder(id);
        else if (action === 'cancel') cancelPurchase(id);
        else if (action === 'receive') openReceiveModal(id);
        else if (action === 'edit') editPurchase(id);
      });
    }
    var supplierList = el('purchase-supplier-tbody');
    if (supplierList) {
      supplierList.addEventListener('click', function (e) {
        var row = e.target.closest('tr[data-supplier-id]');
        if (!row) return;
        state.supplierId = row.getAttribute('data-supplier-id');
        state.page = 1;
        if (supplierFilter) supplierFilter.value = state.supplierId;
        loadPage();
      });
    }
    var host = el('purchase-detail-host');
    if (host) {
      host.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-purchase-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-purchase-action');
        var id = btn.getAttribute('data-purchase-id');
        if (action === 'place') placeOrder(id);
        else if (action === 'cancel') cancelPurchase(id);
        else if (action === 'open-receive') openReceiveModal(id);
        else if (action === 'edit') editPurchase(id);
        else if (action === 'close-detail') closeDetail();
      });
    }
  }

  function editPurchase(purchaseId) {
    callServer('getPurchase', purchaseId, function (purchase) {
      if (!purchase) return;
      openPurchaseModal(purchase);
    });
  }

  function activate() {
    state.page = 1;
    state.supplier.page = 1;
    state.detailId = '';
    wireEvents();
    loadPage();
    loadSuppliers();
  }

  window.PURCHASING = {
    activate: activate,
    openDetail: openDetail
  };
})();
</script>
