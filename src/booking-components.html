<!-- booking-components.html
     Bookings UI templates (Sprint 3): booking form with live pricing,
     conflict warnings, table rows, timeline, and payment templates.
     window.BKG_UI. -->

<script>
(function () {
  'use strict';

  function esc(value) {
    return UI.escapeHtml(value);
  }

  function money(value) {
    return '\u20B1' + Number(value || 0).toFixed(2);
  }

  function titleCase(value) {
    return String(value || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function field(label, inputHtml, hint) {
    return '<div class="field"><label class="field-label">' + esc(label) + '</label>' + inputHtml +
      (hint ? '<span class="field-hint">' + esc(hint) + '</span>' : '') + '</div>';
  }

  var BOOKING_STATUSES = ['INQUIRY', 'TENTATIVE', 'CONFIRMED', 'PREPARING', 'READY', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED', 'ARCHIVED'];
  var PAYMENT_STATUSES = ['UNPAID', 'PARTIALLY_PAID', 'PAID', 'OVERPAID', 'REFUND_DUE', 'REFUNDED', 'VOIDED'];
  var SERVICE_TYPES = PKG_UI.SERVICE_TYPES;
  var EVENT_TYPES = CUST_UI ? ['WEDDING', 'DEBUT', 'BIRTHDAY', 'CORPORATE', 'SCHOOL_EVENT', 'OTHER'] : [];
  var PAYMENT_TYPES = ['DOWN_PAYMENT', 'PARTIAL_PAYMENT', 'FINAL_PAYMENT', 'FULL_PAYMENT', 'ADDITIONAL_PAYMENT', 'OTHER'];
  var PAYMENT_METHODS = ['CASH', 'GCASH', 'MAYA', 'BANK_TRANSFER', 'CARD', 'OTHER'];

  function options(values, selected) {
    var html = '';
    for (var i = 0; i < values.length; i++) {
      var sel = selected === values[i] ? ' selected' : '';
      html += '<option value="' + esc(values[i]) + '"' + sel + '>' + esc(titleCase(values[i])) + '</option>';
    }
    return html;
  }

  function statusBadge(status, kind) {
    var map = {
      INQUIRY: ['info', 'Inquiry'],
      TENTATIVE: ['warning', 'Tentative'],
      CONFIRMED: ['success', 'Confirmed'],
      PREPARING: ['info', 'Preparing'],
      READY: ['info', 'Ready'],
      IN_PROGRESS: ['info', 'In Progress'],
      COMPLETED: ['success', 'Completed'],
      CANCELLED: ['danger', 'Cancelled'],
      ARCHIVED: ['neutral', 'Archived'],
      UNPAID: ['warning', 'Unpaid'],
      PARTIALLY_PAID: ['warning', 'Partially Paid'],
      PAID: ['success', 'Paid'],
      OVERPAID: ['info', 'Overpaid'],
      REFUND_DUE: ['warning', 'Refund Due'],
      REFUNDED: ['neutral', 'Refunded'],
      VOIDED: ['danger', 'Voided']
    };
    var meta = map[status] || ['neutral', status];
    return UI.badge(meta[1], meta[0]);
  }

  function bookingRow(b, clientName) {
    return '<tr>' +
      '<td><div class="cell-main">' + esc(b.bookingTitle || '-') + '</div><div class="cell-sub">' + esc(b.bookingCode) + '</div></td>' +
      '<td>' + esc(clientName || b.clientId) + '</td>' +
      '<td>' + esc(titleCase(b.serviceType)) + '</td>' +
      '<td>' + esc(b.eventDate || '-') + '</td>' +
      '<td>' + esc(b.venueName || '-') + '</td>' +
      '<td class="num">' + money(b.grossBookingAmount) + '</td>' +
      '<td class="num">' + money(b.amountPaidCached) + '</td>' +
      '<td class="num">' + money(b.balanceDueCached) + '</td>' +
      '<td>' + statusBadge(b.bookingStatus) + '</td>' +
      '<td>' + statusBadge(b.paymentStatus) + '</td>' +
      '<td><div class="row-actions">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-booking-view="' + esc(b.bookingId) + '">View</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-booking-menu="' + esc(b.bookingId) + '" aria-label="More actions">\u22EE</button>' +
      '</div></td></tr>';
  }

  function clientOptions(clients) {
    var html = '<option value="">Select a client</option>';
    for (var i = 0; i < clients.length; i++) {
      var c = clients[i];
      if (c.clientStatus === 'ARCHIVED' || c.clientStatus === 'BLOCKED') {
        continue;
      }
      html += '<option value="' + esc(c.clientId) + '">' + esc(c.fullName || c.businessOrOrganization || c.clientId) + ' (' + esc(c.contactNumber || c.email || 'no contact') + ')</option>';
    }
    return html;
  }

  function packageOptions(packages) {
    var html = '<option value="">Custom booking (no package)</option>';
    for (var i = 0; i < packages.length; i++) {
      if (packages[i].isActive === false) {
        continue;
      }
      html += '<option value="' + esc(packages[i].packageId) + '">' + esc(packages[i].packageName) + ' - ' + money(packages[i].basePrice) + '</option>';
    }
    return html;
  }

  function addOnCheckboxes(addOns) {
    var html = '';
    for (var i = 0; i < addOns.length; i++) {
      if (addOns[i].isActive === false) {
        continue;
      }
      html += '<label class="check-label addon-check"><input type="checkbox" value="' + esc(addOns[i].addOnId) + '" data-addon-check>' +
        ' ' + esc(addOns[i].addOnName) + ' <span class="note-meta">(' + money(addOns[i].sellingPrice) + ')</span></label>';
    }
    return html || '<p class="note-meta">No active add-ons available.</p>';
  }

  function bookingFormTpl(ctx) {
    var b = ctx.booking || {};
    return '<form id="booking-form" class="finance-form" novalidate>' +
      '<h4 class="form-section-title">Client</h4>' +
      '<div class="form-row">' +
      field('Client', '<select class="field-select" id="bf-client">' + clientOptions(ctx.clients) + '</select>') +
      field('Initial status', '<select class="field-select" id="bf-status">' + options(['INQUIRY', 'TENTATIVE'], b.bookingStatus || 'INQUIRY') + '</select>') +
      '</div>' +
      '<h4 class="form-section-title">Event details</h4>' +
      field('Booking title', '<input class="field-input" type="text" id="bf-title" maxlength="150" value="' + esc(b.bookingTitle || '') + '">') +
      '<div class="form-row">' +
      field('Service type', '<select class="field-select" id="bf-servicetype">' + options(SERVICE_TYPES, b.serviceType || 'PHOTOBOOTH') + '</select>') +
      field('Event type', '<select class="field-select" id="bf-eventtype"><option value="">Not specified</option>' + options(EVENT_TYPES, b.eventType || '') + '</select>') +
      '</div>' +
      '<div class="form-row">' +
      field('Event date', '<input class="field-input" type="date" id="bf-eventdate" value="' + esc(b.eventDate || '') + '">') +
      field('Setup time (min)', '<input class="field-input num-input" type="number" min="0" step="15" id="bf-setup" value="' + esc(b.setupTime || '') + '">') +
      '</div>' +
      '<div class="form-row">' +
      field('Start time', '<input class="field-input" type="time" id="bf-start" value="' + esc(b.eventStartTime || '') + '">') +
      field('End time', '<input class="field-input" type="time" id="bf-end" value="' + esc(b.eventEndTime || '') + '">') +
      '</div>' +
      field('Venue name', '<input class="field-input" type="text" id="bf-venue" maxlength="150" value="' + esc(b.venueName || '') + '">') +
      field('Venue address', '<input class="field-input" type="text" id="bf-venueaddr" maxlength="200" value="' + esc(b.venueAddress || '') + '">') +
      '<div class="form-row">' +
      field('City / municipality', '<input class="field-input" type="text" id="bf-city" maxlength="100" value="' + esc(b.cityMunicipality || '') + '">') +
      field('Province', '<input class="field-input" type="text" id="bf-province" maxlength="100" value="' + esc(b.province || '') + '">') +
      '</div>' +
      '<h4 class="form-section-title">Package and add-ons</h4>' +
      field('Package', '<select class="field-select" id="bf-package">' + packageOptions(ctx.packages) + '</select>') +
      '<div class="addon-grid" id="bf-addons">' + addOnCheckboxes(ctx.addOns) + '</div>' +
      '<h4 class="form-section-title">Custom charges</h4>' +
      '<div id="bf-custom-rows"></div>' +
      '<button class="btn btn-secondary btn-sm mt-2" type="button" id="bf-add-custom">Add custom charge</button>' +
      '<div class="form-row mt-3">' +
      field('Transportation charged to client', '<input class="field-input num-input" type="number" min="0" step="0.01" id="bf-transport" value="' + esc(b.transportationCharge || '') + '">') +
      field('Planned partner commission', '<input class="field-input num-input" type="number" min="0" step="0.01" id="bf-commission" value="' + esc(b.plannedPartnerCommission || '') + '">') +
      '</div>' +
      '<h4 class="form-section-title">Discount</h4>' +
      '<div class="form-row">' +
      field('Discount type', '<select class="field-select" id="bf-discounttype">' + options(['NONE', 'FIXED', 'PERCENTAGE'], b.discountType || 'NONE') + '</select>') +
      field('Discount value', '<input class="field-input num-input" type="number" min="0" step="0.01" id="bf-discountvalue" value="' + esc(b.discountValue || '') + '">') +
      '</div>' +
      '<h4 class="form-section-title">Estimated cost</h4>' +
      '<div class="form-row">' +
      field('Cost source', '<select class="field-select" id="bf-costsource">' +
        '<option value="CALCULATED">Calculated from package and add-ons</option>' +
        '<option value="MANUAL">Manual estimate</option></select>') +
      field('Manual estimated direct cost', '<input class="field-input num-input" type="number" min="0" step="0.01" id="bf-manualcost">') +
      '</div>' +
      field('Special instructions', '<textarea class="field-textarea" id="bf-instructions" maxlength="1000">' + esc(b.specialInstructions || '') + '</textarea>') +
      field('Internal notes', '<textarea class="field-textarea" id="bf-notes" maxlength="1000">' + esc(b.internalNotes || '') + '</textarea>') +
      '<div class="profit-preview" id="bf-preview"></div>' +
      '<div id="bf-conflicts" class="mt-2"></div>' +
      '<div class="field" id="bf-override-field" hidden><label class="field-label">Conflict override reason</label>' +
      '<input class="field-input" type="text" id="bf-override" maxlength="300"></div>' +
      '<div class="field-error" id="bf-error" hidden></div>' +
      '</form>';
  }

  function customChargeRowTpl(index, charge) {
    charge = charge || {};
    return '<div class="custom-row" data-index="' + index + '">' +
      '<input class="field-input" type="text" data-cf="name" placeholder="Charge name" maxlength="100" value="' + esc(charge.name || '') + '">' +
      '<input class="field-input num-input" type="number" min="1" step="1" data-cf="qty" value="' + esc(charge.quantity || 1) + '" style="max-width:80px">' +
      '<input class="field-input num-input" type="number" min="0" step="0.01" data-cf="price" placeholder="Price" value="' + esc(charge.unitPrice || '') + '">' +
      '<input class="field-input num-input" type="number" min="0" step="0.01" data-cf="cost" placeholder="Est. cost" value="' + esc(charge.estimatedCost || '') + '" style="max-width:100px">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-cf-remove aria-label="Remove charge">\u2715</button>' +
      '</div>';
  }

  function pricingPreviewTpl(p) {
    var marginTone = p.estimatedGrossProfit < 0 ? 'danger' : p.estimatedProfitMargin < 15 ? 'warning' : 'success';
    return '<div class="breakdown-grid">' +
      '<div class="breakdown-item"><span class="breakdown-label">Subtotal</span><span class="breakdown-value">' + money(p.subtotal) + '</span></div>' +
      '<div class="breakdown-item"><span class="breakdown-label">Discount</span><span class="breakdown-value">' + money(p.discountAmount) + '</span></div>' +
      '<div class="breakdown-item"><span class="breakdown-label">Booking total</span><span class="breakdown-value">' + money(p.grossBookingAmount) + '</span></div>' +
      '<div class="breakdown-item"><span class="breakdown-label">Estimated cost</span><span class="breakdown-value">' + money(p.estimatedDirectCost) + '</span></div>' +
      '<div class="breakdown-item"><span class="breakdown-label">Estimated profit</span><span class="breakdown-value">' + money(p.estimatedGrossProfit) + '</span></div>' +
      '<div class="breakdown-item"><span class="breakdown-label">Estimated margin</span><span class="breakdown-value">' + p.estimatedProfitMargin.toFixed(2) + '%</span></div>' +
      '</div>' +
      '<p class="note-meta mt-2">' + UI.badge('Estimate', marginTone) + ' Planning estimate only - not actual net income.</p>';
  }

  function conflictListTpl(conflicts) {
    var html = '<div class="alert alert-warning"><strong>' + conflicts.length + ' schedule conflict(s) detected.</strong><ul class="dup-list">';
    for (var i = 0; i < conflicts.length; i++) {
      var c = conflicts[i];
      html += '<li>' + esc(c.bookingCode) + ' - ' + esc(c.bookingTitle || 'untitled') + ' (' + esc(c.eventStartTime || '?') + '-' + esc(c.eventEndTime || '?') + ', ' + esc(c.bookingStatus) + ')</li>';
    }
    html += '</ul></div>';
    return html;
  }

  function timelineItemTpl(t) {
    var tone = t.type === 'STATUS' ? 'badge-info' : t.type === 'SCHEDULE' ? 'badge-warning' : t.type === 'PAYMENT' ? 'badge-success' : t.type === 'REFUND' ? 'badge-neutral' : 'badge-neutral';
    return '<div class="timeline-item"><span class="badge ' + tone + '">' + esc(t.type) + '</span>' +
      '<div class="timeline-main"><div class="cell-main">' + esc(t.title) + '</div>' +
      (t.detail ? '<div class="cell-sub">' + esc(t.detail) + '</div>' : '') + '</div>' +
      '<span class="note-meta">' + esc(t.time || '') + '</span></div>';
  }

  function paymentRowTpl(p) {
    return '<tr>' +
      '<td><div class="cell-main">' + esc(p.paymentCode) + '</div><div class="cell-sub">' + esc(p.paymentDate || '') + '</div></td>' +
      '<td>' + esc(p.payerName || '-') + '</td>' +
      '<td>' + esc(titleCase(p.paymentMethod)) + '</td>' +
      '<td>' + esc(titleCase(p.paymentType)) + '</td>' +
      '<td class="num">' + money(p.amount) + '</td>' +
      '<td>' + statusBadge(p.status) + '</td>' +
      '<td><div class="row-actions">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-payment-view="' + esc(p.paymentId) + '">View</button>' +
      (p.status === 'POSTED'
        ? '<button class="btn btn-ghost btn-sm text-danger" type="button" data-payment-void="' + esc(p.paymentId) + '">Void</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-payment-refund="' + esc(p.paymentId) + '">Refund</button>'
        : '') +
      '</div></td></tr>';
  }

  function receivableRowTpl(r) {
    return '<tr>' +
      '<td><div class="cell-main">' + esc(r.bookingTitle || '-') + '</div><div class="cell-sub">' + esc(r.bookingCode) + '</div></td>' +
      '<td>' + esc(r.clientId) + '</td>' +
      '<td>' + esc(r.eventDate || '-') + '</td>' +
      '<td class="num">' + money(r.grossBookingAmount) + '</td>' +
      '<td class="num">' + money(r.paid) + '</td>' +
      '<td class="num">' + money(r.balanceDue) + '</td>' +
      '<td>' + statusBadge(r.paymentStatus) + '</td>' +
      '<td>' + (r.daysUntilEvent === null ? UI.badge('Past event', 'neutral') : esc(r.daysUntilEvent) + ' day(s)') + '</td>' +
      '<td><div class="row-actions">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-receivable-pay="' + esc(r.bookingId) + '">Record Payment</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-booking-view="' + esc(r.bookingId) + '">View</button>' +
      '</div></td></tr>';
  }

  function paymentFormTpl(booking, accounts, ctx) {
    var balance = Number(booking.balanceDueCached || 0);
    return '<form id="payment-form" class="finance-form" novalidate>' +
      '<div class="profile-grid">' +
      '<div class="profile-item"><span class="profile-label">Booking</span><span class="profile-value">' + esc(booking.bookingTitle || booking.bookingCode) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Client</span><span class="profile-value">' + esc(ctx.clientName || booking.clientId) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Booking total</span><span class="profile-value">' + money(booking.grossBookingAmount) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Paid</span><span class="profile-value">' + money(booking.amountPaidCached) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Balance</span><span class="profile-value" id="pf-balance">' + money(balance) + '</span></div>' +
      '</div>' +
      '<div class="form-row">' +
      field('Payment type', '<select class="field-select" id="pf-type">' + options(PAYMENT_TYPES, 'PARTIAL_PAYMENT') + '</select>') +
      field('Payment date', '<input class="field-input" type="date" id="pf-date" value="' + esc(ctx.today) + '">') +
      '</div>' +
      '<div class="form-row">' +
      field('Payment method', '<select class="field-select" id="pf-method">' + options(PAYMENT_METHODS, 'CASH') + '</select>') +
      field('Cash account', '<select class="field-select" id="pf-account">' + accountOptions(accounts) + '</select>') +
      '</div>' +
      field('Amount', '<input class="field-input num-input" type="number" min="0.01" step="0.01" id="pf-amount">') +
      '<div class="form-row">' +
      field('Reference number', '<input class="field-input" type="text" id="pf-reference" maxlength="60">') +
      field('Payer name', '<input class="field-input" type="text" id="pf-payer" maxlength="100">') +
      '</div>' +
      field('Notes', '<input class="field-input" type="text" id="pf-notes" maxlength="300">') +
      '<div class="field-error" id="pf-error" hidden></div>' +
      '</form>';
  }

  function accountOptions(accounts) {
    var html = '';
    for (var i = 0; i < accounts.length; i++) {
      if (accounts[i].isActive === false) {
        continue;
      }
      html += '<option value="' + esc(accounts[i].accountId) + '">' + esc(accounts[i].accountName) + '</option>';
    }
    return html;
  }

  function refundFormTpl(payment, eligibility, accounts) {
    return '<form id="refund-form" class="finance-form" novalidate>' +
      '<div class="profile-grid">' +
      '<div class="profile-item"><span class="profile-label">Payment</span><span class="profile-value">' + esc(payment.paymentCode) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Payment amount</span><span class="profile-value">' + money(payment.amount) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Already refunded</span><span class="profile-value">' + money(eligibility.refunded) + '</span></div>' +
      '<div class="profile-item"><span class="profile-label">Refundable</span><span class="profile-value">' + money(eligibility.refundableAmount) + '</span></div>' +
      '</div>' +
      field('Refund amount', '<input class="field-input num-input" type="number" min="0.01" step="0.01" id="rf-amount" max="' + esc(eligibility.refundableAmount) + '">') +
      field('Refund date', '<input class="field-input" type="date" id="rf-date" value="' + esc(new Date().toISOString().slice(0, 10)) + '">') +
      field('Cash account (refund source)', '<select class="field-select" id="rf-account">' + accountOptions(accounts) + '</select>') +
      field('Reason', '<textarea class="field-textarea" id="rf-reason" maxlength="300" required></textarea>') +
      '<div class="alert alert-info mt-2">Refunds create a cash outflow and are reported separately from operating expenses.</div>' +
      '<div class="field-error" id="rf-error" hidden></div>' +
      '</form>';
  }

  function calendarEventTpl(b) {
    return '<button class="cal-event cal-' + esc((b.bookingStatus || 'INQUIRY').toLowerCase()) + '" type="button" data-booking-view="' + esc(b.bookingId) + '" title="' + esc(b.bookingTitle || '') + '">' +
      esc((b.eventStartTime || '').substring(0, 5)) + ' ' + esc(b.bookingTitle || b.bookingCode) + '</button>';
  }

  window.BKG_UI = {
    esc: esc,
    money: money,
    titleCase: titleCase,
    options: options,
    statusBadge: statusBadge,
    bookingRow: bookingRow,
    bookingFormTpl: bookingFormTpl,
    customChargeRowTpl: customChargeRowTpl,
    pricingPreviewTpl: pricingPreviewTpl,
    conflictListTpl: conflictListTpl,
    timelineItemTpl: timelineItemTpl,
    paymentRowTpl: paymentRowTpl,
    receivableRowTpl: receivableRowTpl,
    paymentFormTpl: paymentFormTpl,
    refundFormTpl: refundFormTpl,
    calendarEventTpl: calendarEventTpl,
    BOOKING_STATUSES: BOOKING_STATUSES,
    PAYMENT_STATUSES: PAYMENT_STATUSES,
    SERVICE_TYPES: SERVICE_TYPES,
    EVENT_TYPES: EVENT_TYPES,
    PAYMENT_TYPES: PAYMENT_TYPES,
    PAYMENT_METHODS: PAYMENT_METHODS
  };
})();
</script>
