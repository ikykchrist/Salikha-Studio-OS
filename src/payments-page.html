<!-- payments-page.html
     Payments + Receivables page (Sprint 3). Rendered by
     payment-scripts.html. -->

<section id="view-payments" class="view" hidden aria-label="Payments">
  <div class="section-head">
    <div>
      <h2 class="section-title">Payments</h2>
      <p class="section-hint">Every payment posts exactly one cash inflow. Booking totals never create cash.</p>
    </div>
    <div class="section-actions">
      <button class="btn btn-primary" type="button" data-pay-action="record">Record Payment</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Payment sections">
    <button class="tab active" type="button" role="tab" data-pay-tab="payments">Payments</button>
    <button class="tab" type="button" role="tab" data-pay-tab="receivables">Receivables</button>
  </div>

  <div id="pay-payments-section">
    <div class="card">
      <div class="filter-row">
        <div class="search-box">
          <span class="search-icon" data-icon="search" aria-hidden="true"></span>
          <input type="search" id="payments-search" placeholder="Search code, reference, payer..." aria-label="Search payments">
        </div>
        <select class="field-select filter-select" id="payments-method-filter" aria-label="Filter by method">
          <option value="">All methods</option>
        </select>
        <select class="field-select filter-select" id="payments-status-filter" aria-label="Filter by status">
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="table-wrap mt-3">
        <table class="data-table">
          <thead>
            <tr>
              <th>Payment</th>
              <th>Date</th>
              <th>Client</th>
              <th>Method</th>
              <th class="num">Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="payments-table-body"></tbody>
        </table>
      </div>
      <div class="pagination-row" id="payments-pagination"></div>
    </div>
  </div>

  <div id="pay-receivables-section" hidden>
    <div class="card">
      <div class="filter-row">
        <select class="field-select filter-select" id="receivables-mode-filter" aria-label="Receivables filter">
          <option value="outstanding">Outstanding only</option>
          <option value="overdue">Overdue or past event</option>
          <option value="upcoming">Upcoming event</option>
          <option value="partially_paid">Partially paid</option>
          <option value="unpaid">Unpaid</option>
          <option value="overpaid">Overpaid</option>
        </select>
      </div>
      <div class="table-wrap mt-3">
        <table class="data-table">
          <thead>
            <tr>
              <th>Booking</th>
              <th>Client</th>
              <th>Event Date</th>
              <th class="num">Total</th>
              <th class="num">Paid</th>
              <th class="num">Balance</th>
              <th>Payment Status</th>
              <th>Days Until Event</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="receivables-table-body"></tbody>
        </table>
      </div>
      <div class="pagination-row" id="receivables-pagination"></div>
    </div>
  </div>
</section>
