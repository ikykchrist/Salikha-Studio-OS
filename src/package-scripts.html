<!-- package-scripts.html
     Packages page controller (Sprint 2): list, form with live profit
     preview, atomic item editor, and add-ons. -->

<script>
(function () {
  'use strict';

  var state = {
    page: 1,
    addOnsPage: 1,
    editingItemsPackage: null
  };

  function el(id) {
    return document.getElementById(id);
  }

  function esc(v) {
    return PKG_UI.esc(v);
  }

  function callServer(fnName, args, onOk) {
    var run = google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          if (onOk) {
            onOk(response.data);
          }
        } else {
          APP.toast(toastMessageFromResponse(response, 'packages'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        APP.toast(toastMessageFromResponse(err, 'packages', true), 'error');
      });
    if (args !== undefined) {
      run[fnName](args);
    } else {
      run[fnName]();
    }
  }

  function openModal(title, bodyHtml, confirmLabel, onConfirm) {
    var footer = '<button class="btn btn-ghost" type="button" data-modal-close>Cancel</button>' +
      '<button class="btn btn-primary" type="button" id="finance-modal-confirm">' + esc(confirmLabel) + '</button>';
    APP.openModal(UI.modal(title, bodyHtml, footer));
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn && onConfirm) {
      confirmBtn.addEventListener('click', function () {
        onConfirm(confirmBtn);
      });
    }
  }

  function formError(id, message) {
    var node = el(id);
    if (node) {
      node.textContent = message;
      node.hidden = false;
    }
  }

  /* ================= Packages ================= */

  function filters() {
    return {
      search: el('packages-search').value.trim(),
      serviceType: el('packages-type-filter').value,
      activeOnly: false,
      page: state.page
    };
  }

  function loadPackages() {
    callServer('getPackages', filters(), function (data) {
      renderPackages(data);
      loadSummary();
    });
  }

  function renderPackages(data) {
    var tbody = el('packages-table-body');
    if (!data.items.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">' +
        '<p class="empty-title">No packages yet</p>' +
        '<p class="empty-hint">Create a package to start the service catalog.</p></div></td></tr>';
      el('packages-pagination').innerHTML = '';
      return;
    }
    var html = '';
    for (var i = 0; i < data.items.length; i++) {
      html += PKG_UI.packageRow(data.items[i]);
    }
    tbody.innerHTML = html;
    renderPagination('packages-pagination', data, function (page) {
      state.page = page;
      loadPackages();
    });
  }

  function loadSummary() {
    callServer('getPackages', { activeOnly: true, pageSize: 1 }, function () {});
    callServer('getHomeDashboardSummary', undefined, function (dash) {
      if (dash && dash.uninitialized) {
        return;
      }
      el('kpi-active-packages').textContent = String(dash.activePackages);
    });
    callServer('getPackages', { activeOnly: true, pageSize: 100 }, function (all) {
      var avgPrice = 0;
      var avgMargin = 0;
      var featured = 0;
      var count = all.items.length;
      for (var i = 0; i < count; i++) {
        avgPrice += Number(all.items[i].basePrice || 0);
        avgMargin += Number(all.items[i].expectedProfitMargin || 0);
        if (all.items[i].isFeatured) {
          featured++;
        }
      }
      el('kpi-avg-price').textContent = PKG_UI.money(count ? avgPrice / count : 0);
      el('kpi-avg-margin').textContent = (count ? avgMargin / count : 0).toFixed(2) + '%';
      el('kpi-featured-packages').textContent = String(featured);
    });
  }

  function openPackageForm(pkg) {
    var body = PKG_UI.packageFormTpl(pkg);
    var title = pkg ? 'Edit package' : 'Create package';
    openModal(title, body, pkg ? 'Save changes' : 'Create package', function (confirmBtn) {
      submitPackageForm(pkg, confirmBtn);
    });
    wireProfitPreview();
  }

  function wireProfitPreview() {
    var price = el('pf-price');
    var cost = el('pf-cost');
    var method = el('pf-method');
    if (!price || !cost || !method) {
      return;
    }
    function refresh() {
      var gross = Number(price.value || 0) - Number(cost.value || 0);
      var margin = Number(price.value || 0) > 0 ? (gross / Number(price.value || 0)) * 100 : 0;
      el('pf-gross').textContent = PKG_UI.money(gross);
      el('pf-margin').textContent = margin.toFixed(2) + '%';
      el('pf-manual-field').hidden = method.value !== 'MANUAL';
    }
    price.addEventListener('input', refresh);
    cost.addEventListener('input', refresh);
    method.addEventListener('change', refresh);
    refresh();
  }

  function submitPackageForm(pkg, confirmBtn) {
    var name = el('pf-name').value.trim();
    if (!name) {
      formError('pf-error', 'Package name is required.');
      return;
    }
    var price = Number(el('pf-price').value);
    if (isNaN(price) || price < 0) {
      formError('pf-error', 'Base price must be zero or greater.');
      return;
    }
    var gross = price - Number(el('pf-cost').value || 0);
    var negative = gross < 0;
    if (negative && !window.confirm('Expected gross profit is negative. Save anyway?')) {
      return;
    }
    confirmBtn.disabled = true;
    var payload = {
      packageId: pkg ? pkg.packageId : undefined,
      packageName: name,
      serviceType: el('pf-type').value,
      description: el('pf-description').value.trim(),
      basePrice: price,
      durationHours: el('pf-duration').value,
      expectedDirectCost: Number(el('pf-cost').value || 0),
      costCalculationMethod: el('pf-method').value,
      extraHourRate: el('pf-extra').value,
      minimumBookingAmount: el('pf-minimum').value,
      termsSummary: el('pf-terms').value.trim(),
      isCustomizable: el('pf-customizable').checked,
      isFeatured: el('pf-featured').checked
    };
    var serverFn = pkg ? 'updatePackage' : 'createPackage';
    callServer(serverFn, payload, function () {
      APP.toast(pkg ? 'Package updated.' : 'Package created.', 'success');
      APP.closeModal();
      loadPackages();
    });
  }

  function openPackageDetail(packageId) {
    callServer('getPackage', packageId, function (pkg) {
      callServer('getPackageItems', packageId, function (items) {
        var itemsHtml = items.length
          ? '<table class="data-table detail-table"><thead><tr><th>Item</th><th>Type</th><th>Qty</th><th class="num">Unit cost</th><th class="num">Total</th></tr></thead><tbody>' +
            items.map(function (item) {
              return '<tr><td>' + esc(item.itemName) + '</td><td>' + esc(PKG_UI.titleCase(item.itemType)) + '</td><td>' + esc(item.quantity) + '</td>' +
                '<td class="num">' + PKG_UI.money(item.estimatedUnitCost) + '</td><td class="num">' + PKG_UI.money(item.estimatedTotalCost) + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<p class="note-meta">No items configured.</p>';
        var body = '<div class="profile-head"><div class="profile-title">' + esc(pkg.packageName) + '</div>' +
          '<div>' + (pkg.isActive === false ? UI.badge('Inactive', 'neutral') : UI.badge('Active', 'success')) + '</div></div>' +
          '<div class="profile-grid">' +
          profileItem('Service type', PKG_UI.titleCase(pkg.serviceType)) +
          profileItem('Duration', pkg.durationHours ? pkg.durationHours + ' hours' : '-') +
          profileItem('Base price', PKG_UI.money(pkg.basePrice)) +
          profileItem('Expected direct cost', PKG_UI.money(pkg.expectedDirectCost)) +
          profileItem('Cost method', pkg.costCalculationMethod || 'MANUAL') +
          profileItem('Expected gross profit', PKG_UI.money(pkg.expectedGrossProfit)) +
          profileItem('Expected margin', Number(pkg.expectedProfitMargin || 0).toFixed(2) + '%') +
          profileItem('Extra hour rate', PKG_UI.money(pkg.extraHourRate || 0)) +
          profileItem('Minimum booking amount', PKG_UI.money(pkg.minimumBookingAmount || 0)) +
          '</div>' +
          '<div class="profile-section"><h4>Package items</h4>' + itemsHtml +
          '<button class="btn btn-secondary btn-sm mt-2" type="button" data-package-edititems="' + esc(packageId) + '">Manage items</button></div>';
        openModal('Package details', body, 'Close', function (btn) {
          APP.closeModal();
        });
        var confirmBtn = el('finance-modal-confirm');
        if (confirmBtn) {
          confirmBtn.className = 'btn btn-secondary';
          confirmBtn.textContent = 'Close';
        }
        var footer = document.querySelector('#modal-region .modal-foot');
        if (footer) {
          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'btn btn-secondary';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', function () {
            APP.closeModal();
            openPackageForm(pkg);
          });
          footer.insertBefore(editBtn, confirmBtn);
          if (pkg.isActive !== false) {
            var deactivateBtn = document.createElement('button');
            deactivateBtn.type = 'button';
            deactivateBtn.className = 'btn btn-danger';
            deactivateBtn.textContent = 'Deactivate';
            deactivateBtn.addEventListener('click', function () {
              APP.closeModal();
              confirmDeactivatePackage(pkg);
            });
            footer.appendChild(deactivateBtn);
          } else {
            var reactivateBtn = document.createElement('button');
            reactivateBtn.type = 'button';
            reactivateBtn.className = 'btn btn-secondary';
            reactivateBtn.textContent = 'Reactivate';
            reactivateBtn.addEventListener('click', function () {
              APP.closeModal();
              callServer('reactivatePackage', packageId, function () {
                APP.toast('Package reactivated.', 'success');
                loadPackages();
              });
            });
            footer.appendChild(reactivateBtn);
          }
        }
      });
    });
  }

  function profileItem(label, value) {
    return '<div class="profile-item"><span class="profile-label">' + esc(label) + '</span><span class="profile-value">' + esc(value) + '</span></div>';
  }

  function confirmDeactivatePackage(pkg) {
    var body = '<p>Deactivate package ' + esc(pkg.packageName) + '? Historical references remain valid and the package can be reactivated.</p>';
    openModal('Deactivate package', body, 'Deactivate', function (confirmBtn) {
      confirmBtn.disabled = true;
      callServer('deactivatePackage', { packageId: pkg.packageId }, function () {
        APP.toast('Package deactivated.', 'success');
        APP.closeModal();
        loadPackages();
      });
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-danger';
    }
  }

  /* ================= Item editor ================= */

  function openItemEditor(packageId) {
    callServer('getPackageItems', packageId, function (items) {
      state.editingItemsPackage = packageId;
      var body = PKG_UI.itemEditorTpl(items);
      openModal('Manage package items', body, 'Save all items', function (confirmBtn) {
        submitItems(confirmBtn);
      });
      el('item-add-row').addEventListener('click', function () {
        var rows = el('item-rows');
        rows.insertAdjacentHTML('beforeend', PKG_UI.itemRowTpl(null, rows.children.length));
        refreshItemTotals();
      });
      bindItemEvents();
      refreshItemTotals();
    });
  }

  function bindItemEvents() {
    var rows = el('item-rows');
    if (!rows) {
      return;
    }
    rows.addEventListener('input', refreshItemTotals);
    rows.addEventListener('click', function (event) {
      var removeBtn = event.target.closest('[data-item-remove]');
      if (removeBtn) {
        removeBtn.closest('.item-row').remove();
        refreshItemTotals();
      }
    });
  }

  function refreshItemTotals() {
    var rows = el('item-rows');
    if (!rows) {
      return;
    }
    var total = 0;
    var rowNodes = rows.querySelectorAll('.item-row');
    for (var i = 0; i < rowNodes.length; i++) {
      var row = rowNodes[i];
      var qty = Number(row.querySelector('[data-item-field="quantity"]').value || 1);
      var unitCost = Number(row.querySelector('[data-item-field="estimatedUnitCost"]').value || 0);
      var lineTotal = qty * unitCost;
      row.querySelector('[data-item-total]').textContent = PKG_UI.money(lineTotal);
      total += lineTotal;
    }
    el('item-total-value').textContent = PKG_UI.money(total);
  }

  function submitItems(confirmBtn) {
    var rows = el('item-rows').querySelectorAll('.item-row');
    var items = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var name = row.querySelector('[data-item-field="itemName"]').value.trim();
      if (!name) {
        formError('item-error', 'Every item needs a name.');
        return;
      }
      items.push({
        itemName: name,
        itemType: row.querySelector('[data-item-field="itemType"]').value,
        quantity: Number(row.querySelector('[data-item-field="quantity"]').value || 1),
        unit: row.querySelector('[data-item-field="unit"]').value.trim(),
        estimatedUnitCost: Number(row.querySelector('[data-item-field="estimatedUnitCost"]').value || 0)
      });
    }
    confirmBtn.disabled = true;
    callServer('savePackageItems', {
      packageId: state.editingItemsPackage,
      items: items
    }, function (data) {
      APP.toast('Package items saved. Estimated total: ' + PKG_UI.money(data.itemsTotalCost), 'success');
      APP.closeModal();
      loadPackages();
    });
  }

  /* ================= Add-ons ================= */

  function loadAddOns() {
    callServer('getPackageAddOns', { activeOnly: false, pageSize: 50 }, function (data) {
      var tbody = el('addons-table-body');
      if (!data.items.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p class="empty-title">No add-ons yet</p>' +
          '<p class="empty-hint">Create add-ons like extra hours or additional prints.</p></div></td></tr>';
        return;
      }
      var html = '';
      for (var i = 0; i < data.items.length; i++) {
        html += PKG_UI.addOnRow(data.items[i]);
      }
      tbody.innerHTML = html;
    });
  }

  function openAddOnForm(addOn) {
    var body = PKG_UI.addOnFormTpl(addOn);
    var title = addOn ? 'Edit add-on' : 'Create add-on';
    openModal(title, body, addOn ? 'Save changes' : 'Create add-on', function (confirmBtn) {
      submitAddOnForm(addOn, confirmBtn);
    });
    wireAddOnPreview();
  }

  function wireAddOnPreview() {
    var price = el('af-price');
    var cost = el('af-cost');
    if (!price || !cost) {
      return;
    }
    function refresh() {
      var profit = Number(price.value || 0) - Number(cost.value || 0);
      var margin = Number(price.value || 0) > 0 ? (profit / Number(price.value || 0)) * 100 : 0;
      el('af-profit').textContent = PKG_UI.money(profit);
      el('af-margin').textContent = margin.toFixed(2) + '%';
    }
    price.addEventListener('input', refresh);
    cost.addEventListener('input', refresh);
    refresh();
  }

  function submitAddOnForm(addOn, confirmBtn) {
    var name = el('af-name').value.trim();
    if (!name) {
      formError('af-error', 'Add-on name is required.');
      return;
    }
    var price = Number(el('af-price').value);
    if (isNaN(price) || price < 0) {
      formError('af-error', 'Selling price must be zero or greater.');
      return;
    }
    confirmBtn.disabled = true;
    var payload = {
      addOnId: addOn ? addOn.addOnId : undefined,
      addOnName: name,
      serviceType: el('af-type').value,
      description: el('af-description').value.trim(),
      sellingPrice: price,
      estimatedDirectCost: Number(el('af-cost').value || 0),
      unit: el('af-unit').value.trim()
    };
    var serverFn = addOn ? 'updatePackageAddOn' : 'createPackageAddOn';
    callServer(serverFn, payload, function () {
      APP.toast(addOn ? 'Add-on updated.' : 'Add-on created.', 'success');
      APP.closeModal();
      loadAddOns();
      loadPackages();
    });
  }

  /* ================= Shared ================= */

  function renderPagination(containerId, data, onPage) {
    var container = el(containerId);
    if (!container) {
      return;
    }
    var totalPages = Math.max(Math.ceil(data.total / data.pageSize), 1);
    if (totalPages <= 1) {
      container.innerHTML = '<span class="pagination-info">' + data.total + ' package(s)</span>';
      return;
    }
    container.innerHTML = '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page - 1) + '"' + (data.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<span class="pagination-info">Page ' + data.page + ' of ' + totalPages + '</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-page="' + (data.page + 1) + '"' + (data.page >= totalPages ? ' disabled' : '') + '>Next</button>';
    var buttons = container.querySelectorAll('[data-page]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        var page = Number(this.getAttribute('data-page'));
        if (page >= 1 && page <= totalPages) {
          onPage(page);
        }
      });
    }
  }

  function onPackagesClick(event) {
    var target = event.target;
    var action = target.closest('[data-package-action]');
    if (action) {
      if (action.getAttribute('data-package-action') === 'add') {
        openPackageForm();
      } else {
        openAddOnForm();
      }
      return;
    }
    var view = target.closest('[data-package-view]');
    if (view) {
      openPackageDetail(view.getAttribute('data-package-view'));
      return;
    }
    var editItems = target.closest('[data-package-edititems]');
    if (editItems) {
      openItemEditor(editItems.getAttribute('data-package-edititems'));
      return;
    }
    var editAddOn = target.closest('[data-addon-edit]');
    if (editAddOn) {
      callServer('getPackageAddOn', editAddOn.getAttribute('data-addon-edit'), function (addOn) {
        openAddOnForm(addOn);
      });
      return;
    }
    var deactivateAddOn = target.closest('[data-addon-deactivate]');
    if (deactivateAddOn) {
      confirmDeactivateAddOn(deactivateAddOn.getAttribute('data-addon-deactivate'));
      return;
    }
    var activateAddOn = target.closest('[data-addon-activate]');
    if (activateAddOn) {
      callServer('updatePackageAddOn', {
        addOnId: activateAddOn.getAttribute('data-addon-activate'),
        addOnName: undefined,
        sellingPrice: undefined,
        estimatedDirectCost: undefined
      }, function () {});
      callServer('getPackageAddOn', activateAddOn.getAttribute('data-addon-activate'), function (addOn) {
        callServer('updatePackageAddOn', {
          addOnId: addOn.addOnId,
          addOnName: addOn.addOnName,
          serviceType: addOn.serviceType,
          description: addOn.description,
          sellingPrice: addOn.sellingPrice,
          estimatedDirectCost: addOn.estimatedDirectCost,
          unit: addOn.unit
        }, function () {
          APP.toast('Add-on activated.', 'success');
          loadAddOns();
        });
      });
    }
  }

  function confirmDeactivateAddOn(addOnId) {
    var body = '<p>Deactivate this add-on? It remains available historically and can be activated again.</p>';
    openModal('Deactivate add-on', body, 'Deactivate', function (confirmBtn) {
      confirmBtn.disabled = true;
      callServer('deactivatePackageAddOn', { addOnId: addOnId }, function () {
        APP.toast('Add-on deactivated.', 'success');
        APP.closeModal();
        loadAddOns();
      });
    });
    var confirmBtn = el('finance-modal-confirm');
    if (confirmBtn) {
      confirmBtn.className = 'btn btn-danger';
    }
  }

  var activated = false;

  function activate() {
    if (!activated) {
      activated = true;
      el('view-packages').addEventListener('click', onPackagesClick);
      var typeFilter = el('packages-type-filter');
      for (var i = 0; i < PKG_UI.SERVICE_TYPES.length; i++) {
        typeFilter.appendChild(new Option(PKG_UI.titleCase(PKG_UI.SERVICE_TYPES[i]), PKG_UI.SERVICE_TYPES[i]));
      }
      var search = el('packages-search');
      if (search) {
        search.addEventListener('input', function () {
          state.page = 1;
          loadPackages();
        });
      }
      typeFilter.addEventListener('change', function () {
        state.page = 1;
        loadPackages();
      });
    }
    loadPackages();
    loadAddOns();
  }

  window.PACKAGES = {
    activate: activate
  };
})();
</script>
