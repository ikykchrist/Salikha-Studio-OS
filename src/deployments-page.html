<!-- deployments-page.html
     Deployments page markup (Sprint 6, WF-4/WF-5). Lists every booking's
     deployment, opens a workspace for lifecycle actions and return
     reconciliation. Only reconciliation moves inventory and cash-linked
     costs - every other state is operational planning. -->

<section id="view-deployments" class="view" hidden aria-label="Deployments">
  <div class="section-head">
    <div>
      <h2 class="section-title">Deployments</h2>
      <p class="section-hint">Event deployment forms: loading, crew sign-off, material usage, and return reconciliation.</p>
    </div>
  </div>

  <div class="status" id="deploy-status" hidden></div>

  <div class="card mt-4" id="deploy-register">
    <div class="card-head">
      <h3 class="card-title">Deployment register</h3>
      <span class="badge badge-neutral" id="deploy-count">Loading&hellip;</span>
    </div>

    <div class="filter-row" id="deploy-filters">
      <select class="field-select" id="deploy-filter-status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="PLANNED">Planned</option>
        <option value="LOADING">Loading</option>
        <option value="IN_PROGRESS">In progress</option>
        <option value="RETURNED">Returned</option>
        <option value="RECONCILED">Reconciled</option>
        <option value="CLOSED">Closed</option>
      </select>
      <input class="field-input" type="search" id="deploy-filter-search" placeholder="Search booking&hellip;" aria-label="Search deployments">
      <button class="btn btn-ghost" type="button" data-deploy-action="refresh">Refresh</button>
    </div>

    <div class="table-wrap">
      <table class="data-table" id="deploy-table">
        <thead>
          <tr>
            <th>Deployment</th>
            <th>Booking</th>
            <th>Scheduled</th>
            <th>Status</th>
            <th>Material cost</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="deploy-body"><!-- rendered --></tbody>
      </table>
    </div>

    <div class="pagination-row" id="deploy-pagination"><!-- rendered --></div>
  </div>

  <!-- Deployment workspace -->
  <div id="deploy-workspace" hidden></div>
</section>
